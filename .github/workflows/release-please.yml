name: release-please

# Manual-only until the release-bot App secrets resolve in this repo.
# tlc is private and the org is on the Free plan, so org-level secrets
# (RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY) return empty in this
# repo's workflows — the App-token step fails with "not supplied: app-id".
# Public siblings (aps/wsm) are unaffected. Re-enable the `push` trigger
# once the repo is public OR the secrets are set at repo level. Releases
# are gated on kit stabilising off alpha regardless, so no auto-cut is
# expected yet.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token from the hop-top
      # release-bot GitHub App so the release PRs are opened by
      # `release-bot[bot]` rather than the human owner — matches
      # the usp/wsm/aps sibling pattern and sidesteps CODEOWNERS
      # self-approval on .release-please-manifest.json.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

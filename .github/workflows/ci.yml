name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -buildvcs=false ./...
      - run: go vet ./...
      # Without this the flowtest shim set is empty on a clean checkout and
      # the embed assertions skip themselves, so shim-naming drift ships green.
      - run: make build-shims
      - run: go test -race -short -skip 'TestTaskShowEva|TestFlowList.*Limit|TestHumanStepGate_TimeoutKeepWaiting_ResolvedByLaterApprove' ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for --new-from-rev=origin/main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Pre-existing lint debt is tracked separately (tlc-lint-debt-cleanup).
          # Use --new-from-rev (commit-based baseline) rather than the action's
          # patch-based only-new-issues, which flags pre-existing issues on any
          # line a refactor touched (e.g. the gofumpt-driven 125-file reformat
          # in this PR made the action flag 11 pre-existing goconst hits).
          args: --new-from-rev=origin/main
        env:
          GOFLAGS: -buildvcs=false

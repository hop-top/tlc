name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -v -o bin/tlc cmd/tlc/main.go

      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check Coverage
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print $3}'
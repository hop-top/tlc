name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -buildvcs=false ./...
      - run: go vet ./...
      # Without this the flowtest shim set is empty on a clean checkout and
      # the embed assertions skip themselves, so shim-naming drift ships green.
      - run: make build-shims
      # -timeout is explicit because go's 10m default is per PACKAGE, and
      # internal/cli is a single serialized package: every CLI test holds
      # one global mutex (tests mutate cobra flag vars and viper state, so
      # they cannot run in parallel), and a growing share shell out to a
      # real built binary. That package alone runs ~440-600s under -race on
      # CI hardware, so the default left no margin and the suite failed as
      # `panic: test timed out` — with a goroutine dump naming whichever
      # test happened to hold the lock, which reads like an unrelated hang
      # in innocent code and misdirects every diagnosis.
      #
      # 25m is headroom, not a target. The guard below is what keeps this
      # honest: it fails while the suite is merely slow, rather than
      # letting it silently creep up on the new ceiling too.
      # `set -o pipefail` is load-bearing: the default GitHub shell is
      # `bash -e` WITHOUT it, so `go test | tee` would report tee's exit
      # status and a genuinely failing suite would land green.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -race -short -timeout 25m -skip 'TestFlowList.*Limit|TestHumanStepGate_TimeoutKeepWaiting_ResolvedByLaterApprove' ./... 2>&1 | tee /tmp/gotest.log
      - name: Guard internal/cli suite runtime
        run: ./scripts/check-suite-runtime.sh /tmp/gotest.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for --new-from-rev=origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Pre-existing lint debt is tracked separately (tlc-lint-debt-cleanup).
          # Use --new-from-rev (commit-based baseline) rather than the action's
          # patch-based only-new-issues, which flags pre-existing issues on any
          # line a refactor touched (e.g. the gofumpt-driven 125-file reformat
          # in this PR made the action flag 11 pre-existing goconst hits).
          args: --new-from-rev=origin/main
        env:
          GOFLAGS: -buildvcs=false

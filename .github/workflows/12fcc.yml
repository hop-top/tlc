name: 12fcc

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write          # commit-badge on push to main
  pull-requests: write     # sticky PR comment
  security-events: write   # SARIF upload to code-scanning

jobs:
  conformance:
    name: 12-factor AI-CLI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so --diff=auto resolves base

      # Pinned to a full commit SHA (supply-chain hardening) rather than a
      # mutable ref. spec-12fc has no tag yet (v0.1 alpha in flight); this is
      # main as of 2026-07-02. Re-pin to the @v1 tag SHA once published.
      - uses: hop-top/spec-12fc@e2a8341875639f4f8b74c28d3107defe15802ab7 # main @ 2026-07-02
        with:
          command: all
          paths: cmd/,internal/
          fail-on: 2,3,5
          upload-sarif: true
          pr-comment: true
          commit-badge: ${{ github.event_name == 'push' }}

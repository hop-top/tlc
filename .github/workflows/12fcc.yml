name: 12fcc

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default. contents:write is granted only to the
# push-triggered badge-commit job below, never to PR runs of the
# third-party action.
permissions:
  contents: read

# WHAT THIS WORKFLOW CHECKS, AND WHAT IT DOES NOT.
#
# One leaf runs: `kit conformance verify-no-leak` over the whole checkout
# (`paths: .`). It reads tracked .yaml/.yml/.md files (dot-directories such
# as .github/ are pruned) and reports scenario-rubric content that must not
# ship in a public repo. That is factor F10 and nothing else. It never reads
# Go source, so a green run says no command behaves in any particular way;
# it says no rubric-shaped document leaked.
#
# `verify-stories` is not run. It validates kit story files (closed-key YAML
# under e2e/stories/); tlc ships none, and docs/stories/ holds markdown user
# stories in a different format. The leaf walks every .yaml/.yml under its
# paths and fails each one that is not a kit story (config, recipes,
# policies, workflow files), and the action has no ignore input, so there is
# no path set that makes it both real and clean. Factors F1, F2, F9 and F12
# therefore stay `skip` in the matrix and the badge reflects that.
#
# Command-surface contracts are enforced in-repo by the ci workflow's test
# job, where they can actually be checked:
#   - TestStrictValidationPasses          annotations are present
#   - TestDryRunAdvertisersAreAccountedFor every advertising leaf is
#                                         exercised or exempted
#   - TestDryRunDoesNotMutateStore        leaves advertising dry-run
#                                         support do not write under it
# The behavioural factors (F3-F8, F11) are the dogfood-grade workflow's job.
#
# EMPTY SCANS FAIL.
#
# A scanner that reads zero files exits 0 and reports a pass. Both jobs run
# scripts/verify-conformance-scan.sh, which fails when any leaf scanned
# fewer than one file or its count cannot be read. The badge job runs it
# before the action too, because the action commits the badge before any
# later step could object.
#
# WHY KIT IS BUILT HERE.
#
# The action's `latest` resolves to an old kit release whose --paths does
# not walk directories (a directory argument is skipped as "unsupported
# extension", so `paths: cmd/` or `paths: .` scanned nothing). Later tags
# carry a go.mod replace directive, so `go install` of them fails, and they
# publish no prebuilt linux binary. The kit module is already a dependency of
# this repo, so the job builds that exact version from go.mod and hands it
# to the action with `kit-version: preinstalled`. Bumping kit in go.mod
# moves the scanner with it.
#
# fail-on lists the exit codes of this kit build: 2 usage, 66 leak found,
# 67 config. 6 (transient I/O) stays excluded on purpose. The action's own
# run step also exits non-zero on any non-zero leaf, so this list is a
# second gate rather than the only one.

jobs:
  # PR runs: annotate + comment, no repo write.
  conformance:
    name: 12-factor AI-CLI conformance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout
      pull-requests: write     # sticky PR comment
      security-events: write   # SARIF upload to code-scanning
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build kit (version pinned by go.mod)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit-bin"
          GOFLAGS=-buildvcs=false go build -o "$RUNNER_TEMP/kit-bin/kit" hop.top/kit/cmd/kit
          echo "$RUNNER_TEMP/kit-bin" >> "$GITHUB_PATH"

      - name: empty-scan guard self-test
        run: ./scripts/verify-conformance-scan.test.sh

      # Pinned to a full commit SHA (supply-chain hardening) rather than a
      # mutable ref. spec-12fc has no tag yet; this is main as of 2026-11-11.
      # Re-pin to the @v1 tag SHA once published.
      - uses: hop-top/spec-12fc@2da962b62b40f7cef5e9d20170d561f8b90c27c1 # main @ 2026-11-11
        with:
          command: verify-no-leak
          paths: .
          diff: ""            # scan paths, not PR diff; --diff+--paths are mutually exclusive
          kit-version: preinstalled
          fail-on: 2,66,67
          upload-sarif: true
          pr-comment: true
          commit-badge: false

      - name: fail on an empty scan
        run: ./scripts/verify-conformance-scan.sh 12fc-report.json

  # Push-to-main: same check, plus commit the refreshed badge. This is the
  # only job granted contents:write.
  conformance-badge:
    name: 12-factor AI-CLI conformance (badge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit-badge on push to main
      security-events: write   # SARIF upload to code-scanning
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build kit (version pinned by go.mod)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit-bin"
          GOFLAGS=-buildvcs=false go build -o "$RUNNER_TEMP/kit-bin/kit" hop.top/kit/cmd/kit
          echo "$RUNNER_TEMP/kit-bin" >> "$GITHUB_PATH"

      - name: empty-scan guard self-test
        run: ./scripts/verify-conformance-scan.test.sh

      # The action commits the badge as soon as its scan returns, so an
      # empty scan has to be refused before it runs. Findings are left to
      # the action (non-zero kit exit is tolerated here); only the file
      # count is checked.
      - name: refuse an empty scan before the badge is touched
        run: |
          set -uo pipefail
          kit conformance verify-no-leak --paths=. --format=json \
            >"$RUNNER_TEMP/scan.json" 2>"$RUNNER_TEMP/scan.err" || true
          ./scripts/verify-conformance-scan.sh "$RUNNER_TEMP/scan.json"

      - uses: hop-top/spec-12fc@2da962b62b40f7cef5e9d20170d561f8b90c27c1 # main @ 2026-11-11
        with:
          command: verify-no-leak
          paths: .
          diff: ""
          kit-version: preinstalled
          fail-on: 2,66,67
          upload-sarif: true
          pr-comment: false
          commit-badge: true

      - name: fail on an empty scan
        run: ./scripts/verify-conformance-scan.sh 12fc-report.json

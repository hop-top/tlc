name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: search-confirmation
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you see.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `tlc ...`
        2. See error
    validations:
      required: true

  - type: input
    id: tlc-version
    attributes:
      label: TLC version
      description: Paste the output of `tlc --version`.
      placeholder: "tlc version 0.1.0"
    validations:
      required: true

  - type: textarea
    id: terminal-info
    attributes:
      label: Terminal info
      description: OS, terminal emulator, and shell.
      placeholder: |
        OS: macOS 15.3
        Terminal: iTerm2 3.5
        Shell: zsh 5.9
    validations:
      required: false

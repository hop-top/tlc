version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - noctx
    - bodyclose
    - gocyclo
    - gocognit
    - dupl
    - goconst
    - godot
    - goprintffuncname
    - misspell
    - nakedret
    - nestif
    - nilerr
    - unconvert
    - unparam
    - whitespace
    - nolintlint
    - wrapcheck
    - testpackage
    - tparallel
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - gomoddirectives
  disable:
    - gochecknoglobals
    - funlen
    - exhaustive
    - nlreturn
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    lll:
      line-length: 120
      tab-width: 1
    godot:
      scope: declarations
      capital: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Wrap(
        - errors.Wrapf(
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G304
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - dupl
          - gosec
          - goconst
          - wrapcheck
          - testpackage
      - path: mocks?\.go
        linters:
          - unused
      - path: internal/(tui|cli)/
        linters:
          - gocyclo
          - gocognit
          - goconst
      - path: cmd/tlc/main\.go
        linters:
          - wrapcheck
      # Declarative vocabulary and palette tables. goconst counts string
      # equality, but an equal hex or axis name in two entries is two
      # independent declarations, not one constant used twice: axes.go
      # already documents why status:blocked must NOT reuse
      # priority:high's D93F0B, and tag_policy.go rejects sharing the
      # commit-type literals it mirrors from a published spec. Extracting
      # would couple entries that are meant to move separately.
      - path: internal/(labels/(axes|templates|detector)|core/tag_policy|config/loader|storage/sqlite|workspace/executor)\.go
        linters:
          - goconst
    paths:
      - ".*\\.pb\\.go$"
      - vendor
      - .worktrees
      - bin
      - coverage

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  # Omitted on purpose: golangci-lint auto-detects from go.mod (currently
  # 1.26.1). Pinning here drifts from go.mod silently — see PR #136 where
  # a stale "1.25" pin would have hidden go1.26-aware staticcheck rules.
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true

version: 2
project_name: tlc

# Tags are plain `v<version>` (root-artifact repo — single
# component at the repo root, no component prefix). GoReleaser
# parses them directly as semver, so {{.Version}} and {{.Tag}}
# resolve with no rewriting: the goreleaser-on-tag.yml reusable
# workflow in hop-top/.github skips its tag-synthesis step when the
# real tag is already bare.
#
# The reusable workflow still uploads dist/* to the
# release-please-created release via `gh release upload`, so
# `release.disable: true` below remains mandatory — GoReleaser OSS
# must not also try to publish.
#
# Reference: https://github.com/hop-top/.github/blob/main/docs/binaries/go.md

builds:
  - id: tlc
    main: ./cmd/tlc
    binary: tlc
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X hop.top/tlc/internal/cli.tlcVersion={{ .Version }}

archives:
  - id: tlc
    ids: [tlc]
    name_template: "tlc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  # release-please already authors the changelog from Conventional
  # Commits; don't duplicate it in the GitHub Release body.
  disable: true

release:
  # The reusable goreleaser-on-tag.yml workflow uploads dist/* to
  # the real release-please-created release via `gh release upload`
  # after the build. GoReleaser OSS can't target a release with a
  # different tag name than the current git tag (release.tag: is
  # Pro-only), so we disable its own release publishing entirely.
  disable: true

homebrew_casks:
  - name: tlc
    repository:
      owner: hop-top
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/hop-top/tlc
    description: "tlc — deterministic task management for terminal AI workflows."
    license: MIT
    binaries: [tlc]
    # No url template override: with plain `v<version>` tags there is
    # no synthesized tag, so GoReleaser's default asset URL (built
    # from {{ .Tag }}) already matches the real GitHub Release path.
flow_id: "flow:task-generation:1.0"
name: "Sprint Task Generation"
version: "1.0"
description: "Generate sprint tasks from templates with dependency graph"
entry_step: "define-scope"
agent: claude

config:
  category: "planning"
  inputs:
    sprint_name:
      description: "Sprint identifier (e.g. S42)"
      required: true

steps:
  define-scope:
    step_id: "define-scope"
    type: "task"
    title: "Define sprint scope for {{sprint_name}}"
    task_template:
      title: "Define scope for {{sprint_name}}"
      description: |
        Identify and document the scope for sprint {{sprint_name}}.
        List deliverables, constraints, and success criteria.
      requirements:
        capabilities: ["planning", "requirements-gathering"]

  implement-features:
    step_id: "implement-features"
    type: "task"
    title: "Implement features for {{sprint_name}}"
    depends_on: ["define-scope"]
    task_template:
      title: "Implement {{sprint_name}} features"
      description: |
        Build the features defined in {{sprint_name}} scope.
        Follow TDD: write tests first, then implementation.
      requirements:
        capabilities: ["coding", "testing"]
        tools: ["go", "git"]

  validate-delivery:
    step_id: "validate-delivery"
    type: "task"
    title: "Validate delivery for {{sprint_name}}"
    depends_on: ["implement-features"]
    task_template:
      title: "Validate {{sprint_name}} delivery"
      description: |
        Run full test suite and verify all acceptance criteria
        for sprint {{sprint_name}} are met.
      requirements:
        capabilities: ["testing", "quality-assurance"]

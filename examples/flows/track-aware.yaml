flow_id: "flow:track-aware:1.0"
name: "Track-Aware Execution"
version: "1.0"
description: |
  Operate on a track's tasks in dependency order. Resolves the track's
  task graph, executes each task sequentially respecting blocked-by
  constraints, and gates on completion before proceeding.
entry_step: "resolve-tasks"
agent: claude

config:
  category: "delivery"
  triggers:
    - "execute track tasks"
    - "run track in order"

  inputs:
    track:
      description: "Track ID to operate on"
      required: true

  procedure: |
    ## Track-Aware Execution

    Automate a track's task lifecycle respecting dependency order.

    ### Phases

    ```
    resolve-tasks      <- list track tasks, build dep graph
        |
    execute-tasks      <- run each task in topological order
        |
    verify-completion  <- gate: all tasks DONE
    ```

steps:
  resolve-tasks:
    step_id: "resolve-tasks"
    type: "task"
    title: "Resolve track {{track}} tasks"
    task_template:
      title: "Resolve tasks for track {{track}}"
      description: |
        List all TODO tasks for track {{track}}, build dependency
        graph, produce topological execution order.
    next: "execute-tasks"

  execute-tasks:
    step_id: "execute-tasks"
    type: "task"
    title: "Execute track {{track}} tasks"
    task_template:
      title: "Execute tasks for track {{track}}"
      description: |
        Run each task in dependency order for track {{track}}.
        Mark each DONE on completion. Skip already-completed tasks.
    next: "verify-completion"

  verify-completion:
    step_id: "verify-completion"
    type: "task"
    title: "Verify track {{track}} completion"
    task_template:
      title: "Verify all tasks done for track {{track}}"
      description: |
        Gate: confirm all tasks linked to track {{track}} are DONE.
        Fail step if any remain TODO or IN_PROGRESS.

flow_id: "flow:parallel-fanout:1.0"
name: "Parallel Fan-Out"
version: "1.0"
description: "Fan-out to 3 parallel steps then fan-in — validates concurrency and join semantics"
entry_step: "prepare"
agent:
  name: claude

steps:
  prepare:
    step_id: "prepare"
    type: "task"
    title: "Prepare workspace"
    task_template:
      title: "Prepare shared workspace"
      description: |
        Set up the environment and inputs needed by
        the parallel analysis steps.
      requirements:
        capabilities: ["setup"]

  lint:
    step_id: "lint"
    type: "task"
    title: "Run lint checks"
    depends_on: ["prepare"]
    task_template:
      title: "Lint source files"
      description: |
        Run static analysis and linting on all source files.
      requirements:
        capabilities: ["linting"]

  test:
    step_id: "test"
    type: "task"
    title: "Run tests"
    depends_on: ["prepare"]
    task_template:
      title: "Execute test suite"
      description: |
        Run the full test suite and collect results.
      requirements:
        capabilities: ["testing"]

  security-scan:
    step_id: "security-scan"
    type: "task"
    title: "Run security scan"
    depends_on: ["prepare"]
    task_template:
      title: "Scan for security vulnerabilities"
      description: |
        Run dependency audit and static security analysis.
      requirements:
        capabilities: ["security"]

  merge-results:
    step_id: "merge-results"
    type: "task"
    title: "Merge results"
    depends_on: ["lint", "test", "security-scan"]
    task_template:
      title: "Merge all analysis results"
      description: |
        Combine lint, test, and security results into
        a single pass/fail report.
      requirements:
        capabilities: ["reporting"]

flow_id: "flow:track-plan-review:1.0"
name: "Track Plan Review"
version: "1.0"
description: |
  On-demand review of any track's planning artifacts. Surfaces gaps,
  anti-patterns, blind spots, cross-track conflicts, security concerns,
  and alignment with best practices — before implementation begins.
entry_step: "load-track"
agent: claude

config:
  category: "quality"
  triggers:
    - "review a track plan"
    - "audit track planning"
    - "find gaps in a track"
    - "pre-implementation plan review"
    - "check for blind spots before coding"

  inputs:
    track_id:
      description: "Track ID to review (e.g. config-interactive)"
      required: true

  procedure: |
    ## Track Plan Review

    A structured pre-implementation review gate. Runs against any track's
    planning artifacts (spec.md, plan.md, ADRs, design docs) regardless of
    project, language, or domain.

    ### How to invoke

        tlc flow run examples/flows/track-plan-review.yaml --var track_id=<id>

    ### Output layout

    All artefacts are written relative to the track's directory:

        .tlc/tracks/<id>/reviews/<YYYYMMDD>/
          README.md          ← synthesised report (final output)
          lenses/
            gaps.md
            anti-patterns.md
            blind-spots.md
            cross-track.md
            security.md
            best-practices.md

    Each run creates a new date-stamped directory; prior runs are preserved.

    ### Phases

    ```
    load-track
        ↓
    setup-review-dir
        ↓
    analysis-parallel   ← 6 lenses run concurrently
        ↓
    synthesise-findings
        ↓
    gate-review         ← operator must disposition all BLOCKERs
    ```

    ### Severity levels

    | Level      | Meaning                                             |
    |------------|-----------------------------------------------------|
    | BLOCKER    | Must resolve before implementation begins           |
    | WARNING    | Should resolve; may start but must revisit          |
    | SUGGESTION | Nice to have; low risk if deferred                  |

    ### Exit outcome

    - "PLAN APPROVED — ready for implementation" (all BLOCKERs dispositioned)
    - "PLAN BLOCKED — <N> BLOCKERs pending resolution"

steps:
  # ── Phase 1: Load ────────────────────────────────────────────────────────────

  load-track:
    step_id: "load-track"
    type: "task"
    title: "Load track planning artifacts"
    task_template:
      title: "Load planning artifacts for track {{track_id}}"
      description: |
        Identify and read all planning artifacts for track {{track_id}}.

        Required (abort if absent):
          - .tlc/tracks/{{track_id}}/spec.md   — purpose, scope, constraints
          - .tlc/tracks/{{track_id}}/plan.md   — task list with deps, effort,
            priority

        Also collect if present (warn, do not abort):
          - Any ADRs linked from spec.md or plan.md
          - Design docs referenced in task descriptions
          - Related story files (docs/stories/ or equivalent)
          - tracks/tracks.md or equivalent registry of all active/planned tracks

        Output to /tmp/track-review-{{track_id}}-artifacts.md:
          - Structured summary of everything loaded
          - List any missing-but-expected files

        Abort with exit code 3 if spec.md or plan.md is absent.
      requirements:
        tools: ["tlc"]

  setup-review-dir:
    step_id: "setup-review-dir"
    type: "task"
    title: "Create date-stamped review directory"
    depends_on: ["load-track"]
    task_template:
      title: "Create review dir for {{track_id}}"
      description: |
        Determine today's date in YYYYMMDD format:
          REVIEW_DATE=$(date +%Y%m%d)

        Create the review directory tree relative to the track:
          mkdir -p .tlc/tracks/{{track_id}}/reviews/${REVIEW_DATE}/lenses

        Export REVIEW_DIR=.tlc/tracks/{{track_id}}/reviews/${REVIEW_DATE}
        for use by downstream steps.

        If the directory already exists (re-run on same day), continue —
        existing lens files will be overwritten.

  # ── Phase 2: Parallel Analysis ───────────────────────────────────────────────

  analysis-parallel:
    step_id: "analysis-parallel"
    type: "parallel"
    title: "Multi-lens analysis"
    depends_on: ["setup-review-dir"]
    children:
      - "analyze-gaps"
      - "analyze-anti-patterns"
      - "analyze-blind-spots"
      - "analyze-cross-track"
      - "analyze-security"
      - "analyze-best-practices"
    max_concurrency: 6

  analyze-gaps:
    step_id: "analyze-gaps"
    type: "task"
    title: "Gap analysis"
    task_template:
      title: "Gap analysis — {{track_id}}"
      description: |
        Scan spec.md and plan.md for planning gaps.

        Completeness:
          - Every acceptance criterion in spec.md has ≥1 task covering it
          - Every task has a non-empty description (not just a title)
          - All effort/priority fields populated
          - Dependencies (blocked-by) consistent: no dangling refs, no cycles
          - Phase tags present and contiguous (no skipped phases)

        Coverage:
          - Happy-path behaviour described
          - Error/failure modes addressed
          - Rollback or recovery path present for destructive changes
          - Observability: logging/metrics/tracing mentioned where relevant
          - Documentation tasks present if user-visible surface changes

        Output per gap: location (file#line), description, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/gaps.md.

  analyze-anti-patterns:
    step_id: "analyze-anti-patterns"
    type: "task"
    title: "Anti-pattern detection"
    task_template:
      title: "Anti-pattern detection — {{track_id}}"
      description: |
        Identify planning-level anti-patterns (planning review, not code review).

        Design anti-patterns:
          - God task: single task doing multiple unrelated things (split it)
          - Big-bang delivery: all tasks in one phase, no earlier deliverable
          - Premature optimisation: perf/scaling before correctness
          - Over-abstraction: generic framework for a single use case
          - YAGNI violations: "for future flexibility" features with no
            concrete upcoming use

        Dependency anti-patterns:
          - Long chains: 5+ sequential blocked-by steps (parallelise where safe)
          - Unnecessary coupling: tasks blocked-by unrelated work
          - Missing dependencies: tasks that clearly need X but don't declare it

        Scoping anti-patterns:
          - Scope creep: tasks that don't map to any acceptance criterion
          - Gold-plating: tasks added beyond stated goals

        Output per finding: task title, anti-pattern name, explanation, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/anti-patterns.md.

  analyze-blind-spots:
    step_id: "analyze-blind-spots"
    type: "task"
    title: "Blind spot identification"
    task_template:
      title: "Blind spot identification — {{track_id}}"
      description: |
        Surface unstated assumptions and unknown unknowns.

        Integration assumptions:
          - External services assumed available — are they?
          - Specific API versions assumed — stated explicitly?
          - Data shape/schema assumed from upstream — validated?

        Operational assumptions:
          - Deployment environment assumed (OS, runtime, infra)
          - Resource limits assumed (memory, disk, network)
          - Concurrency model assumed (single-writer, multi-reader, etc.)

        Team/process assumptions:
          - Other in-progress work assumed stable
          - Specific expertise assumed available
          - Timeline assumptions baked in without stating them

        Validation gaps:
          - No test strategy for complex logic
          - No migration strategy for data-model changes
          - No feature-flag strategy for risky rollouts
          - No load/performance baseline for perf-sensitive work

        Output per blind spot: assumption text, risk if wrong, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/blind-spots.md.

  analyze-cross-track:
    step_id: "analyze-cross-track"
    type: "task"
    title: "Cross-track conflict detection"
    task_template:
      title: "Cross-track conflict detection — {{track_id}}"
      description: |
        Using the track registry (tracks/tracks.md or equivalent), compare
        {{track_id}}'s plan against all other active and planned tracks.

        Conflict types:
          - Schema conflicts: two tracks modify the same data model incompatibly
          - API surface conflicts: two tracks change the same endpoint/CLI flag
          - Shared resource contention: exclusive access needed by both tracks
          - Ordering violations: track B needs A's output but is scheduled first
          - Duplicate work: two tracks implement the same capability
          - Contradictory decisions: track A adopts X; track B removes X

        For each conflict: tracks involved, type, description, recommended
        resolution (merge / reorder / split / defer).
        If no other tracks exist, note that and mark this step N/A.

        Output per conflict: tracks involved, type, description, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/cross-track.md.

  analyze-security:
    step_id: "analyze-security"
    type: "task"
    title: "Security concern review"
    task_template:
      title: "Security concern review — {{track_id}}"
      description: |
        Review the plan for security concerns at design level.

        Authentication & authorisation:
          - New surfaces (endpoints, CLI commands, RPC methods) — auth planned?
          - Permission model changes — least privilege upheld?
          - Token/credential handling — storage, rotation, scoping mentioned?

        Data handling:
          - PII or sensitive data flows — encryption at rest/transit planned?
          - Data retention/deletion — lifecycle addressed?
          - Input validation — boundary inputs sanitised?

        Supply chain:
          - New dependencies introduced — vetted (rsx analyze or equivalent)?
          - Pinned vs floating versions — floating noted as risk?
          - Build/CI changes — artefacts signed/verified?

        Threat surface expansion:
          - New network listeners, ports, or protocols
          - New file system paths with elevated permissions
          - New subprocess/shell execution paths

        Secrets management:
          - Hardcoded secrets risk in planned code
          - Secret injection method (env var, vault, file) specified?

        Output per concern: area, description, recommended mitigation, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/security.md.

  analyze-best-practices:
    step_id: "analyze-best-practices"
    type: "task"
    title: "Best practice alignment"
    task_template:
      title: "Best practice alignment — {{track_id}}"
      description: |
        Check alignment with engineering best practices at the plan level.

        Architecture:
          - DRY: plan duplicates logic/patterns already in the codebase?
          - SRP: each planned component has a single clear responsibility?
          - Separation of concerns: business logic, I/O, config kept separate?
          - Testability: plan favours pure functions / injected dependencies
            over global state and tight coupling?

        Observability:
          - Structured logging planned for non-trivial operations?
          - Metrics/counters for throughput-sensitive paths?
          - Trace propagation for cross-service calls?

        Resilience:
          - Retry/back-off strategy for external calls?
          - Circuit-breaker or timeout for slow dependencies?
          - Graceful degradation for partial failures?

        Maintainability:
          - File size targets respected (plan notes split if > ~500 LOC)?
          - Migration path for breaking changes described?
          - Changelog / release-note task present for user-visible changes?

        Output per concern: principle, location in plan, suggestion, severity.
        Write findings to .tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)/lenses/best-practices.md.

  # ── Phase 3: Synthesise ───────────────────────────────────────────────────────

  join-analysis:
    step_id: "join-analysis"
    type: "join"
    title: "All analysis lenses complete"
    wait_for: ["analysis-parallel"]

  synthesise-findings:
    step_id: "synthesise-findings"
    type: "task"
    title: "Synthesise and prioritise findings"
    depends_on: ["join-analysis"]
    task_template:
      title: "Synthesise review findings — {{track_id}}"
      description: |
        REVIEW_DIR=.tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)

        Read all six lens files:
          ${REVIEW_DIR}/lenses/gaps.md
          ${REVIEW_DIR}/lenses/anti-patterns.md
          ${REVIEW_DIR}/lenses/blind-spots.md
          ${REVIEW_DIR}/lenses/cross-track.md
          ${REVIEW_DIR}/lenses/security.md
          ${REVIEW_DIR}/lenses/best-practices.md

        Deduplication: merge identical issues across lenses; note which lenses
        caught each item.

        Severity classification:
          - BLOCKER: must resolve before implementation begins.
            Examples: missing acceptance criteria, circular dep, auth gap,
            cross-track schema conflict.
          - WARNING: should resolve; implementation may start but must revisit.
            Examples: anti-pattern, blind spot with known mitigation, missing
            observability.
          - SUGGESTION: low risk if deferred.
            Examples: style preference, minor coverage gap.

        Write final report to ${REVIEW_DIR}/README.md:

          ## Track Plan Review: {{track_id}}
          _Reviewed: $(date +%Y-%m-%d)_

          ### Summary
          <N> BLOCKERs, <N> WARNINGs, <N> SUGGESTIONs

          ### BLOCKERs
          1. [<lens>] <title>
             Location: <file#line>
             Detail: <explanation>
             Recommendation: <action>

          ### WARNINGs
          … (same format)

          ### SUGGESTIONs
          … (same format)

          ### Lens reports
          - [gaps](lenses/gaps.md)
          - [anti-patterns](lenses/anti-patterns.md)
          - [blind-spots](lenses/blind-spots.md)
          - [cross-track](lenses/cross-track.md)
          - [security](lenses/security.md)
          - [best-practices](lenses/best-practices.md)

          ### Disposition required
          Confirm resolution of all BLOCKERs before proceeding.

  # ── Phase 4: Gate ────────────────────────────────────────────────────────────

  gate-review:
    step_id: "gate-review"
    type: "task"
    title: "Operator gate: disposition all findings"
    depends_on: ["synthesise-findings"]
    task_template:
      title: "Operator gate — {{track_id}}"
      description: |
        REVIEW_DIR=.tlc/tracks/{{track_id}}/reviews/$(date +%Y%m%d)

        Display ${REVIEW_DIR}/README.md to the operator.

        For each BLOCKER the operator must either:
          (a) Accept → update .tlc/tracks/{{track_id}}/plan.md to resolve it
          (b) Override → document justification inline in plan.md

        For each WARNING the operator must either:
          (a) Accept → plan to resolve; add task if needed
          (b) Defer → note as a tracking item with rationale

        SUGGESTIONs: operator may accept or dismiss freely.

        Implementation MUST NOT begin until all BLOCKERs are dispositioned.

        Commit the review artefacts and any plan updates:
          git add .tlc/tracks/{{track_id}}/reviews/
          git add .tlc/tracks/{{track_id}}/plan.md   # if modified
          git commit -m "chore({{track_id}}): plan review $(date +%Y%m%d)"

        Final output (exit 0):
          "PLAN APPROVED — {{track_id}} ready for implementation"

        Final output (exit 1) if unresolved BLOCKERs remain:
          "PLAN BLOCKED — {{track_id}}: <N> BLOCKERs pending resolution"

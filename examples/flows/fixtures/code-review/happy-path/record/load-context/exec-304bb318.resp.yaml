`git worktree`, `git branch`, or `git checkout -b` directly.\ndiff --git a/Makefile b/Makefile\nindex a293cc9..3397760 100644\n--- a/Makefile\n+++ b/Makefile\n@@ -36,6 +36,24 @@ build: ## Build the binary to bin/\n \t@go build -v -o $(BIN_DIR)/$(BINARY_NAME) $(MAIN_PATH)\n \t@echo \"$(COLOR_GREEN)✓ Built $(BIN_DIR)/$(BINARY_NAME)$(COLOR_RESET)\"\n \n+SHIMS_BIN_DIR = internal/flowtest/shims/bin\n+SHIMS = claude codex gemini copilot opencode fabric llm \\\n+        npm npx uv pip composer \\\n+        docker docker-compose \\\n+        gh git \\\n+        passthrough\n+\n+build-shims: ## Compile flowtest shim binaries into internal/flowtest/shims/bin/\n+\t@echo \"$(COLOR_BLUE)Building flowtest shims...$(COLOR_RESET)\"\n+\t@mkdir -p $(SHIMS_BIN_DIR)\n+\t@for shim in $(SHIMS); do \\\n+\t\tgo build -tags shimbin -buildvcs=false -o $(SHIMS_BIN_DIR)/$$shim ./internal/flowtest/shims/$$shim/ || exit 1; \\\n+\t\techo \"  built $$shim\"; \\\n+\tdone\n+\t@go build -tags shimbin -buildvcs=false -o $(SHIMS_BIN_DIR)/tlc-shim-catchall ./internal/flowtest/shims/catchall/\n+\t@echo \"  built tlc-shim-catchall\"\n+\t@echo \"$(COLOR_GREEN)✓ Shims built to $(SHIMS_BIN_DIR)/$(COLOR_RESET)\"\n+\n test: ## Run all tests (CLI suite runs under TrueColor profile via TestMain)\n \t@echo \"$(COLOR_BLUE)Running tests...$(COLOR_RESET)\"\n \t@go test -v -race ./...\ndiff --git a/docs/plans/2026-04-01-flow-test-subcommand.md b/docs/plans/2026-04-01-flow-test-subcommand.md\nnew file mode 100644\nindex 0000000..cfe963a\n--- /dev/null\n+++ b/docs/plans/2026-04-01-flow-test-subcommand.md\n@@ -0,0 +1,332 @@\n+# Flow Test Subcommand\n+\n+**`tlc flow test`** — deterministic e2e testing for flow definitions.\n+\n+## Task list\n+\n+- [ ] `internal/flowtest/shim.go` — cassette I/O, fingerprint, env protocol, tool mode\n+- [ ] `internal/flowtest/recorder.go` — record mode: proxy + write cassettes\n+- [ ] `internal/flowtest/replayer.go` — replay mode: fingerprint → serve cassette\n+- [ ] `internal/flowtest/catchall.go` — catch-all shim: block unknown tools, hard-fail\n+- [ ] `internal/flowtest/sandbox.go` — tmp dir, git clone, shim extraction, teardown\n+- [ ] `internal/flowtest/run.go` — named run resolution: dir convention + manifest merge\n+- [ ] `internal/flowtest/shims/gh/main.go` — gh shim\n+- [ ] `internal/flowtest/shims/git/main.go` — git shim, delegates to real git on sandbox repo\n+- [ ] `internal/flowtest/shims/claude/main.go` — LLM shim\n+- [ ] `internal/flowtest/shims/codex/main.go` — LLM shim\n+- [ ] `internal/flowtest/hook.go` — post-step eva contract runner\n+- [ ] `internal/cli/flow_test_cmd.go` — cobra subcommand wired into `FlowCmd`\n+- [ ] `examples/flows/fixtures/pr-review-loop/happy-path/contracts/` — eva contracts\n+\n+---\n+\n+## Problem\n+\n+`tlc flow run` executes flows but provides no way to test them. The only\n+existing coverage is schema parsing (`flow_test.go`) and unit tests on\n+`FlowExecutor`. There is no way to verify that a flow behaves correctly\n+end-to-end — that steps transition in the right order, that tool calls\n+produce the expected output, and that agent responses satisfy their\n+contracts — without running against real infrastructure.\n+\n+## Goal\n+\n+Add `tlc flow test <flow-file>` as a first-class subcommand. It must:\n+\n+1. Run the flow end-to-end with full isolation — no side effects outside\n+   the test run.\n+2. Support **record** mode (run once against real infra, write cassettes)\n+   and **replay** mode (serve cassettes deterministically, no network).\n+3. Handle arbitrary CLI tools (`wrangler`, `docker`, custom binaries) —\n+   not just known shims — by blocking unknown tools unless a cassette\n+   exists or `--passthrough` is set.\n+4. Support multiple named test runs per flow (happy path, edge cases,\n+   regression cases) via a convention-first layout with optional manifests.\n+5. Assert each step's output against an eva contract when one exists.\n+6. Reuse `FlowExecutor` unchanged — test mode is a thin wrapper, not a\n+   fork.\n+\n+---\n+\n+## Design\n+\n+### CLI surface\n+\n+```\n+tlc flow test <flow-file> [run-name] [flags]\n+\n+Flags:\n+  --record                    Run against real infra; write/update cassettes\n+  --passthrough <tool,...>    Force live execution for named tools; update\n+                              their cassettes in place (repeatable or\n+                              comma-separated)\n+  --keep-sandbox              Retain tmp dir after run (debugging)\n+  --steps <a,b>               Run only the named steps\n+```\n+\n+Examples:\n+\n+```bash\n+# replay all named runs\n+tlc flow test examples/flows/pr-review-loop.yaml\n+\n+# replay one named run\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path\n+\n+# record a new run\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path --record\n+\n+# refresh wrangler + docker cassettes in place, replay everything else\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path \\\n+  --passthrough wrangler,docker\n+\n+# same, repeated-flag form\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path \\\n+  --passthrough wrangler --passthrough docker\n+```\n+\n+Exit codes:\n+\n+| Code | Meaning |\n+|------|---------|\n+| 0 | All steps executed; all contracts passed |\n+| 1 | Step failed or contract violated |\n+| 2 | Cassette miss in replay mode (unknown tool, no cassette, not passthrough) |\n+| 3 | Sandbox setup failure |\n+\n+### Named runs and cassette layout\n+\n+Each flow has a `fixtures/<flow-name>/` dir. Each named run is a subdir.\n+The dir name is the run name by convention. A `test.yaml` manifest is\n+optional — use it only when the dir name is ambiguous or you need to\n+declare overrides.\n+\n+```\n+examples/flows/\n+  pr-review-loop.yaml\n+  fixtures/\n+    pr-review-loop/\n+\n+      happy-path/                  ← run name by convention; no manifest needed\n+        record/\n+          step-load-pr-context/\n+            gh-pr-view.<fp>.req.json\n+            gh-pr-view.<fp>.resp.json\n+            gh-pr-diff.<fp>.req.txt\n+            gh-pr-diff.<fp>.resp.patch\n+          step-reviewer-pass/\n+            claude.<fp>.req.json\n+            claude.<fp>.resp.json\n+          step-fixer-pass/\n+            claude.<fp>.req.json\n+            claude.<fp>.resp.json\n+        contracts/\n+          step-reviewer-pass.yaml\n+          step-check-approval.yaml\n+\n+      max-iterations/              ← non-obvious exit code; manifest needed\n+        record/\n+          ...\n+        contracts/\n+          ...\n+        test.yaml\n+          name: max-iterations\n+          description: Reviewer never approves; hits max_iterations cap\n+          expected_exit: 1\n+\n+      pr-123-regression/           ← non-conventional name; manifest maps it\n+        record/\n+          ...\n+        test.yaml\n+          name: regression-pr-123\n+          description: Reproduces the double-commit bug from PR #123\n+          passthrough: [docker]\n+```\n+\n+**Manifest fields** (all optional):\n+\n+| Field | Default | Purpose |\n+|-------|---------|---------|\n+| `name` | dir name | Human-readable run name |\n+| `description` | — | Why this run exists |\n+| `expected_exit` | 0 | Assert final exit code |\n+| `passthrough` | [] | Tools to execute live in this run |\n+\n+CLI `--passthrough` takes precedence over manifest `passthrough`.\n+\n+### Tool routing\n+\n+Every CLI call a step makes is intercepted by the shim layer. The routing\n+decision for each tool:\n+\n+```\n+tool called by step\n+  │\n+  ├─ is it git?\n+  │     → git shim: rewrite GIT_DIR/GIT_WORK_TREE → exec real git on\n+  │       sandbox repo (no cassette; always isolated)\n+  │\n+  ├─ is it in --passthrough (or manifest passthrough)?\n+  │     → exec real binary → write/update cassette in place\n+  │\n+  ├─ cassette exists for this tool + argv fingerprint?\n+  │     → serve cassette response; return recorded exit code\n+  │\n+  └─ no cassette, not passthrough, not git\n+        → catch-all shim: exit 2 (TLC_SHIM_MISS); halt flow immediately\n+```\n+\n+The catch-all shim is a single binary installed as a wildcard via\n+`$PATH` — it intercepts any executable not already shimmed and applies\n+the routing logic above. This means `wrangler`, `docker`, `cargo`,\n+`just`, and any other tool a flow step calls are all covered without\n+naming them in advance.\n+\n+### Sandbox\n+\n+`FlowTestCmd` creates a hermetic sandbox before running any step:\n+\n+```\n+tmp/\n+  tlc-flow-test-<uuid>/\n+    repo/      ← git clone --local <cwd>\n+    home/      ← fake $HOME\n+    bin/       ← extracted shim binaries + catch-all shim\n+    cassettes/ ← symlink to fixtures/<flow-name>/<run-name>/record/\n+```\n+\n+Every step subprocess inherits:\n+\n+```\n+HOME                       = .../home\n+GIT_DIR                    = .../repo/.git\n+GIT_WORK_TREE              = .../repo\n+GH_CONFIG_DIR              = .../home/.config/gh\n+TLC_FLOW_TEST_MODE         = record|replay\n+TLC_FLOW_TEST_STEP         = <step-id>\n+TLC_FLOW_TEST_CASSETTE_DIR = .../cassettes/\n+TLC_FLOW_TEST_PASSTHROUGH  = wrangler,docker   ← merged from flag + manifest\n+```\n+\n+Nothing the step does can affect the caller's working tree, home\n+directory, or git state.\n+\n+### Shims\n+\n+Shim binaries are embedded in `tlc` via `go:embed`, extracted to\n+`sandbox/bin/` at test-start, and prepended to `$PATH`.\n+\n+**`git` shim** — always isolated, never cassettted:\n+\n+```\n+rewrite GIT_DIR/GIT_WORK_TREE to sandbox paths → exec real git\n+```\n+\n+All git operations execute for real against the sandbox repo.\n+\n+**`gh`, `claude`, `codex` shims** — named shims with cassette protocol:\n+\n+```\n+record / passthrough: proxy to real binary → write/update cassette\n+replay:               fingerprint argv+stdin → serve cassette response\n+miss:                 exit 2; halt flow\n+```\n+\n+**Catch-all shim** — covers every other binary:\n+\n+```\n+check TLC_FLOW_TEST_PASSTHROUGH → passthrough path if listed\n+check cassette dir → serve if found\n+else → exit 2 (TLC_SHIM_MISS)\n+```\n+\n+The catch-all is installed as `$PATH/tlc-shim-catchall` and symlinked\n+to every name not already claimed by a named shim. On macOS/Linux this\n+is done via a single wrapper script at sandbox setup time.\n+\n+### Fingerprint\n+\n+Each cassette filename encodes a short SHA256 of `argv + stdin`:\n+\n+```\n+<tool>-<sha256[:8]>.{req,resp}.<ext>\n+```\n+\n+Same argv + same stdin → same fingerprint → deterministic cassette\n+lookup across replay runs. Different invocations of the same tool in\n+the same step get distinct cassette files.\n+\n+### Eva contract wiring\n+\n+After each step, `FlowExecutor` runs a post-step hook (test mode only):\n+\n+1. Step writes output to `tmp/.../step-<id>.output.json`.\n+2. Hook looks up `contracts/<step-id>.yaml` in the run dir.\n+3. If contract exists: `eva run --dataset <output> --contract <file>`.\n+4. Eva exit 0 → next step. Exit 1 → `FlowStatusFailed`; surface\n+   violated rule name and offending value.\n+5. No contract → continue silently.\n+\n+Eva contracts are plain YAML, reusable across `flow test` and the\n+`-validated.yaml` gateway flows.\n+\n+### End-to-end sequence\n+\n+```\n+tlc flow test pr-review-loop.yaml happy-path --passthrough wrangler\n+  │\n+  ▼\n+FlowTestCmd\n+  resolve run: fixtures/pr-review-loop/happy-path/\n+  load manifest (if present); merge --passthrough flag\n+  create sandbox (tmp/tlc-flow-test-<uuid>/)\n+  git clone --local → sandbox/repo/\n+  extract shims + catch-all → sandbox/bin/\n+  inject env vars\n+  │\n+  ▼\n+FlowExecutor.Execute()          ← same code as `tlc flow run`\n+  for each step (dep order):\n+    inject TLC_FLOW_TEST_STEP=<step-id>\n+    run subprocess (shimmed PATH + sandbox env)\n+      git calls     → git shim     → sandbox/repo/ (always real, isolated)\n+      gh calls      → gh shim      → cassette or passthrough\n+      LLM calls     → llm shim     → cassette or passthrough\n+      wrangler call → catch-all    → passthrough (in TLC_FLOW_TEST_PASSTHROUGH)\n+      docker call   → catch-all    → cassette lookup → miss → exit 2\n+    step output → tmp/step-<id>.output.json\n+    post-step hook → eva contract (if exists)\n+    pass → next step\n+    fail → FlowStatusFailed\n+  │\n+  ▼\n+FlowTestCmd teardown\n+  print step table (pass/fail/skipped + tool mode used)\n+  assert expected_exit (from manifest) against actual exit\n+  rm -rf sandbox (unless --keep-sandbox)\n+  exit 0|1|2|3\n+```\n+\n+### What stays unchanged\n+\n+- `flow.yaml` — never modified\n+- `FlowExecutor` core logic — same code path as `tlc flow run`\n+- Eva contracts — same format as `-validated.yaml` gateway flows\n+\n+### Net-new code\n+\n+| Path | Purpose |\n+|------|---------|\n+| `internal/flowtest/shim.go` | Cassette I/O, fingerprint, env protocol, tool routing |\n+| `internal/flowtest/recorder.go` | Record/passthrough: proxy + write cassette |\n+| `internal/flowtest/replayer.go` | Replay: fingerprint → serve cassette |\n+| `internal/flowtest/catchall.go` | Catch-all shim: block unknown tools |\n+| `internal/flowtest/sandbox.go` | Tmp dir, clone, shim extract, teardown |\n+| `internal/flowtest/run.go` | Named run resolution: dir convention + manifest merge |\n+| `internal/flowtest/shims/gh/main.go` | gh shim |\n+| `internal/flowtest/shims/git/main.go` | git shim |\n+| `internal/flowtest/shims/claude/main.go` | LLM shim |\n+| `internal/flowtest/shims/codex/main.go` | LLM shim |\n+| `internal/flowtest/hook.go` | Post-step eva runner |\n+| `internal/cli/flow_test_cmd.go` | Cobra subcommand |\n+| `examples/flows/fixtures/*/happy-path/contracts/*.yaml` | Eva contracts |\ndiff --git a/docs/plans/2026-04-02-flow-test-subcommand-v2.md b/docs/plans/2026-04-02-flow-test-subcommand-v2.md\nnew file mode 100644\nindex 0000000..f361905\n--- /dev/null\n+++ b/docs/plans/2026-04-02-flow-test-subcommand-v2.md\n@@ -0,0 +1,865 @@\n+# Flow Test Subcommand v2 Implementation Plan\n+\n+> **For Claude:** REQUIRED SUB-SKILL: Use superpowers:executing-plans to implement this\n+> plan task-by-task.\n+\n+**Goal:** Add `tlc flow test <flow-file> [run-name]` — deterministic e2e testing for\n+flow definitions — backed by `hop.top/xrr` for all cassette I/O, fingerprinting, and\n+adapter protocol.\n+\n+**Architecture:** `FlowTestCmd` wraps `FlowExecutor` unchanged. A hermetic sandbox\n+(tmp dir + git clone + shimmed PATH) intercepts every subprocess call. Each shim binary\n+is a thin `xrr` client: record mode proxies to the real binary and writes a cassette;\n+replay mode serves the cassette. The catch-all shim handles any unrecognised binary.\n+Eva contracts run as a post-step hook after each step.\n+\n+**Tech Stack:** Go 1.24 · `hop.top/xrr` (exec adapter) · `go:embed` for shim binaries\n+· Cobra · eva CLI\n+\n+---\n+\n+## What changed from v1\n+\n+`hop.top/xrr` already ships:\n+- `xrr.FileCassette` — cassette read/write with YAML envelope\n+- `xrr.FileSession` — record / replay / passthrough dispatch\n+- `xrr.ErrCassetteMiss` — canonical miss sentinel\n+- `adapters/exec` — argv+stdin fingerprint, Request/Response types\n+\n+**Deleted from scope** (xrr owns these now):\n+- ~~`internal/flowtest/shim.go`~~ — cassette I/O + fingerprint → `xrr.FileCassette` +\n+  `adapters/exec`\n+- ~~`internal/flowtest/recorder.go`~~ → `xrr.ModeRecord` in each shim binary\n+- ~~`internal/flowtest/replayer.go`~~ → `xrr.ModeReplay` in each shim binary\n+- ~~`internal/flowtest/catchall.go`~~ (partially) → xrr session miss path\n+\n+**Remaining net-new code** (all in `internal/flowtest/`):\n+\n+| File | Purpose |\n+|------|---------|\n+| `sandbox.go` | Tmp dir, git clone, shim extraction, env injection, teardown |\n+| `run.go` | Named run resolution: dir convention + manifest merge |\n+| `hook.go` | Post-step eva contract runner |\n+| `shims/gh/main.go` | gh — thin xrr exec client |\n+| `shims/git/main.go` | git — rewrites GIT_DIR/WORK_TREE; no cassette |\n+| `shims/claude/main.go` | LLM shims (one dir each): claude, codex, gemini, |\n+| `shims/copilot/main.go` | copilot, opencode, fabric, llm |\n+| `shims/npm/main.go` | Package manager shims: npm, npx, uv, pip, composer |\n+| `shims/docker/main.go` | Container shims: docker, docker-compose |\n+| `shims/catchall/main.go` | wildcard — xrr miss → exit 2 |\n+| `../cli/flow_test_cmd.go` | Cobra subcommand wired into FlowCmd |\n+| `examples/flows/fixtures/*/contracts/*.yaml` | Eva contracts |\n+\n+### Tool routing summary\n+\n+| Category | Tools | Treatment |\n+|----------|-------|-----------|\n+| Git | `git` | Real exec, sandbox GIT_DIR rewrite, no cassette |\n+| VCS host | `gh` | Named shim, cassette-backed |\n+| LLM CLIs | `claude` `codex` `gemini` `copilot` `opencode` `fabric` `llm` | Named shim, cassette-backed |\n+| Node pkg | `npm` `npx` | Named shim, cassette-backed |\n+| Python pkg | `uv` `pip` | Named shim, cassette-backed |\n+| PHP pkg | `composer` | Named shim, cassette-backed |\n+| Containers | `docker` `docker-compose` | Named shim, cassette-backed |\n+| Local runtimes | `node` `vite` `next` | Passthrough-always (no cassette) |\n+| POSIX utils | `ls` `cat` `head` `tail` `wc` `grep` `pwd` `cp` `mkdir` `chmod` `ps` `lsof` `sleep` | Passthrough-always (no cassette) |\n+| Everything else | `wrangler` `cargo` `just` … | Catch-all → xrr miss → exit 2 |\n+\n+---\n+\n+## CLI surface\n+\n+```\n+tlc flow test <flow-file> [run-name] [flags]\n+\n+  --record                 run against real infra; write/update cassettes\n+  --passthrough <tool,...> force live execution; repeatable or comma-sep\n+  --keep-sandbox           retain tmp dir after run (debugging)\n+  --steps <a,b>            run only named steps\n+```\n+\n+Exit codes: `0` pass · `1` step/contract fail · `2` cassette miss · `3` sandbox fail\n+\n+---\n+\n+## Cassette layout\n+\n+```\n+examples/flows/\n+  pr-review-loop.yaml\n+  fixtures/\n+    pr-review-loop/\n+      happy-path/\n+        record/\n+          step-load-pr-context/\n+            exec-<fp>.req.yaml          ← xrr FileCassette format\n+            exec-<fp>.resp.yaml\n+          step-reviewer-pass/\n+            exec-<fp>.req.yaml\n+            exec-<fp>.resp.yaml\n+        contracts/\n+          step-reviewer-pass.yaml\n+          step-check-approval.yaml\n+      max-iterations/\n+        record/  ...\n+        test.yaml\n+```\n+\n+The `record/` subdir is passed directly to `xrr.NewFileCassette(dir)`. No custom\n+file format; cassettes are readable by any xrr language port.\n+\n+---\n+\n+## Env protocol (injected per step subprocess)\n+\n+```\n+HOME                       = .../home\n+GIT_DIR                    = .../repo/.git\n+GIT_WORK_TREE              = .../repo\n+GH_CONFIG_DIR              = .../home/.config/gh\n+TLC_FLOW_TEST_MODE         = record|replay\n+TLC_FLOW_TEST_STEP         = <step-id>\n+TLC_FLOW_TEST_CASSETTE_DIR = .../record/<step-id>/\n+TLC_FLOW_TEST_PASSTHROUGH  = wrangler,docker\n+```\n+\n+Each shim binary reads these env vars; no flags needed.\n+\n+---\n+\n+## Shim binary pattern (gh / claude / codex)\n+\n+Every named shim follows this template:\n+\n+```go\n+func main() {\n+    mode  := xrr.Mode(os.Getenv(\"TLC_FLOW_TEST_MODE\"))\n+    dir   := os.Getenv(\"TLC_FLOW_TEST_CASSETTE_DIR\")\n+    pass  := strings.Split(os.Getenv(\"TLC_FLOW_TEST_PASSTHROUGH\"), \",\")\n+\n+    // override mode to passthrough if this binary is in the passthrough list\n+    self  := filepath.Base(os.Args[0])\n+    if slices.Contains(pass, self) {\n+        mode = xrr.ModePassthrough\n+    }\n+\n+    c := xrr.NewFileCassette(dir)\n+    s := xrr.NewSession(mode, c)\n+\n+    req := &execadapter.Request{Argv: os.Args[1:], Stdin: readStdin()}\n+    resp, err := s.Record(context.Background(), execadapter.NewAdapter(), req,\n+        func() (xrr.Response, error) {\n+            return runReal(os.Args[0], os.Args[1:]) // exec real binary\n+        })\n+    if errors.Is(err, xrr.ErrCassetteMiss) {\n+        fmt.Fprintf(os.Stderr, \"xrr: cassette miss: %v\\n\", os.Args)\n+        os.Exit(2)\n+    }\n+    // write captured stdout/stderr, exit with recorded exit code\n+    emit(resp)\n+}\n+```\n+\n+---\n+\n+## Task 1: Add `hop.top/xrr` dependency\n+\n+**Files:**\n+- Modify: `go.mod`, `go.sum`\n+\n+**Step 1: Add dependency**\n+\n+```bash\n+cd /path/to/tlc/hops/main\n+go get hop.top/xrr@latest\n+```\n+\n+**Step 2: Verify**\n+\n+```bash\n+go build ./...\n+# Expected: clean\n+```\n+\n+**Step 3: Commit**\n+\n+```bash\n+git add go.mod go.sum\n+git commit -m \"build: add hop.top/xrr dependency\"\n+```\n+\n+---\n+\n+## Task 2: `internal/flowtest/run.go` — named run resolution\n+\n+**Files:**\n+- Create: `internal/flowtest/run.go`\n+- Create: `internal/flowtest/run_test.go`\n+\n+**Step 1: Write failing tests**\n+\n+```go\n+func TestRunResolutionByDirName(t *testing.T) {\n+    // fixtures/pr-review-loop/happy-path/ exists, no manifest\n+    dir := setupFixtureDir(t, \"pr-review-loop\", \"happy-path\", nil)\n+    runs, err := flowtest.DiscoverRuns(\"pr-review-loop\", dir)\n+    require.NoError(t, err)\n+    require.Len(t, runs, 1)\n+    assert.Equal(t, \"happy-path\", runs[0].Name)\n+    assert.Equal(t, 0, runs[0].ExpectedExit)\n+    assert.Empty(t, runs[0].Passthrough)\n+}\n+\n+func TestRunResolutionWithManifest(t *testing.T) {\n+    manifest := `\n+expected_exit: 1\n+passthrough: [docker]\n+description: hits max_iterations cap\n+`\n+    dir := setupFixtureDir(t, \"pr-review-loop\", \"max-iterations\",\n+        []byte(manifest))\n+    runs, err := flowtest.DiscoverRuns(\"pr-review-loop\", dir)\n+    require.NoError(t, err)\n+    assert.Equal(t, 1, runs[0].ExpectedExit)\n+    assert.Equal(t, []string{\"docker\"}, runs[0].Passthrough)\n+}\n+\n+func TestRunResolutionSingleNamed(t *testing.T) {\n+    dir := setupFixtureDir(t, \"pr-review-loop\", \"happy-path\", nil)\n+    setupFixtureDir(t, \"pr-review-loop\", \"edge-case\", nil)  // should be ignored\n+    runs, err := flowtest.DiscoverRuns(\"pr-review-loop\", dir,\n+        flowtest.WithRunName(\"happy-path\"))\n+    require.NoError(t, err)\n+    require.Len(t, runs, 1)\n+    assert.Equal(t, \"happy-path\", runs[0].Name)\n+}\n+```\n+\n+**Step 2: Run to verify FAIL**\n+\n+```bash\n+go test ./internal/flowtest/... 2>&1 | head -20\n+# Expected: package not found\n+```\n+\n+**Step 3: Implement**\n+\n+```go\n+package flowtest\n+\n+type RunManifest struct {\n+    Name         string   `yaml:\"name\"`\n+    Description  string   `yaml:\"description,omitempty\"`\n+    ExpectedExit int      `yaml:\"expected_exit\"`\n+    Passthrough  []string `yaml:\"passthrough,omitempty\"`\n+}\n+\n+type Run struct {\n+    Name         string\n+    Dir          string   // path to run dir (contains record/ and contracts/)\n+    RecordDir    string   // path to record/ subdir → passed to xrr.NewFileCassette\n+    ContractsDir string   // path to contracts/ subdir\n+    ExpectedExit int\n+    Passthrough  []string\n+}\n+\n+// DiscoverRuns finds all runs for flowName under baseDir. If WithRunName\n+// option is set, returns only that run.\n+func DiscoverRuns(flowName, baseDir string, opts ...Option) ([]Run, error)\n+```\n+\n+**Step 4: Run to verify PASS**\n+\n+```bash\n+go test ./internal/flowtest/... -run TestRun -v\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest): run resolution with dir convention + manifest\"\n+```\n+\n+---\n+\n+## Task 3: `internal/flowtest/sandbox.go` — hermetic sandbox\n+\n+**Files:**\n+- Create: `internal/flowtest/sandbox.go`\n+- Create: `internal/flowtest/sandbox_test.go`\n+\n+**Step 1: Write failing tests**\n+\n+```go\n+func TestSandboxCreate(t *testing.T) {\n+    sb, err := flowtest.NewSandbox(t.TempDir())\n+    require.NoError(t, err)\n+    defer sb.Teardown()\n+    // repo/ must be a valid git repo\n+    _, err = os.Stat(filepath.Join(sb.RepoDir, \".git\"))\n+    assert.NoError(t, err)\n+    // bin/ must exist\n+    _, err = os.Stat(sb.BinDir)\n+    assert.NoError(t, err)\n+    // home/ must exist\n+    _, err = os.Stat(sb.HomeDir)\n+    assert.NoError(t, err)\n+}\n+\n+func TestSandboxEnv(t *testing.T) {\n+    sb, _ := flowtest.NewSandbox(t.TempDir())\n+    defer sb.Teardown()\n+    run := &flowtest.Run{\n+        RecordDir:   t.TempDir(),\n+        Passthrough: []string{\"docker\"},\n+    }\n+    env := sb.Env(\"step-foo\", xrr.ModeReplay, run)\n+    assert.Equal(t, sb.HomeDir, envGet(env, \"HOME\"))\n+    assert.Equal(t, sb.RepoDir+\"/.git\", envGet(env, \"GIT_DIR\"))\n+    assert.Equal(t, \"replay\", envGet(env, \"TLC_FLOW_TEST_MODE\"))\n+    assert.Equal(t, \"step-foo\", envGet(env, \"TLC_FLOW_TEST_STEP\"))\n+    assert.Equal(t, run.RecordDir, envGet(env, \"TLC_FLOW_TEST_CASSETTE_DIR\"))\n+    assert.Equal(t, \"docker\", envGet(env, \"TLC_FLOW_TEST_PASSTHROUGH\"))\n+}\n+\n+func TestSandboxKeep(t *testing.T) {\n+    sb, _ := flowtest.NewSandbox(t.TempDir())\n+    sb.Keep = true\n+    dir := sb.RootDir\n+    sb.Teardown()\n+    _, err := os.Stat(dir)\n+    assert.NoError(t, err) // must still exist\n+}\n+```\n+\n+**Step 2: Run to verify FAIL**\n+\n+```bash\n+go test ./internal/flowtest/... -run TestSandbox 2>&1 | head -20\n+```\n+\n+**Step 3: Implement**\n+\n+```go\n+type Sandbox struct {\n+    RootDir string\n+    RepoDir string\n+    BinDir  string\n+    HomeDir string\n+    Keep    bool\n+}\n+\n+// NewSandbox creates tmp/tlc-flow-test-<uuid>/{repo,bin,home} and\n+// git clone --local <cwd> into repo/.\n+func NewSandbox(cwd string) (*Sandbox, error)\n+\n+// Env returns the os.Environ()-style slice to inject into each step subprocess.\n+func (s *Sandbox) Env(stepID string, mode xrr.Mode, run *Run) []string\n+\n+// ExtractShims copies embedded shim binaries into BinDir and creates\n+// catch-all symlinks for any name not already present.\n+func (s *Sandbox) ExtractShims() error\n+\n+// Teardown removes the sandbox root unless Keep is set.\n+func (s *Sandbox) Teardown()\n+```\n+\n+Shims are embedded via:\n+\n+```go\n+//go:embed shims/bin/*\n+var shimsFS embed.FS\n+```\n+\n+(Shim binaries compiled in Tasks 4–8; embedded in Task 9.)\n+\n+**Step 4: Run to verify PASS**\n+\n+```bash\n+go test ./internal/flowtest/... -run TestSandbox -v\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest): hermetic sandbox with git clone + env injection\"\n+```\n+\n+---\n+\n+## Task 4: `shims/git/main.go` — git shim\n+\n+**Files:**\n+- Create: `internal/flowtest/shims/git/main.go`\n+\n+**Step 1: Implement**\n+\n+No cassette. Rewrites env and delegates to real git:\n+\n+```go\n+func main() {\n+    sb := os.Getenv(\"GIT_WORK_TREE\") // set by sandbox\n+    real, err := exec.LookPath(\"git\")\n+    // ... error handling\n+    cmd := exec.Command(real, os.Args[1:]...)\n+    cmd.Env = append(os.Environ(),\n+        \"GIT_DIR=\"+sb+\"/.git\",\n+        \"GIT_WORK_TREE=\"+sb,\n+    )\n+    cmd.Stdin, cmd.Stdout, cmd.Stderr = os.Stdin, os.Stdout, os.Stderr\n+    cmd.Run()\n+    os.Exit(cmd.ProcessState.ExitCode())\n+}\n+```\n+\n+**Step 2: Build + smoke test**\n+\n+```bash\n+go build -o /tmp/test-git-shim ./internal/flowtest/shims/git/\n+GIT_WORK_TREE=/tmp /tmp/test-git-shim --version\n+# Expected: git version x.y.z\n+```\n+\n+**Step 3: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest/shims): git shim — rewrites GIT_DIR to sandbox\"\n+```\n+\n+---\n+\n+## Task 5: `shims/gh/main.go` — gh shim\n+\n+**Files:**\n+- Create: `internal/flowtest/shims/gh/main.go`\n+\n+**Step 1: Implement** using the shim template from the design section above.\n+`runReal` execs the real `gh` binary; `emit` writes stdout/stderr and exits with\n+the recorded exit code.\n+\n+**Step 2: Build + smoke test (passthrough mode)**\n+\n+```bash\n+go build -o /tmp/test-gh-shim ./internal/flowtest/shims/gh/\n+TLC_FLOW_TEST_MODE=passthrough \\\n+TLC_FLOW_TEST_CASSETTE_DIR=/tmp/cassettes \\\n+/tmp/test-gh-shim --version\n+# Expected: gh version x.y.z (passthrough)\n+```\n+\n+**Step 3: Test replay miss → exit 2**\n+\n+```bash\n+TLC_FLOW_TEST_MODE=replay \\\n+TLC_FLOW_TEST_CASSETTE_DIR=/tmp/empty-dir \\\n+/tmp/test-gh-shim pr view 1\n+echo \"exit: $?\"\n+# Expected: exit: 2\n+```\n+\n+**Step 4: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest/shims): gh shim\"\n+```\n+\n+---\n+\n+## Task 6: LLM shims — claude, codex, gemini, copilot, opencode\n+\n+Same pattern as Task 5. All five are thin wrappers around `runReal` + xrr session.\n+\n+Binaries: `claude`, `codex`, `gemini`, `copilot` (note: `gh copilot` is a gh\n+extension; shim intercepts the `copilot` argv prefix), `opencode`,\n+`fabric` (danielmiessler/fabric — Go), `llm` (simonw/llm — Python).\n+\n+**Step 1: Implement all** (copy gh shim template; only `self` name differs)\n+\n+**Step 2: Build all**\n+\n+```bash\n+go build -o /tmp/test-claude-shim   ./internal/flowtest/shims/claude/\n+go build -o /tmp/test-codex-shim    ./internal/flowtest/shims/codex/\n+go build -o /tmp/test-gemini-shim   ./internal/flowtest/shims/gemini/\n+go build -o /tmp/test-copilot-shim  ./internal/flowtest/shims/copilot/\n+go build -o /tmp/test-opencode-shim ./internal/flowtest/shims/opencode/\n+go build -o /tmp/test-fabric-shim   ./internal/flowtest/shims/fabric/\n+go build -o /tmp/test-llm-shim      ./internal/flowtest/shims/llm/\n+```\n+\n+**Step 3: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest/shims): LLM shims (claude, codex, gemini, copilot, opencode, fabric, llm)\"\n+```\n+\n+---\n+\n+## Task 7: `shims/catchall/main.go` — wildcard shim\n+\n+**Files:**\n+- Create: `internal/flowtest/shims/catchall/main.go`\n+\n+**Step 1: Implement**\n+\n+```go\n+func main() {\n+    mode := xrr.Mode(os.Getenv(\"TLC_FLOW_TEST_MODE\"))\n+    dir  := os.Getenv(\"TLC_FLOW_TEST_CASSETTE_DIR\")\n+    pass := strings.Split(os.Getenv(\"TLC_FLOW_TEST_PASSTHROUGH\"), \",\")\n+    self := filepath.Base(os.Args[0]) // the name it was invoked as\n+\n+    if slices.Contains(pass, self) {\n+        mode = xrr.ModePassthrough\n+    }\n+\n+    c := xrr.NewFileCassette(dir)\n+    s := xrr.NewSession(mode, c)\n+\n+    req := &execadapter.Request{Argv: os.Args, Stdin: readStdin()}\n+    resp, err := s.Record(context.Background(), execadapter.NewAdapter(), req,\n+        func() (xrr.Response, error) { return runReal(self, os.Args[1:]) })\n+\n+    if errors.Is(err, xrr.ErrCassetteMiss) {\n+        fmt.Fprintf(os.Stderr,\n+            \"tlc-flow-test: cassette miss for %q; re-run with --record\\n\", self)\n+        os.Exit(2)\n+    }\n+    emit(resp)\n+}\n+```\n+\n+**Step 2: Build + test miss path**\n+\n+```bash\n+go build -o /tmp/tlc-shim-catchall ./internal/flowtest/shims/catchall/\n+TLC_FLOW_TEST_MODE=replay \\\n+TLC_FLOW_TEST_CASSETTE_DIR=/tmp/empty \\\n+/tmp/tlc-shim-catchall wrangler deploy\n+echo \"exit: $?\"   # Expected: 2\n+```\n+\n+**Step 3: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest/shims): catch-all shim using xrr miss path\"\n+```\n+\n+---\n+\n+## Task 8: `internal/flowtest/hook.go` — eva contract runner\n+\n+**Files:**\n+- Create: `internal/flowtest/hook.go`\n+- Create: `internal/flowtest/hook_test.go`\n+\n+**Step 1: Write failing tests**\n+\n+```go\n+func TestHookNoContract(t *testing.T) {\n+    h := flowtest.NewHook(t.TempDir()) // empty contracts dir\n+    err := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+    assert.NoError(t, err) // no contract → pass silently\n+}\n+\n+func TestHookContractPass(t *testing.T) {\n+    dir := t.TempDir()\n+    writeContract(t, dir, \"step-foo.yaml\", `rules: []`) // trivial pass\n+    h := flowtest.NewHook(dir)\n+    err := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+    assert.NoError(t, err)\n+}\n+\n+func TestHookContractFail(t *testing.T) {\n+    // requires eva binary in PATH; skip if absent\n+    if _, err := exec.LookPath(\"eva\"); err != nil {\n+        t.Skip(\"eva not in PATH\")\n+    }\n+    dir := t.TempDir()\n+    writeContract(t, dir, \"step-foo.yaml\", `\n+rules:\n+  - name: must_have_field\n+    expr: \"output.missing_field != null\"\n+`)\n+    h := flowtest.NewHook(dir)\n+    err := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+    var ce *flowtest.ContractError\n+    require.ErrorAs(t, err, &ce)\n+    assert.Equal(t, \"step-foo\", ce.StepID)\n+}\n+```\n+\n+**Step 2: Run to verify FAIL**\n+\n+```bash\n+go test ./internal/flowtest/... -run TestHook 2>&1 | head -20\n+```\n+\n+**Step 3: Implement**\n+\n+```go\n+type Hook struct { contractsDir string }\n+func NewHook(contractsDir string) *Hook\n+\n+type ContractError struct {\n+    StepID  string\n+    Rule    string\n+    Message string\n+}\n+func (e *ContractError) Error() string\n+\n+// Run looks for <contractsDir>/<stepID>.yaml; if present, writes output to a\n+// tmp file and execs: eva run --dataset <tmp> --contract <contract>\n+// Eva exit 0 → nil. Exit 1 → ContractError. Missing contract → nil.\n+func (h *Hook) Run(stepID string, output map[string]any) error\n+```\n+\n+**Step 4: Run to verify PASS**\n+\n+```bash\n+go test ./internal/flowtest/... -run TestHook -v\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest): post-step eva contract hook\"\n+```\n+\n+---\n+\n+## Task 9: Embed shim binaries + wire sandbox extraction\n+\n+**Files:**\n+- Modify: `internal/flowtest/sandbox.go`\n+- Create: `internal/flowtest/embed.go`\n+\n+**Step 1: Build shims to embedded path**\n+\n+Add a `//go:generate` or `Makefile` target that compiles each shim for the host OS/arch\n+into `internal/flowtest/shims/bin/`:\n+\n+```bash\n+GOOS=darwin GOARCH=arm64 go build \\\n+  -o internal/flowtest/shims/bin/gh \\\n+  ./internal/flowtest/shims/gh/\n+# repeat for git, claude, codex, tlc-shim-catchall\n+```\n+\n+**Step 2: Add embed directive**\n+\n+```go\n+// embed.go\n+package flowtest\n+\n+import \"embed\"\n+\n+//go:embed shims/bin/*\n+var shimsFS embed.FS\n+```\n+\n+**Step 3: Implement `ExtractShims`**\n+\n+Extract each binary from `shimsFS` into `sandbox.BinDir`, `chmod +x`.\n+Create catch-all symlinks for common tools not already in BinDir:\n+`wrangler`, `docker`, `cargo`, `just`, `npx` → `tlc-shim-catchall`.\n+\n+**Step 4: Test extraction**\n+\n+```go\n+func TestSandboxExtractShims(t *testing.T) {\n+    sb, _ := flowtest.NewSandbox(t.TempDir())\n+    defer sb.Teardown()\n+    require.NoError(t, sb.ExtractShims())\n+    for _, name := range []string{\"gh\", \"git\", \"claude\", \"codex\",\n+        \"tlc-shim-catchall\", \"wrangler\", \"docker\"} {\n+        path := filepath.Join(sb.BinDir, name)\n+        info, err := os.Lstat(path)\n+        require.NoError(t, err, \"missing: %s\", name)\n+        // must be executable or symlink\n+        assert.True(t, info.Mode()&0o111 != 0 || info.Mode()&os.ModeSymlink != 0)\n+    }\n+}\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"feat(flowtest): embed + extract shim binaries into sandbox\"\n+```\n+\n+---\n+\n+## Task 10: `internal/cli/flow_test_cmd.go` — Cobra subcommand\n+\n+**Files:**\n+- Create: `internal/cli/flow_test_cmd.go`\n+- Create: `internal/cli/flow_test_cmd_test.go`\n+\n+**Step 1: Write e2e test (uses real sandbox, committed fixture cassettes)**\n+\n+```go\n+func TestFlowTestReplay(t *testing.T) {\n+    // requires examples/flows/fixtures/pr-review-loop/happy-path/record/ to be\n+    // populated (committed cassettes)\n+    cmd := newTestCmd(t)\n+    err := cmd.Execute([]string{\n+        \"flow\", \"test\",\n+        \"examples/flows/pr-review-loop.yaml\",\n+        \"happy-path\",\n+    })\n+    assert.NoError(t, err)\n+}\n+\n+func TestFlowTestCassetteMiss(t *testing.T) {\n+    cmd := newTestCmd(t)\n+    err := cmd.Execute([]string{\n+        \"flow\", \"test\",\n+        \"examples/flows/pr-review-loop.yaml\",\n+        \"happy-path\",\n+    })\n+    // cassettes not present → exit 2\n+    var exitErr *ExitCodeError\n+    require.ErrorAs(t, err, &exitErr)\n+    assert.Equal(t, 2, exitErr.Code)\n+}\n+```\n+\n+**Step 2: Run to verify FAIL**\n+\n+```bash\n+go test ./internal/cli/... -run TestFlowTest 2>&1 | head -20\n+```\n+\n+**Step 3: Implement**\n+\n+```go\n+func NewFlowTestCmd() *cobra.Command {\n+    var record      bool\n+    var passthrough []string\n+    var keepSandbox bool\n+    var steps       []string\n+\n+    cmd := &cobra.Command{\n+        Use:   \"test <flow-file> [run-name]\",\n+        Short: \"Run deterministic e2e tests against a flow definition\",\n+        Args:  cobra.RangeArgs(1, 2),\n+        RunE:  runFlowTest,\n+    }\n+    cmd.Flags().BoolVar(&record, \"record\", false, \"...\")\n+    cmd.Flags().StringArrayVar(&passthrough, \"passthrough\", nil, \"...\")\n+    cmd.Flags().BoolVar(&keepSandbox, \"keep-sandbox\", false, \"...\")\n+    cmd.Flags().StringSliceVar(&steps, \"steps\", nil, \"...\")\n+    return cmd\n+}\n+```\n+\n+`runFlowTest`:\n+1. `flowtest.DiscoverRuns(flowName, fixturesDir, opts...)`\n+2. For each run: `flowtest.NewSandbox(cwd)` → `sb.ExtractShims()` →\n+   `FlowExecutor.Execute()` with shimmed env → post-step `hook.Run()` →\n+   `sb.Teardown()`\n+3. Assert `run.ExpectedExit` against actual exit\n+4. Print step table (pass/fail/skipped + mode used)\n+5. Return appropriate exit code\n+\n+Wire into `FlowCmd` as `test` subcommand.\n+\n+**Step 4: Run to verify PASS**\n+\n+```bash\n+go test ./internal/cli/... -run TestFlowTest -v\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"feat(cli): flow test subcommand\"\n+```\n+\n+---\n+\n+## Task 11: Eva contracts for pr-review-loop happy-path\n+\n+**Files:**\n+- Create: `examples/flows/fixtures/pr-review-loop/happy-path/contracts/step-reviewer-pass.yaml`\n+- Create: `examples/flows/fixtures/pr-review-loop/happy-path/contracts/step-check-approval.yaml`\n+\n+**Step 1: Inspect pr-review-loop.yaml step outputs**\n+\n+```bash\n+cat examples/flows/pr-review-loop.yaml\n+```\n+\n+Identify what each step writes to its output JSON and what properties should be\n+asserted (e.g. `approved == true`, `review_comment != \"\"`).\n+\n+**Step 2: Write contracts** using eva YAML contract format (same as `-validated.yaml`\n+gateway flows in `examples/flows/`).\n+\n+**Step 3: Run against a live record (one-time)**\n+\n+```bash\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path --record\n+```\n+\n+**Step 4: Run in replay to confirm contracts pass**\n+\n+```bash\n+tlc flow test examples/flows/pr-review-loop.yaml happy-path\n+```\n+\n+**Step 5: Commit**\n+\n+```bash\n+git commit -m \"test(flowtest): eva contracts + cassettes for pr-review-loop happy-path\"\n+```\n+\n+---\n+\n+## Task 12: Update AGENTS.md doc validation script\n+\n+**Files:**\n+- Modify: `scripts/validate-doc-commands.sh`\n+- Modify: `AGENTS.md` (add `flow test` subcommand docs)\n+\n+**Step 1: Add `flow test` to AGENTS.md CLI surface table**\n+\n+**Step 2: Add check to validation script**\n+\n+```bash\n+tlc flow test --help | grep -q \"run-name\" || fail \"flow test missing run-name arg\"\n+```\n+\n+**Step 3: Run validation**\n+\n+```bash\n+make validate-docs\n+```\n+\n+**Step 4: Commit**\n+\n+```bash\n+git commit -m \"docs: add flow test subcommand to AGENTS.md + validation\"\n+```\n+\n+---\n+\n+## Sequencing\n+\n+```\n+Task 1  (add xrr dep)\n+  ├── Task 2 (run.go)\n+  ├── Task 3 (sandbox.go — no shims yet)\n+  ├── Task 4 (git shim)\n+  ├── Task 5 (gh shim)\n+  ├── Task 6 (claude + codex shims)\n+  └── Task 7 (catchall shim)\n+        └── Task 9 (embed + extract) ← needs all shims compiled\n+              ├── Task 8 (hook.go) ← independent; can run earlier\n+              └── Task 10 (flow_test_cmd.go) ← needs Task 2+3+8+9\n+                    └── Task 11 (eva contracts + cassettes)\n+                          └── Task 12 (docs + validation)\n+```\n+\n+Tasks 2–7 are independent of each other after Task 1 and can run in parallel.\ndiff --git a/examples/flows/README.md b/examples/flows/README.md\nnew file mode 100644\nindex 0000000..6c5cb41\n--- /dev/null\n+++ b/examples/flows/README.md\n@@ -0,0 +1,317 @@\n+# Flow Examples\n+\n+Declarative flow definitions for common engineering workflows.\n+Each flow conforms to `task-flow-spec-0.1.md`.\n+\n+## Flows\n+\n+### Base flows\n+\n+| File | Purpose | Entry |\n+|------|---------|-------|\n+| [oss-release-prep.yaml](oss-release-prep.yaml) | Prepare a codebase for initial OSS release | `audit-repo` |\n+| [cheatsheet-update.yaml](cheatsheet-update.yaml) | Create/update human + agent cheatsheets | `audit-surface` |\n+| [create-agent-skill.yaml](create-agent-skill.yaml) | Create a folder-based agent skill for any tool | `decide-shape` |\n+| [code-review.yaml](code-review.yaml) | Systematic code review against plan and standards | `load-context` |\n+| [systematic-debugging.yaml](systematic-debugging.yaml) | Structured bug investigation | — |\n+| [test-driven-development.yaml](test-driven-development.yaml) | TDD workflow | — |\n+| [verification-before-completion.yaml](verification-before-completion.yaml) | Evidence-before-assertions gate | `identify-claims` |\n+| [writing-plans.yaml](writing-plans.yaml) | Structured plan authoring | — |\n+| [executing-plans.yaml](executing-plans.yaml) | Plan execution with tracking | — |\n+| [brainstorming.yaml](brainstorming.yaml) | Divergent idea generation | — |\n+| [finishing-development-branch.yaml](finishing-development-branch.yaml) | Branch completion + integration | `verify-completion` |\n+| [pr-review-loop.yaml](pr-review-loop.yaml) | Automated reviewer→fixer loop until PR approved | `load-pr-context` |\n+\n+### Validated variants (`-validated.yaml`)\n+\n+Extend the base flows with two additional layers:\n+\n+- **eva** (`~/.w/ideacrafterslabs/eva`) — deterministic contract gating between\n+  phases; Tier 1 evaluators only (zero LLM calls, binary exit codes)\n+- **routellm** (`~/.w/ideacrafterslabs/routellm`) — cost-routing for LLM-heavy\n+  generative steps; routes cheap queries to weak model, expensive ones to strong\n+\n+| File | Base flow | eva gates added | routellm-routed steps |\n+|------|-----------|-----------------|-----------------------|\n+| [oss-release-prep-validated.yaml](oss-release-prep-validated.yaml) | oss-release-prep | 6 gates (audit, legal, docs, community, cicd, release) | 3 (readme→strong, contributing→medium, security→weak) |\n+| [cheatsheet-update-validated.yaml](cheatsheet-update-validated.yaml) | cheatsheet-update | 3 gates (structure, flags, render) | 3 (human→medium, agent→strong, cross-check→medium) |\n+| [create-agent-skill-validated.yaml](create-agent-skill-validated.yaml) | create-agent-skill | 4 gates (structure, frontmatter, scripts, discovery) | 4 (skill-md→strong, references→medium, scripts→medium, description→strong) |\n+\n+---\n+\n+## Tool-Assisted Steps\n+\n+Several flows contain steps where a known tool does the deterministic\n+work — the LLM only interprets results or makes decisions requiring\n+judgement. This section documents every such step, the tool used, and\n+the token budget saved vs. pure-LLM execution.\n+\n+Token estimates use a rough model:\n+- **LLM-only** — agent reads context, reasons through the operation,\n+  generates output: ~2 000–8 000 tokens per step depending on content size\n+- **Tool-assisted** — agent runs a command, reads a short report,\n+  acts on failures only: ~200–600 tokens per step\n+\n+---\n+\n+### `oss-release-prep` — tool-assisted steps\n+\n+| Step | Tool | What the tool does | Tokens saved |\n+|------|------|--------------------|-------------|\n+| `audit-repo` | **gitleaks** + git one-liner | Full-history secret scan; large-blob list | ~4 000 |\n+| `add-license` | **gh CLI** (`gh repo edit --license`) | Writes canonical LICENSE text; no generation | ~2 500 |\n+| `add-copyright-headers` | **addlicense** | Walks tree, applies SPDX headers, skips vendor | ~3 500 |\n+| `add-code-of-conduct` | **npx covgen** | Emits Contributor Covenant v2.1 verbatim | ~2 000 |\n+| `add-dependency-bot` | **npx create-renovate-config** / heredoc | Writes dependabot.yml or renovate.json | ~1 500 |\n+| `add-release-workflow` | **goreleaser init** / **semantic-release** | Scaffolds full release pipeline YAML | ~4 000 |\n+| `run-full-test-suite` | **just / make** | Runs tests; exits non-zero on failure | ~1 000 |\n+| `cut-initial-tag` | **gh release create** | Tags, pushes, creates GitHub Release with notes | ~1 500 |\n+\n+**Subtotal saved: ~20 000 tokens** across 8 of 22 steps.\n+\n+Steps that remain LLM-only (judgement required):\n+`write-readme`, `write-contributing`, `write-security-policy`,\n+`add-issue-templates`, `add-pr-template`, `add-codeowners`,\n+`final-review`, `cut-initial-tag` (version decision).\n+\n+---\n+\n+### `cheatsheet-update` — tool-assisted steps\n+\n+| Step | Tool | What the tool does | Tokens saved |\n+|------|------|--------------------|-------------|\n+| `audit-surface` | **validate-doc-commands.sh** + `--help` sweep | Enumerates all flags; diffs against docs; exits non-zero on stale | ~3 000 |\n+| `validate-human-examples` | **validate-doc-commands.sh** + **markdownlint** | Probes every flag in human cheatsheet; structure check | ~2 500 |\n+| `validate-agent-examples` | **validate-doc-commands.sh** + bypass-flag probes | Same + targeted grep checks on bypass flags | ~2 500 |\n+| `write-cheatsheets` (gate) | **validate-doc-commands.sh** | Final exit-0 gate before commit | ~500 |\n+| `verify-render` | **markdownlint** + **prettier** | Table structure, fencing, heading order, line length | ~1 500 |\n+\n+**Subtotal saved: ~10 000 tokens** across 5 of 14 steps.\n+\n+Steps that remain LLM-only:\n+`read-cli-spec`, `read-agents-md`, `read-existing-cheatsheets`,\n+`draft-human-cheatsheet`, `draft-agent-cheatsheet`, `cross-check`.\n+\n+---\n+\n+### `create-agent-skill` — tool-assisted steps\n+\n+| Step | Tool | What the tool does | Tokens saved |\n+|------|------|--------------------|-------------|\n+| `audit-tool` | **`--help` sweep** + **just --list** / **OpenAPI dump** | Dumps full CLI surface and ops list to temp files | ~3 500 |\n+| `scaffold-folder` | **skill-creator init_skill.py** | Creates canonical folder layout + frontmatter placeholder | ~1 000 |\n+| `validate-structure` | **skill-creator quick_validate.py** | Checks name format, description length, word count, line length | ~2 000 |\n+| `validate-examples` | **shellcheck** + flag probes | Lints all scripts; probes every documented flag | ~2 500 |\n+| `register-skill` | **ln + ls** | Installs symlinks; verifies they resolve | ~500 |\n+\n+**Subtotal saved: ~9 500 tokens** across 5 of 16 steps.\n+\n+Steps that remain LLM-only:\n+`decide-shape`, `research-errors`, `research-ops`,\n+`write-skill-md`, `write-references`, `write-scripts`, `write-description`.\n+\n+---\n+\n+## Total Estimated Savings\n+\n+| Flow | Steps with tooling | ~Tokens saved |\n+|------|--------------------|---------------|\n+| `oss-release-prep` | 8 / 22 | ~20 000 |\n+| `cheatsheet-update` | 5 / 14 | ~10 000 |\n+| `create-agent-skill` | 5 / 16 | ~9 500 |\n+| **Total** | **18 / 52** | **~39 500** |\n+\n+At Sonnet pricing (~$3 / 1M input tokens) that is roughly **$0.12 saved\n+per full flow run** — but the more important gain is determinism:\n+tools either pass or fail with an exact error; the LLM never has to\n+re-read or re-derive a result that a binary already computed.\n+\n+---\n+\n+---\n+\n+## eva — Deterministic Contract Gating\n+\n+eva (`~/.w/ideacrafterslabs/eva`) enforces behavioral contracts between flow\n+phases. A gate step runs `eva run --dataset <path> --no-tui` and the flow\n+cannot proceed if eva exits non-zero.\n+\n+### Why eva, not the LLM\n+\n+| | LLM check | eva gate |\n+|-|-----------|----------|\n+| Deterministic | No | Yes — same inputs always same result |\n+| Token cost | 500–2 000 / check | 0 — Tier 1 evaluators use no LLM |\n+| Speed | 2–10 s | < 200 ms |\n+| Auditable | Hard | Every result stored in SQLite |\n+\n+### Gate anatomy\n+\n+Each gate step carries an `eva_contract_body` field showing the contract\n+inline for reference. At runtime the contract lives in `eva_contracts_dir`:\n+\n+```\n+evals/\n+  oss-release/\n+    oss-audit.yaml        oss-audit-dataset.yaml\n+    oss-legal.yaml        oss-legal-dataset.yaml\n+    oss-docs.yaml         oss-docs-dataset.yaml\n+    oss-community.yaml    oss-community-dataset.yaml\n+    oss-cicd.yaml         oss-cicd-dataset.yaml\n+    oss-release.yaml      oss-release-dataset.yaml\n+  cheatsheet/\n+    cheatsheet-structure.yaml   structure-dataset.yaml\n+    cheatsheet-flags.yaml       flags-dataset.yaml\n+    cheatsheet-render.yaml      render-dataset.yaml\n+  agent-skill/\n+    skill-structure.yaml        structure-dataset.yaml\n+    skill-frontmatter.yaml      frontmatter-dataset.yaml\n+    skill-scripts.yaml          scripts-dataset.yaml\n+```\n+\n+### Dataset convention\n+\n+Each dataset sends the artifact being validated as the \"response\" field\n+of a synthetic test case. The gate contract's evaluators then assert\n+structural properties against that response.\n+\n+```yaml\n+# evals/oss-release/oss-legal-dataset.yaml\n+name: oss_legal\n+target: file://LICENSE   # or a shell script that cats the relevant files\n+tests:\n+  - id: license_file\n+    input: \"validate LICENSE file\"\n+  - id: copyright_headers\n+    input: \"validate source file headers\"\n+```\n+\n+### Tier 1 evaluators used in gates\n+\n+| Evaluator | What it checks | Token cost |\n+|-----------|---------------|------------|\n+| `contains` | Substring present in response | 0 |\n+| `regex` | Pattern match/no-match in response | 0 |\n+| `json_schema_valid` | Response is valid JSON/YAML against schema | 0 |\n+\n+`mode: binary` — fail if evaluator returns 0.\n+`mode: warn` — record but do not fail the run.\n+`mode: threshold` — fail if score < min_score.\n+\n+---\n+\n+## routellm — LLM Cost Routing\n+\n+routellm (`~/.w/ideacrafterslabs/routellm`) routes LLM calls between a strong\n+(expensive, high-quality) model and a weak (cheap, fast) model based on\n+estimated query complexity.\n+\n+### Why routellm for these flows\n+\n+The validated flows contain LLM-generative steps that differ sharply in\n+quality requirements:\n+\n+- Writing a skill's **discovery description** or a project's **README** is\n+  high-stakes — poor quality means the artifact is never used. → strong model.\n+- Writing **reference docs** or a **security policy boilerplate** follows a\n+  predictable template. → weak model handles it reliably.\n+\n+Routing saves ~60–80% of LLM cost on generative steps without degrading output\n+quality on the steps that matter.\n+\n+### Threshold convention\n+\n+Each routellm-routed step carries a `routellm_model` key with the model string\n+used in the API call:\n+\n+```\n+model=\"router-mf-{threshold}\"\n+```\n+\n+| Threshold | Routing behaviour | Use for |\n+|-----------|------------------|---------|\n+| 0.05–0.15 | Almost always strong | Discovery-critical or error-prone content |\n+| 0.30–0.40 | Mixed; mf decides per query | Medium-complexity structured docs |\n+| 0.50–0.60 | Balanced | Consistency checks, reference docs |\n+| 0.70–0.80 | Almost always weak | Boilerplate, templated content |\n+\n+### Quick setup\n+\n+```python\n+from routellm.controller import Controller\n+import yaml\n+\n+with open(\"config/routellm.yaml\") as f:\n+    config = yaml.safe_load(f)\n+\n+client = Controller(\n+    routers=[\"mf\"],\n+    strong_model=\"gpt-4o\",\n+    weak_model=\"gpt-4o-mini\",\n+    config=config,\n+)\n+\n+# In a flow step with routellm_model: \"router-mf-0.15\"\n+response = client.chat.completions.create(\n+    model=\"router-mf-0.15\",\n+    messages=[{\"role\": \"user\", \"content\": prompt}],\n+)\n+```\n+\n+### Token savings from routing\n+\n+Assuming strong model = 5× cost of weak model and 50% of routed calls\n+go to weak model at a 0.30 threshold:\n+\n+| Flow | Routed steps | Estimated saving vs all-strong |\n+|------|-------------|-------------------------------|\n+| oss-release-prep-validated | 3 | ~40% on doc-generation steps |\n+| cheatsheet-update-validated | 3 | ~35% on draft steps |\n+| create-agent-skill-validated | 4 | ~45% on write steps |\n+\n+---\n+\n+## Tool Prerequisites\n+\n+Install these once; all three flows draw on them.\n+\n+```bash\n+# Secret scanning\n+brew install gitleaks\n+\n+# License headers\n+go install github.com/google/addlicense@latest\n+\n+# Code-of-conduct generation\n+npm install -g covgen\n+\n+# Markdown linting + formatting\n+npm install -g markdownlint-cli prettier\n+\n+# Go release pipeline\n+brew install goreleaser\n+\n+# Skill validation (if using create-agent-skill)\n+# skill-creator scripts are in ~/.agents/skills/skill-creator/scripts/\n+```\n+\n+---\n+\n+## Convention: `meta.tool` field\n+\n+Steps that delegate to a tool carry a `meta.tool` key naming the\n+binary, and a `meta.commands` block with the exact invocations.\n+`meta.guidance` covers only the residual LLM work (interpretation,\n+decisions, content generation).\n+\n+```yaml\n+meta:\n+  tool: \"gitleaks\"\n+  commands: |\n+    gitleaks detect --source . --report-format json \\\n+      --report-path gitleaks-report.json\n+  guidance: |\n+    - Review report; block release on HIGH findings (LLM decision)\n+```\n+\n+Steps without `meta.tool` are pure LLM tasks.\ndiff --git a/examples/flows/cheatsheet-update-validated.yaml b/examples/flows/cheatsheet-update-validated.yaml\nnew file mode 100644\nindex 0000000..4ba5157\n--- /dev/null\n+++ b/examples/flows/cheatsheet-update-validated.yaml\n@@ -0,0 +1,345 @@\n+flow_id: \"flow:cheatsheet-update-validated:1.0\"\n+name: \"Cheatsheet Creation / Update (Validated)\"\n+version: \"1.0\"\n+description: \"Create or refresh human + agent cheatsheets with eva gating and routellm routing\"\n+entry_step: \"audit-surface\"\n+\n+config:\n+  category: \"documentation\"\n+  triggers:\n+    - \"CLI surface changed\"\n+    - \"new command or flag added\"\n+    - \"cheatsheet out of date\"\n+    - \"creating cheatsheets for first time\"\n+    - \"project docs refresh\"\n+\n+  validation_strategy: |\n+    ## Validation Strategy\n+\n+    ### eva (deterministic gating)\n+    Applied after each phase that produces file content.\n+    Contracts live in evals/cheatsheet/ and use only Tier 1 evaluators\n+    (zero LLM calls, deterministic exit codes):\n+\n+    - cheatsheet-structure.yaml  — required sections present in both files\n+    - cheatsheet-flags.yaml      — every documented flag exists in live --help\n+    - cheatsheet-render.yaml     — markdown structure (tables, fencing, headings)\n+\n+    Eva is the authoritative gate: the flow does not commit until eva exits 0.\n+\n+    ### routellm (LLM cost routing)\n+    Applied to the two draft steps — the only genuinely generative steps:\n+    - draft-human-cheatsheet  — medium complexity; route via mf at threshold 0.30\n+    - draft-agent-cheatsheet  — high complexity (more precise, more dangerous to\n+                                get wrong); route via mf at threshold 0.10\n+\n+    cross-check is also LLM-heavy but short-context; route at threshold 0.50.\n+\n+  eva_contracts_dir: \"evals/cheatsheet\"\n+  routellm_config: \"config/routellm.yaml\"\n+\n+steps:\n+  # ── Phase 1: Audit current state ────────────────────────────────────────────\n+\n+  audit-surface:\n+    step_id: \"audit-surface\"\n+    type: \"task\"\n+    title: \"Audit CLI surface and existing cheatsheets\"\n+    task_ref: \"task:audit-surface\"\n+    meta:\n+      tool: \"doc-validate script + shell --help sweep\"\n+      commands: |\n+        make validate-docs\n+        tlc --help > /tmp/cli-surface.txt\n+        for cmd in task flow sync config tag log uri tui; do\n+          echo \"=== tlc $cmd ===\" >> /tmp/cli-surface.txt\n+          tlc $cmd --help 2>&1 >> /tmp/cli-surface.txt\n+        done\n+      guidance: |\n+        - Interpret validate-docs failures as the delta list (LLM step)\n+        - Diff /tmp/cli-surface.txt against existing cheatsheets\n+\n+  # ── Phase 2: Spec & context read (parallel) ──────────────────────────────────\n+\n+  context-parallel:\n+    step_id: \"context-parallel\"\n+    type: \"parallel\"\n+    title: \"Read specs and AGENTS.md for context\"\n+    depends_on: [\"audit-surface\"]\n+    children: [\"read-cli-spec\", \"read-agents-md\", \"read-existing-cheatsheets\"]\n+    max_concurrency: 3\n+\n+  read-cli-spec:\n+    step_id: \"read-cli-spec\"\n+    type: \"task\"\n+    title: \"Read CLI spec for authoritative command definitions\"\n+    task_ref: \"task:read-cli-spec\"\n+    meta:\n+      guidance: |\n+        Read docs/tlc-cli-spec-0.1.md. Extract: command descriptions, flag\n+        definitions, defaults, valid values, error codes, bypass flags.\n+\n+  read-agents-md:\n+    step_id: \"read-agents-md\"\n+    type: \"task\"\n+    title: \"Read AGENTS.md for agent conventions\"\n+    task_ref: \"task:read-agents-md\"\n+    meta:\n+      guidance: |\n+        Read project AGENTS.md and ~/.agents/AGENTS.md. Extract rules that\n+        belong in the agent cheatsheet (bypass flags, loop contract, -d semantics,\n+        assignee lookup order). AGENTS.md wins over CLI spec on conflicts.\n+\n+  read-existing-cheatsheets:\n+    step_id: \"read-existing-cheatsheets\"\n+    type: \"task\"\n+    title: \"Read existing cheatsheets (if present)\"\n+    task_ref: \"task:read-existing-cheatsheets\"\n+    meta:\n+      guidance: |\n+        Read docs/cheatsheet-human.md and docs/cheatsheet-agent.md.\n+        Map each section heading to the delta list from audit-surface.\n+        Flag stale, missing, or correct sections.\n+\n+  # ── Phase 3: Draft both cheatsheets (parallel, routellm-routed) ──────────────\n+\n+  draft-parallel:\n+    step_id: \"draft-parallel\"\n+    type: \"parallel\"\n+    title: \"Draft human and agent cheatsheets\"\n+    depends_on: [\"context-parallel\"]\n+    children: [\"draft-human-cheatsheet\", \"draft-agent-cheatsheet\"]\n+    max_concurrency: 2\n+\n+  draft-human-cheatsheet:\n+    step_id: \"draft-human-cheatsheet\"\n+    type: \"task\"\n+    title: \"Draft cheatsheet-human.md\"\n+    task_ref: \"task:draft-human-cheatsheet\"\n+    meta:\n+      routellm_hint: \"medium\"\n+      routellm_model: \"router-mf-0.30\"\n+      guidance: |\n+        Target reader: developer using the CLI interactively.\n+\n+        Route via routellm at threshold 0.30 — medium complexity; weak model\n+        handles well-structured reference docs reliably.\n+\n+        Required sections: Setup, Create (flags table), List & Filter, Inspect,\n+        Claim/Unclaim, Update (-d warning), Complete/Reopen/Delete, Assign,\n+        Batch Ops, Tags, Stale, Flows, Sync, Config, Output Formats,\n+        URI Scheme, Common Tips + Failure Modes table.\n+\n+        Style: scannable in ≤ 30s; code blocks; right-aligned # comments;\n+        100-char line limit; no narrative prose.\n+\n+  draft-agent-cheatsheet:\n+    step_id: \"draft-agent-cheatsheet\"\n+    type: \"task\"\n+    title: \"Draft cheatsheet-agent.md\"\n+    task_ref: \"task:draft-agent-cheatsheet\"\n+    meta:\n+      routellm_hint: \"strong\"\n+      routellm_model: \"router-mf-0.10\"\n+      guidance: |\n+        Target reader: autonomous agent, LLM, script.\n+\n+        Route to strong model at threshold 0.10 — agent cheatsheet errors\n+        cause cascading agent failures; quality bar is higher than human doc.\n+\n+        Required sections: Prerequisites, Agent Loop Contract (DO/DON'T),\n+        Create, List/Query (--format json), Inspect, State Transitions\n+        (ASCII diagram), Bypass Flags (disambiguation table — mandatory),\n+        Update (-d replace warning), Assign (wsm→aps→ask order),\n+        Batch Ops, Stale, Flows, Sync, Output Formats (json first),\n+        Task Completion Protocol, Error Handling table, Task Data Model table.\n+\n+        Style: tables over prose; no narrative; 100-char line limit.\n+\n+  # ── Phase 4: Cross-check (routellm-routed) ───────────────────────────────────\n+\n+  cross-check:\n+    step_id: \"cross-check\"\n+    type: \"task\"\n+    title: \"Cross-check the two drafts for consistency and gaps\"\n+    task_ref: \"task:cross-check\"\n+    depends_on: [\"draft-parallel\"]\n+    meta:\n+      routellm_hint: \"medium\"\n+      routellm_model: \"router-mf-0.50\"\n+      guidance: |\n+        Route at threshold 0.50 — consistency check is pattern-matching;\n+        weak model handles it unless the spec is ambiguous.\n+\n+        Check: every command in human appears in agent (or intentionally omitted);\n+        flag tables use same values; bypass flag semantics identical;\n+        error messages match; all delta-list items addressed.\n+\n+  # ── Phase 5: eva gate — structure validation ─────────────────────────────────\n+\n+  gate-structure:\n+    step_id: \"gate-structure\"\n+    type: \"task\"\n+    title: \"eva gate: required sections present in both cheatsheets\"\n+    task_ref: \"task:gate-structure\"\n+    depends_on: [\"cross-check\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/cheatsheet/structure-dataset.yaml \\\n+          --no-tui\n+        # exits 1 if any required section is missing; no LLM used\n+      eva_contract: \"evals/cheatsheet/cheatsheet-structure.yaml\"\n+      eva_contract_body: |\n+        name: cheatsheet_structure_gate\n+        provider: filesystem\n+        evaluators:\n+          # Human cheatsheet required sections\n+          - name: contains\n+            substring: \"## Setup\"\n+            mode: binary\n+          - name: contains\n+            substring: \"## Create\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Common Tips\"\n+            mode: binary\n+          - name: regex\n+            pattern: \"Symptom.*Fix|Fix.*Symptom\"  # failure modes table header\n+            mode: binary\n+          # Agent cheatsheet required sections\n+          - name: contains\n+            substring: \"Agent Loop Contract\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Bypass Flags\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Task Completion Protocol\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Task Data Model\"\n+            mode: binary\n+          - name: contains\n+            substring: \"State Transitions\"\n+            mode: binary\n+        # dataset sends each cheatsheet file as a separate test\n+\n+  # ── Phase 6: Validate examples against live CLI (parallel) ────────────────────\n+\n+  validate-parallel:\n+    step_id: \"validate-parallel\"\n+    type: \"parallel\"\n+    title: \"Validate examples against live CLI\"\n+    depends_on: [\"gate-structure\"]\n+    children: [\"validate-human-examples\", \"validate-agent-examples\"]\n+    max_concurrency: 2\n+\n+  validate-human-examples:\n+    step_id: \"validate-human-examples\"\n+    type: \"task\"\n+    title: \"Validate human cheatsheet examples against live CLI\"\n+    task_ref: \"task:validate-human-examples\"\n+    meta:\n+      tool: \"doc-validate script\"\n+      commands: |\n+        make validate-docs\n+        markdownlint docs/cheatsheet-human.md\n+      guidance: |\n+        Stale flags from validate-docs output are LLM fix targets.\n+\n+  validate-agent-examples:\n+    step_id: \"validate-agent-examples\"\n+    type: \"task\"\n+    title: \"Validate agent cheatsheet examples against live CLI\"\n+    task_ref: \"task:validate-agent-examples\"\n+    meta:\n+      tool: \"doc-validate script + bypass-flag probes\"\n+      commands: |\n+        make validate-docs\n+        markdownlint docs/cheatsheet-agent.md\n+        tlc task complete --help | grep -q \"\\-\\-no-verify\" \\\n+          && echo \"OK: --no-verify\" || echo \"MISSING: --no-verify\"\n+        tlc task update --help | grep -q \"\\-\\-force\" \\\n+          && echo \"OK: --force\"    || echo \"MISSING: --force\"\n+        tlc task delete --help | grep -q \"\\-\\-yes\\|-y\" \\\n+          && echo \"OK: --yes/-y\"   || echo \"MISSING: --yes/-y\"\n+        tlc task --help  | grep -q \"\\-\\-no-prompt\" \\\n+          && echo \"OK: --no-prompt\" || echo \"MISSING: --no-prompt\"\n+      guidance: |\n+        Probe failures → update bypass-flag table (LLM edit).\n+\n+  gate-flags:\n+    step_id: \"gate-flags\"\n+    type: \"task\"\n+    title: \"eva gate: flag examples validated — no stale entries\"\n+    task_ref: \"task:gate-flags\"\n+    depends_on: [\"validate-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        # Capture validate-docs output and pass it as the eval response\n+        make validate-docs 2>&1 | tee /tmp/validate-docs-output.txt\n+        eva run \\\n+          --dataset evals/cheatsheet/flags-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/cheatsheet/cheatsheet-flags.yaml\"\n+      eva_contract_body: |\n+        name: cheatsheet_flags_gate\n+        provider: doc_validator\n+        evaluators:\n+          - name: regex\n+            pattern: \"FAIL|stale|not found\"\n+            # presence = FAIL; contract passes only when output is clean\n+            mode: binary\n+          - name: contains\n+            substring: \"checks passed\"\n+            mode: binary\n+        # dataset sends validate-docs stdout as the response\n+\n+  # ── Phase 7: Write and verify ──────────────────────────────────────────────\n+\n+  write-cheatsheets:\n+    step_id: \"write-cheatsheets\"\n+    type: \"task\"\n+    title: \"Write final cheatsheet files to docs/\"\n+    task_ref: \"task:write-cheatsheets\"\n+    depends_on: [\"gate-flags\"]\n+    meta:\n+      tool: \"doc-validate + markdownlint (final gate)\"\n+      commands: |\n+        make validate-docs\n+        markdownlint docs/cheatsheet-*.md\n+        git add docs/cheatsheet-human.md docs/cheatsheet-agent.md\n+        git commit -m \"docs: update cheatsheets for <change summary>\"\n+\n+  gate-render:\n+    step_id: \"gate-render\"\n+    type: \"task\"\n+    title: \"eva gate: markdown structure valid in both files\"\n+    task_ref: \"task:gate-render\"\n+    depends_on: [\"write-cheatsheets\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/cheatsheet/render-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/cheatsheet/cheatsheet-render.yaml\"\n+      eva_contract_body: |\n+        name: cheatsheet_render_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: regex\n+            pattern: \"^#{1,3} \"       # headings are H1-H3 only\n+            mode: binary\n+          - name: regex\n+            pattern: \"\\\\|.*\\\\|.*\\\\|\"  # at least one table row\n+            mode: binary\n+          - name: regex\n+            pattern: \"```[a-z]\"       # fenced code blocks with language tag\n+            mode: binary\n+          - name: regex\n+            pattern: \".{101,}\"        # any line over 100 chars = FAIL\n+            mode: warn\ndiff --git a/examples/flows/cheatsheet-update.yaml b/examples/flows/cheatsheet-update.yaml\nnew file mode 100644\nindex 0000000..e19bfef\n--- /dev/null\n+++ b/examples/flows/cheatsheet-update.yaml\n@@ -0,0 +1,333 @@\n+flow_id: \"flow:cheatsheet-update:1.0\"\n+name: \"Cheatsheet Creation / Update\"\n+version: \"1.0\"\n+description: \"Create or refresh human and agent cheatsheets for a project\"\n+entry_step: \"audit-surface\"\n+\n+config:\n+  category: \"documentation\"\n+  triggers:\n+    - \"CLI surface changed\"\n+    - \"new command or flag added\"\n+    - \"cheatsheet out of date\"\n+    - \"creating cheatsheets for first time\"\n+    - \"project docs refresh\"\n+\n+  procedure: |\n+    ## Cheatsheet Creation / Update\n+\n+    Produces or refreshes two cheatsheets:\n+    - **cheatsheet-human.md** — scannable daily reference for humans;\n+      emphasises discoverability, tips, failure modes\n+    - **cheatsheet-agent.md** — autonomous-agent reference; emphasises\n+      determinism, contracts, error codes, machine-readable patterns\n+\n+    The two documents share the same source of truth (CLI + specs) but\n+    serve different mental models. They MUST stay in sync with each other\n+    and with the live CLI surface.\n+\n+    ## Triggers\n+\n+    Run this flow when:\n+    - A new command, subcommand, or flag is added or removed\n+    - Flag behaviour or defaults change\n+    - A new spec section is ratified\n+    - Cheatsheets are being created for a new project\n+    - Doc-command validation script reports stale examples\n+\n+    ## Audience Contracts\n+\n+    ### Human cheatsheet\n+    - Scannable in ≤ 30 s\n+    - Grouped by intent (create, list, update, …)\n+    - Includes tips and common failure mode table\n+    - Uses natural-language guidance where helpful\n+\n+    ### Agent cheatsheet\n+    - Optimised for token-efficient parsing\n+    - Leads with the agent loop contract\n+    - Tables over prose wherever possible\n+    - Includes full data model field reference\n+    - Explicit bypass-flag disambiguation table\n+    - No narrative — only facts\n+\n+steps:\n+  # ── Phase 1: Audit current state ────────────────────────────────────────────\n+\n+  audit-surface:\n+    step_id: \"audit-surface\"\n+    type: \"task\"\n+    title: \"Audit CLI surface and existing cheatsheets\"\n+    task_ref: \"task:audit-surface\"\n+    meta:\n+      tool: \"doc-validate script + shell --help sweep\"\n+      commands: |\n+        # 1. Validate existing examples against live CLI (exits non-zero on stale)\n+        make validate-docs\n+        # or: ./scripts/validate-doc-commands.sh\n+\n+        # 2. Dump full CLI surface to a temp file for diffing\n+        tlc --help > /tmp/cli-surface.txt\n+        for cmd in task flow sync config tag log uri tui; do\n+          echo \"=== tlc $cmd ===\" >> /tmp/cli-surface.txt\n+          tlc $cmd --help 2>&1 >> /tmp/cli-surface.txt\n+        done\n+      guidance: |\n+        - Interpret validate-docs failures as the delta list (LLM step)\n+        - Diff /tmp/cli-surface.txt against existing cheatsheets to identify\n+          additions, removals, and changed defaults\n+\n+  # ── Phase 2: Spec & context read (parallel, independent) ────────────────────\n+\n+  context-parallel:\n+    step_id: \"context-parallel\"\n+    type: \"parallel\"\n+    title: \"Read specs and AGENTS.md for context\"\n+    depends_on: [\"audit-surface\"]\n+    children: [\"read-cli-spec\", \"read-agents-md\", \"read-existing-cheatsheets\"]\n+    max_concurrency: 3\n+\n+  read-cli-spec:\n+    step_id: \"read-cli-spec\"\n+    type: \"task\"\n+    title: \"Read CLI spec for authoritative command definitions\"\n+    task_ref: \"task:read-cli-spec\"\n+    meta:\n+      guidance: |\n+        - Locate the CLI spec (e.g. docs/tlc-cli-spec-0.1.md)\n+        - Extract: command descriptions, flag definitions, defaults,\n+          valid values, error codes, bypass flags\n+        - Note any spec sections marked normative — these must appear\n+          accurately in both cheatsheets\n+        - Identify agent-specific guidance (state machine, bypass flags)\n+\n+  read-agents-md:\n+    step_id: \"read-agents-md\"\n+    type: \"task\"\n+    title: \"Read AGENTS.md for agent conventions\"\n+    task_ref: \"task:read-agents-md\"\n+    meta:\n+      guidance: |\n+        - Read AGENTS.md (project-level and global ~/.agents/AGENTS.md)\n+        - Extract rules that belong in the agent cheatsheet:\n+          - claim-before-work contract\n+          - -d replaces description (read-first rule)\n+          - bypass flag semantics (--no-verify vs --force vs --yes)\n+          - assignee lookup order (wsm → aps → ask)\n+          - error message patterns\n+        - Note anything that diverges from the CLI spec (agent AGENTS.md wins)\n+\n+  read-existing-cheatsheets:\n+    step_id: \"read-existing-cheatsheets\"\n+    type: \"task\"\n+    title: \"Read existing cheatsheets (if present)\"\n+    task_ref: \"task:read-existing-cheatsheets\"\n+    meta:\n+      guidance: |\n+        - Read docs/cheatsheet-human.md and docs/cheatsheet-agent.md\n+          (or equivalent paths) if they exist\n+        - Map each section heading to the delta list from audit-surface\n+        - Flag sections that are stale, missing, or correctly up to date\n+        - Identify sections that appear in human but not agent (or vice-versa)\n+          and decide if that's intentional or a gap\n+\n+  # ── Phase 3: Draft both cheatsheets (parallel) ───────────────────────────────\n+\n+  draft-parallel:\n+    step_id: \"draft-parallel\"\n+    type: \"parallel\"\n+    title: \"Draft human and agent cheatsheets\"\n+    depends_on: [\"context-parallel\"]\n+    children: [\"draft-human-cheatsheet\", \"draft-agent-cheatsheet\"]\n+    max_concurrency: 2\n+\n+  draft-human-cheatsheet:\n+    step_id: \"draft-human-cheatsheet\"\n+    type: \"task\"\n+    title: \"Draft cheatsheet-human.md\"\n+    task_ref: \"task:draft-human-cheatsheet\"\n+    meta:\n+      guidance: |\n+        Target reader: developer using the CLI interactively.\n+\n+        Required sections (adapt to project):\n+        1. Setup — init, doctor, version, multi-project targeting\n+        2. Create — all create flags in a reference table\n+        3. List & Filter — all filter flags; show multi-value examples\n+        4. Inspect — show, log commands\n+        5. Claim / Unclaim\n+        6. Update — all update flags; warn about -d replace semantics\n+        7. Complete / Reopen / Delete — bypass flag note\n+        8. Assign / Unassign\n+        9. Batch Operations — ID, regex, glob patterns\n+        10. Tags — if project uses tagging\n+        11. Stale Tasks — if project uses stale detection\n+        12. Flows — flow commands if exposed\n+        13. Sync — if sync feature exists\n+        14. Config — config get/set/validate\n+        15. Output Formats\n+        16. URI Scheme — if applicable\n+        17. Common Tips and Failure Modes — table of symptom → fix\n+\n+        Style rules:\n+        - Opening line: \"Quick reference for daily task work. Scannable in 30 seconds.\"\n+        - Max line length: 100 chars\n+        - Code blocks for all commands; right-aligned comments with `#`\n+        - Reference tables for flags (Flag | Values | Purpose)\n+        - Failure mode table at the end (Symptom | Fix)\n+        - No narrative prose in command sections — labels only\n+\n+  draft-agent-cheatsheet:\n+    step_id: \"draft-agent-cheatsheet\"\n+    type: \"task\"\n+    title: \"Draft cheatsheet-agent.md\"\n+    task_ref: \"task:draft-agent-cheatsheet\"\n+    meta:\n+      guidance: |\n+        Target reader: autonomous agent, LLM, script.\n+\n+        Required sections (adapt to project):\n+        1. Prerequisites — version, doctor, init; multi-project targeting\n+        2. Agent Loop Contract — numbered steps (claim → work → log → complete)\n+           with DO / DON'T callouts\n+        3. Create — flags table (same schema as human but terser labels)\n+        4. List / Query — include --format json; \"Deterministic First\" heading\n+           + ID flexibility note\n+        5. Inspect — show + log with --format json\n+        6. State Transitions — ASCII state diagram + command mapping\n+        7. Bypass Flags — disambiguation table\n+           (Flag | Scope | Effect) — critical for agents\n+        8. Update — lead with read-first warning for -d\n+        9. Assign / Unassign — assignee lookup order (wsm → aps → ask)\n+        10. Batch Operations — explicit IDs, regex, glob\n+        11. Stale Detection — if applicable\n+        12. Flows — flow commands\n+        13. Sync — if applicable\n+        14. Output Formats — lead with json/yaml for machine use\n+        15. Task Completion Protocol — numbered steps with exact commands\n+        16. Error Handling — table (Error | Cause | Fix)\n+        17. Task Data Model — full field reference table\n+            (Field | Values | Notes)\n+\n+        Style rules:\n+        - Opening line: \"Quick reference for autonomous agents, scripts, and LLMs.\"\n+        - Max line length: 100 chars\n+        - Tables over prose everywhere possible\n+        - ASCII state diagram for state machine (not mermaid)\n+        - No explanatory narrative — every line must be actionable\n+        - Bypass flags section is mandatory; never merge into Update section\n+\n+  # ── Phase 4: Cross-check (sequential) ───────────────────────────────────────\n+\n+  cross-check:\n+    step_id: \"cross-check\"\n+    type: \"task\"\n+    title: \"Cross-check the two drafts for consistency and gaps\"\n+    task_ref: \"task:cross-check\"\n+    depends_on: [\"draft-parallel\"]\n+    meta:\n+      guidance: |\n+        Compare cheatsheet-human.md and cheatsheet-agent.md side-by-side:\n+\n+        Consistency checks:\n+        - Every command listed in human also appears in agent (or is\n+          intentionally omitted with a reason)\n+        - Flag tables use the same values and defaults in both files\n+        - Bypass flag semantics are identical in both files\n+        - Error messages match between the Error Handling table (agent)\n+          and Failure Modes table (human)\n+\n+        Completeness checks:\n+        - Every item in the audit delta list is addressed in both files\n+        - Agent cheatsheet has a Task Data Model section\n+        - Agent cheatsheet has a Task Completion Protocol section\n+        - Human cheatsheet has a Failure Modes table\n+\n+        Fix any gaps before proceeding.\n+\n+  # ── Phase 5: Validate against live CLI (parallel) ────────────────────────────\n+\n+  validate-parallel:\n+    step_id: \"validate-parallel\"\n+    type: \"parallel\"\n+    title: \"Validate examples against live CLI\"\n+    depends_on: [\"cross-check\"]\n+    children: [\"validate-human-examples\", \"validate-agent-examples\"]\n+    max_concurrency: 2\n+\n+  validate-human-examples:\n+    step_id: \"validate-human-examples\"\n+    type: \"task\"\n+    title: \"Validate human cheatsheet examples against live CLI\"\n+    task_ref: \"task:validate-human-examples\"\n+    meta:\n+      tool: \"doc-validate script\"\n+      commands: |\n+        make validate-docs\n+        # exits non-zero listing every stale flag/subcommand — no LLM needed\n+        markdownlint docs/cheatsheet-human.md\n+      guidance: |\n+        - Any flag listed in the cheatsheet that --help no longer shows is a\n+          stale entry; remove or update it (LLM edit step after tool run)\n+\n+  validate-agent-examples:\n+    step_id: \"validate-agent-examples\"\n+    type: \"task\"\n+    title: \"Validate agent cheatsheet examples against live CLI\"\n+    task_ref: \"task:validate-agent-examples\"\n+    meta:\n+      tool: \"doc-validate script + targeted shell probes\"\n+      commands: |\n+        make validate-docs\n+        markdownlint docs/cheatsheet-agent.md\n+\n+        # Probe bypass flags explicitly — deterministic pass/fail\n+        tlc task complete --help | grep -q \"\\-\\-no-verify\" \\\n+          && echo \"OK: --no-verify\" || echo \"MISSING: --no-verify\"\n+        tlc task update --help | grep -q \"\\-\\-force\" \\\n+          && echo \"OK: --force\"    || echo \"MISSING: --force\"\n+        tlc task delete --help | grep -q \"\\-\\-yes\\|-y\" \\\n+          && echo \"OK: --yes/-y\"   || echo \"MISSING: --yes/-y\"\n+        tlc task --help  | grep -q \"\\-\\-no-prompt\" \\\n+          && echo \"OK: --no-prompt\" || echo \"MISSING: --no-prompt\"\n+      guidance: |\n+        - Probe failures mean the bypass-flag table in the agent cheatsheet\n+          needs updating (LLM edit after tool run)\n+        - Verify state machine diagram by attempting an invalid transition and\n+          comparing the actual error message to the Error Handling table\n+\n+  # ── Phase 6: Write and verify ────────────────────────────────────────────────\n+\n+  write-cheatsheets:\n+    step_id: \"write-cheatsheets\"\n+    type: \"task\"\n+    title: \"Write final cheatsheet files to docs/\"\n+    task_ref: \"task:write-cheatsheets\"\n+    depends_on: [\"validate-parallel\"]\n+    meta:\n+      tool: \"doc-validate script (final gate)\"\n+      commands: |\n+        # After LLM writes the files:\n+        make validate-docs          # must exit 0\n+        markdownlint docs/cheatsheet-*.md\n+        git add docs/cheatsheet-human.md docs/cheatsheet-agent.md\n+        git commit -m \"docs: update cheatsheets for <change summary>\"\n+      guidance: |\n+        - LLM writes the file content; tools gate the commit\n+        - If validate-docs exits non-zero: fix the stale example before committing\n+\n+  verify-render:\n+    step_id: \"verify-render\"\n+    type: \"task\"\n+    title: \"Verify both cheatsheets render correctly\"\n+    task_ref: \"task:verify-render\"\n+    depends_on: [\"write-cheatsheets\"]\n+    meta:\n+      tool: \"markdownlint + prettier\"\n+      commands: |\n+        markdownlint docs/cheatsheet-human.md docs/cheatsheet-agent.md\n+        prettier --check \"docs/cheatsheet-*.md\"\n+        # Tables, fencing, and heading order are checked automatically\n+      guidance: |\n+        - Tool failures indicate structural issues (broken tables, bad headings)\n+        - Placeholder text (\"<...>\") and broken links require LLM inspection\ndiff --git a/examples/flows/create-agent-skill-validated.yaml b/examples/flows/create-agent-skill-validated.yaml\nnew file mode 100644\nindex 0000000..8172a2d\n--- /dev/null\n+++ b/examples/flows/create-agent-skill-validated.yaml\n@@ -0,0 +1,419 @@\n+flow_id: \"flow:create-agent-skill-validated:1.0\"\n+name: \"Create Agent Skill (Validated)\"\n+version: \"1.0\"\n+description: \"Create a folder-based agent skill with eva gating and routellm routing\"\n+entry_step: \"decide-shape\"\n+\n+config:\n+  category: \"documentation\"\n+  triggers:\n+    - \"create agent skill\"\n+    - \"add skill for this tool\"\n+    - \"create skill folder\"\n+    - \"document tool for agents\"\n+    - \"agentskills.io skill\"\n+\n+  validation_strategy: |\n+    ## Validation Strategy\n+\n+    ### eva (deterministic gating)\n+    Applied after content phases to enforce agentskills.io spec compliance.\n+    Contracts live in evals/agent-skill/ and use only Tier 1 evaluators:\n+\n+    - skill-frontmatter.yaml  — name format, description length, \"Use when:\" present\n+    - skill-structure.yaml    — required sections present, line length, word count\n+    - skill-scripts.yaml      — scripts are executable and print usage\n+    - skill-discovery.yaml    — description contains trigger keywords\n+\n+    eva quick_validate.py covers the same ground for a fast local check;\n+    eva contracts are the authoritative gate for CI / pre-merge.\n+\n+    ### routellm (LLM cost routing)\n+    Applied to the four generative steps. Content quality directly affects\n+    how useful the skill is to downstream agents.\n+\n+    | Step | Threshold | Rationale |\n+    |------|-----------|-----------|\n+    | write-skill-md | 0.15 | Core skill body; errors cascade to every user session |\n+    | write-references | 0.50 | Deep-dive docs; weak model fine for structured reference |\n+    | write-scripts | 0.40 | Scripts need correctness; moderate quality bar |\n+    | write-description | 0.10 | Description is discovery-critical; always strong |\n+\n+    research-errors and research-ops are deterministic/read-only — no routing.\n+\n+  eva_contracts_dir: \"evals/agent-skill\"\n+  routellm_config: \"config/routellm.yaml\"\n+\n+steps:\n+  # ── Phase 1: Decide shape ────────────────────────────────────────────────────\n+\n+  decide-shape:\n+    step_id: \"decide-shape\"\n+    type: \"branch\"\n+    title: \"Single file or folder skill?\"\n+    cases:\n+      - when: \"complexity == 'simple'\"\n+        next: \"simple-skill-path\"\n+      - when: \"complexity == 'complex'\"\n+        next: \"audit-tool\"\n+    default_next: \"audit-tool\"\n+    meta:\n+      guidance: |\n+        Flat file when: ≤ 20 commands, no scripts, no reference docs,\n+        SKILL.md stays under 5k words. Folder otherwise.\n+\n+  simple-skill-path:\n+    step_id: \"simple-skill-path\"\n+    type: \"task\"\n+    title: \"Write single-file SKILL.md (simple tool)\"\n+    task_ref: \"task:simple-skill-path\"\n+    meta:\n+      routellm_hint: \"strong\"\n+      routellm_model: \"router-mf-0.15\"\n+      guidance: |\n+        Route to strong model — even the simple path is discovery-critical.\n+\n+        Write skill/<tool-name>/SKILL.md with frontmatter (name, description\n+        250-350 chars with \"Use when:\") and sections: When to Use, Quick Start,\n+        Core Commands table, Key Flags table, Common Workflows, Common Mistakes\n+        table, Error Handling table.\n+\n+        Then jump to gate-structure; skip folder-path steps.\n+\n+  # ── Phase 2: Audit tool surface ──────────────────────────────────────────────\n+\n+  audit-tool:\n+    step_id: \"audit-tool\"\n+    type: \"task\"\n+    title: \"Audit tool surface: CLI, API, scripts, error patterns\"\n+    task_ref: \"task:audit-tool\"\n+    meta:\n+      tool: \"shell --help sweep + just/make list\"\n+      commands: |\n+        TOOL=\"<tool-name>\"\n+        $TOOL --help > /tmp/${TOOL}-surface.txt\n+        $TOOL help --all >> /tmp/${TOOL}-surface.txt 2>&1 || true\n+        for sub in $($TOOL --help | awk '/^  [a-z]/{print $1}'); do\n+          echo \"=== $TOOL $sub ===\" >> /tmp/${TOOL}-surface.txt\n+          $TOOL $sub --help 2>&1 >> /tmp/${TOOL}-surface.txt\n+        done\n+        curl -s http://localhost:${PORT:-8080}/openapi.json \\\n+          > /tmp/${TOOL}-openapi.json 2>/dev/null || true\n+        just --list > /tmp/${TOOL}-ops.txt 2>/dev/null || \\\n+          make -qp 2>/dev/null | awk -F: '/^[a-zA-Z]/{print $1}' \\\n+          >> /tmp/${TOOL}-ops.txt\n+      guidance: |\n+        - Read /tmp/${TOOL}-surface.txt to build command inventory (LLM step)\n+        - Trigger invalid ops to collect exact error messages\n+\n+  # ── Phase 3: Research and scaffold (parallel) ────────────────────────────────\n+\n+  research-parallel:\n+    step_id: \"research-parallel\"\n+    type: \"parallel\"\n+    title: \"Research errors, ops, and scaffold folder\"\n+    depends_on: [\"audit-tool\"]\n+    children: [\"research-errors\", \"research-ops\", \"scaffold-folder\"]\n+    max_concurrency: 3\n+\n+  research-errors:\n+    step_id: \"research-errors\"\n+    type: \"task\"\n+    title: \"Collect error messages and failure modes\"\n+    task_ref: \"task:research-errors\"\n+    meta:\n+      guidance: |\n+        Deliberately trigger errors: missing flags, invalid values, wrong\n+        init order, auth failures, state machine violations.\n+        Record: exact error string, root cause, fix command.\n+\n+  research-ops:\n+    step_id: \"research-ops\"\n+    type: \"task\"\n+    title: \"Identify repetitive operations worth scripting\"\n+    task_ref: \"task:research-ops\"\n+    meta:\n+      guidance: |\n+        Look for: every-project-setup ops, multi-step fixed-order sequences,\n+        typo-prone invocations, frequently-asked-about commands.\n+        Record: exact invocation, expected output, destructive side-effects.\n+\n+  scaffold-folder:\n+    step_id: \"scaffold-folder\"\n+    type: \"task\"\n+    title: \"Scaffold skill folder structure\"\n+    task_ref: \"task:scaffold-folder\"\n+    meta:\n+      tool: \"skill-creator init_skill.py\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        python3 ~/.agents/skills/skill-creator/scripts/init_skill.py \"${SKILL}\"\n+        # fallback:\n+        # mkdir -p \"skill/${SKILL}\"/{references,scripts,templates}\n+        # printf -- \"---\\nname: ${SKILL}\\ndescription: |\\n  [DRAFT]\\n---\\n\" \\\n+        #   > \"skill/${SKILL}/SKILL.md\"\n+\n+  # ── Phase 4: Write core docs (parallel, routellm-routed) ─────────────────────\n+\n+  write-parallel:\n+    step_id: \"write-parallel\"\n+    type: \"parallel\"\n+    title: \"Write SKILL.md body, references, and scripts\"\n+    depends_on: [\"research-parallel\"]\n+    children: [\"write-skill-md\", \"write-references\", \"write-scripts\"]\n+    max_concurrency: 3\n+\n+  write-skill-md:\n+    step_id: \"write-skill-md\"\n+    type: \"task\"\n+    title: \"Write SKILL.md body\"\n+    task_ref: \"task:write-skill-md\"\n+    meta:\n+      routellm_hint: \"strong\"\n+      routellm_model: \"router-mf-0.15\"\n+      guidance: |\n+        Route to strong model — SKILL.md body errors cause agent failures\n+        in every session that loads this skill.\n+\n+        Sections: When to Use / Auto-activation, Quick Start (≤ 10 lines,\n+        runnable), Core Commands/Endpoints table, Key Flags/Options table,\n+        Common Workflows (3-8 numbered), Agent Loop Contract (if stateful),\n+        State Machine (ASCII, if applicable), Common Mistakes table,\n+        Error Handling table (exact error strings as row keys).\n+\n+        Max 5k words; max 100 chars/line; tables over prose; LLM-reader style.\n+        Leave frontmatter description as [DRAFT].\n+\n+  write-references:\n+    step_id: \"write-references\"\n+    type: \"task\"\n+    title: \"Write references/ deep-dive docs\"\n+    task_ref: \"task:write-references\"\n+    meta:\n+      routellm_hint: \"medium\"\n+      routellm_model: \"router-mf-0.50\"\n+      guidance: |\n+        Route at 0.50 — structured reference content; weak model handles well.\n+\n+        Create references/<topic>.md for each overflow topic:\n+        api-endpoints.md, config-reference.md, troubleshooting.md,\n+        data-model.md. Each starts with a one-line summary + link to SKILL.md.\n+        Add ## References section to SKILL.md linking each file.\n+        Skip if SKILL.md is under 5k words.\n+\n+  write-scripts:\n+    step_id: \"write-scripts\"\n+    type: \"task\"\n+    title: \"Write scripts/ for repetitive operations\"\n+    task_ref: \"task:write-scripts\"\n+    meta:\n+      routellm_hint: \"medium\"\n+      routellm_model: \"router-mf-0.40\"\n+      guidance: |\n+        Route at 0.40 — scripts need correctness but are mostly deterministic\n+        sequences; weak model handles with explicit constraints.\n+\n+        For each research-ops candidate: write scripts/<op-name>.sh.\n+        Header: #!/usr/bin/env bash, set -euo pipefail, usage on --help.\n+        chmod +x each script.\n+        Add ## Scripts table to SKILL.md (Script | Purpose | Usage).\n+        Skip if no repetitive ops identified.\n+\n+  # ── Phase 5: Write description (routellm-routed) ─────────────────────────────\n+\n+  write-description:\n+    step_id: \"write-description\"\n+    type: \"task\"\n+    title: \"Write SKILL.md frontmatter description\"\n+    task_ref: \"task:write-description\"\n+    depends_on: [\"write-parallel\"]\n+    meta:\n+      routellm_hint: \"strong\"\n+      routellm_model: \"router-mf-0.10\"\n+      guidance: |\n+        Route to strong model — description is the only field used for skill\n+        discovery; a poor description means the skill is never loaded.\n+\n+        250-350 chars. Template:\n+          \"<Active verb> with <tool-name>. Covers <3-4 key topics>.\n+           Use when: <trigger 1>, <trigger 2>, <trigger 3>, or\n+           troubleshooting \\\"<exact error 1>\\\" or \\\"<exact error 2>\\\".\"\n+\n+        Checklist: active voice, tool named explicitly, 3-5 \"Use when:\" triggers,\n+        2-3 copy-pasted error strings, no meta-commentary, 250-350 chars total.\n+        Write into SKILL.md frontmatter, replacing [DRAFT].\n+\n+  # ── Phase 6: eva gate — structure and frontmatter ────────────────────────────\n+\n+  gate-structure:\n+    step_id: \"gate-structure\"\n+    type: \"task\"\n+    title: \"eva gate: SKILL.md structure and frontmatter valid\"\n+    task_ref: \"task:gate-structure\"\n+    depends_on: [\"write-description\"]\n+    meta:\n+      tool: \"eva + skill-creator quick_validate\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        # Fast local check first\n+        python3 ~/.agents/skills/skill-creator/scripts/quick_validate.py \\\n+          \"skill/${SKILL}\"\n+        # Authoritative eva gate\n+        eva run \\\n+          --dataset evals/agent-skill/structure-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/agent-skill/skill-structure.yaml\"\n+      eva_contract_body: |\n+        name: skill_structure_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: regex\n+            pattern: \"^name: [a-z][a-z0-9-]{0,63}$\"\n+            mode: binary              # name is lowercase-hyphen-case ≤ 64 chars\n+          - name: regex\n+            pattern: \"Use when:\"\n+            mode: binary              # description has \"Use when:\" section\n+          - name: contains\n+            substring: \"## \"\n+            mode: binary              # at least one H2 section\n+          - name: contains\n+            substring: \"Quick Start\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Error Handling\"\n+            mode: binary\n+          - name: regex\n+            pattern: \".{101,}\"\n+            mode: warn                # lines over 100 chars — warn, not fail\n+\n+  gate-frontmatter:\n+    step_id: \"gate-frontmatter\"\n+    type: \"task\"\n+    title: \"eva gate: description length and keyword quality\"\n+    task_ref: \"task:gate-frontmatter\"\n+    depends_on: [\"gate-structure\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/agent-skill/frontmatter-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/agent-skill/skill-frontmatter.yaml\"\n+      eva_contract_body: |\n+        name: skill_frontmatter_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: regex\n+            # description must be 250-350 chars (approximate line-count check)\n+            pattern: \"description: \\\\|\"\n+            mode: binary\n+          - name: contains\n+            substring: \"Use when:\"\n+            mode: binary\n+          - name: regex\n+            # must not contain placeholder text\n+            pattern: \"\\\\[DRAFT\\\\]|<.*>\"\n+            mode: binary              # presence = FAIL\n+          - name: regex\n+            pattern: \"troubleshooting\"\n+            mode: warn                # warn if no troubleshooting keyword\n+\n+  # ── Phase 7: Validate examples and scripts ───────────────────────────────────\n+\n+  validate-parallel:\n+    step_id: \"validate-parallel\"\n+    type: \"parallel\"\n+    title: \"Validate skill quality and examples\"\n+    depends_on: [\"gate-frontmatter\"]\n+    children: [\"validate-examples\", \"validate-scripts\"]\n+    max_concurrency: 2\n+\n+  validate-examples:\n+    step_id: \"validate-examples\"\n+    type: \"task\"\n+    title: \"Probe every documented flag against live CLI\"\n+    task_ref: \"task:validate-examples\"\n+    meta:\n+      tool: \"shell flag probes\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        TOOL=\"<tool-name>\"\n+        # Extract all documented commands and probe --help for each flag\n+        grep -oP '\\`'\"${TOOL}\"'[^`]+\\`' skill/${SKILL}/SKILL.md \\\n+          | sed 's/`//g' | sort -u > /tmp/skill-cmds.txt\n+        cat /tmp/skill-cmds.txt   # review output\n+        # Probe each documented subcommand exists\n+        while IFS= read -r cmd; do\n+          eval \"$cmd --help\" > /dev/null 2>&1 \\\n+            && echo \"OK: $cmd\" || echo \"MISSING: $cmd\"\n+        done < /tmp/skill-cmds.txt\n+      guidance: |\n+        MISSING lines → update SKILL.md to remove or correct those examples.\n+\n+  validate-scripts:\n+    step_id: \"validate-scripts\"\n+    type: \"task\"\n+    title: \"Lint and smoke-test scripts/\"\n+    task_ref: \"task:validate-scripts\"\n+    meta:\n+      tool: \"shellcheck\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        shellcheck skill/${SKILL}/scripts/*.sh 2>/dev/null || true\n+        for s in skill/${SKILL}/scripts/*.sh; do\n+          [ -f \"$s\" ] || continue\n+          echo \"--- $s ---\"\n+          bash \"$s\" --help 2>&1 | head -5\n+        done\n+\n+  gate-scripts:\n+    step_id: \"gate-scripts\"\n+    type: \"task\"\n+    title: \"eva gate: scripts are executable and print usage\"\n+    task_ref: \"task:gate-scripts\"\n+    depends_on: [\"validate-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/agent-skill/scripts-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/agent-skill/skill-scripts.yaml\"\n+      eva_contract_body: |\n+        name: skill_scripts_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: contains\n+            substring: \"#!/usr/bin/env bash\"\n+            mode: binary\n+          - name: contains\n+            substring: \"set -euo pipefail\"\n+            mode: binary\n+          - name: regex\n+            pattern: \"Usage:|usage:\"\n+            mode: binary              # script prints usage\n+          - name: regex\n+            pattern: \"shellcheck\"\n+            mode: warn                # warn if no shellcheck directive\n+\n+  # ── Phase 8: Register and smoke-test ─────────────────────────────────────────\n+\n+  register-skill:\n+    step_id: \"register-skill\"\n+    type: \"task\"\n+    title: \"Register skill and confirm discovery\"\n+    task_ref: \"task:register-skill\"\n+    depends_on: [\"gate-scripts\"]\n+    meta:\n+      tool: \"ln + ls\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        SKILL_PATH=\"$(pwd)/skill/${SKILL}\"\n+        ln -sf \"${SKILL_PATH}\" ~/.agents/skills/${SKILL}\n+        ln -sf \"${SKILL_PATH}\" ~/.claude/skills/${SKILL}\n+        ls -la ~/.claude/skills/${SKILL}/SKILL.md\n+        ls -la ~/.agents/skills/${SKILL}/SKILL.md\n+      guidance: |\n+        Smoke-test: start new session, type \"help me use <tool-name>\",\n+        confirm Claude loads the skill.\n+        If not: check description keywords; verify symlink resolves.\ndiff --git a/examples/flows/create-agent-skill.yaml b/examples/flows/create-agent-skill.yaml\nnew file mode 100644\nindex 0000000..7d70290\n--- /dev/null\n+++ b/examples/flows/create-agent-skill.yaml\n@@ -0,0 +1,464 @@\n+flow_id: \"flow:create-agent-skill:1.0\"\n+name: \"Create Agent Skill\"\n+version: \"1.0\"\n+description: \"Create a folder-based agent skill for any CLI, API, or toolset\"\n+entry_step: \"decide-shape\"\n+\n+config:\n+  category: \"documentation\"\n+  triggers:\n+    - \"create agent skill\"\n+    - \"add skill for this tool\"\n+    - \"create skill folder\"\n+    - \"document tool for agents\"\n+    - \"agentskills.io skill\"\n+    - \"skill for CLI\"\n+    - \"skill for API\"\n+\n+  procedure: |\n+    ## Create Agent Skill\n+\n+    Produces a well-structured agent skill folder that teaches an LLM\n+    how to use a CLI, API, server, or any toolset — covering:\n+    - Core invocation and configuration\n+    - Operation patterns (with runnable examples)\n+    - Common mistakes and error handling\n+    - Scripts/commands for repetitive operations\n+\n+    The output is a skill folder conforming to the agentskills.io spec:\n+\n+    ```\n+    skill/\n+    ├── SKILL.md           # main skill doc (required)\n+    ├── references/        # extended docs, API refs, deep guides\n+    ├── scripts/           # executable helpers for repetitive ops\n+    └── templates/         # config/code templates for output\n+    ```\n+\n+    ## Audience\n+\n+    The LLM reading the skill.  Not a human developer.\n+    Write to teach an autonomous agent — not to explain to a user.\n+    Every line must be actionable.\n+\n+    ## When to create a new skill\n+\n+    - A CLI, API, or service is used repeatedly across sessions and the\n+      agent keeps making the same mistakes or needs repeated setup\n+    - An op is complex enough that free-form guidance produces errors\n+    - A set of commands has precise, non-obvious invocation order\n+    - The project exposes scripts/commands worth naming and documenting\n+\n+    ## Skill types this flow covers\n+\n+    | Target | Primary content |\n+    |--------|----------------|\n+    | CLI tool | command reference, flags, common workflows, error table |\n+    | HTTP API / server | base URL, auth, endpoint patterns, request/response shapes |\n+    | SDK / library | install, init, key APIs, error handling |\n+    | Scripts / ops | named operations, invocation, expected output |\n+\n+steps:\n+  # ── Phase 1: Decide shape ────────────────────────────────────────────────────\n+\n+  decide-shape:\n+    step_id: \"decide-shape\"\n+    type: \"branch\"\n+    title: \"Single file or folder skill?\"\n+    cases:\n+      - when: \"complexity == 'simple'\"\n+        next: \"simple-skill-path\"\n+      - when: \"complexity == 'complex'\"\n+        next: \"audit-tool\"\n+    default_next: \"audit-tool\"\n+    meta:\n+      guidance: |\n+        Use the flat single-file path (SKILL.md only) when:\n+        - Tool has ≤ ~20 commands/endpoints\n+        - No scripts or templates needed\n+        - No extended reference docs needed\n+        - SKILL.md stays under 5k words\n+\n+        Use the folder path otherwise. When in doubt, start folder — it\n+        scales; a flat file does not.\n+\n+  simple-skill-path:\n+    step_id: \"simple-skill-path\"\n+    type: \"task\"\n+    title: \"Write single-file SKILL.md (simple tool)\"\n+    task_ref: \"task:simple-skill-path\"\n+    meta:\n+      guidance: |\n+        Write a single SKILL.md at skill/<tool-name>/SKILL.md.\n+\n+        Required frontmatter:\n+        ```yaml\n+        ---\n+        name: <lowercase-hyphen-case>\n+        description: |\n+          <active voice, 250-350 chars>\n+          <Paragraph 1: what it does + key features>\n+          <Paragraph 2: \"Use when:\" + 3-5 triggers + 2-3 error keywords>\n+        ---\n+        ```\n+\n+        Sections to include (adapt to tool):\n+        1. When to use / auto-activation conditions\n+        2. Quick start (smallest runnable example)\n+        3. Core commands / endpoints — table (Command | Effect)\n+        4. Key flags / options reference table\n+        5. Common workflows (numbered steps)\n+        6. Common mistakes table (Mistake | Correct)\n+        7. Error handling table (Error | Cause | Fix)\n+\n+        Rules:\n+        - Max 5k words\n+        - Max 100 chars/line\n+        - No narrative — tables and code blocks only\n+        - Write for an LLM reader, not a human developer\n+\n+  # ── Phase 2: Audit tool surface (folder path) ────────────────────────────────\n+\n+  audit-tool:\n+    step_id: \"audit-tool\"\n+    type: \"task\"\n+    title: \"Audit tool surface: CLI, API, scripts, error patterns\"\n+    task_ref: \"task:audit-tool\"\n+    meta:\n+      tool: \"shell --help sweep + xray\"\n+      commands: |\n+        TOOL=\"<tool-name>\"\n+\n+        # Dump full CLI surface\n+        $TOOL --help > /tmp/${TOOL}-surface.txt\n+        $TOOL help --all >> /tmp/${TOOL}-surface.txt 2>&1 || true\n+        # Per-subcommand sweep (adapt list to actual subcommands)\n+        for sub in $($TOOL --help | awk '/^  [a-z]/{print $1}'); do\n+          echo \"=== $TOOL $sub ===\" >> /tmp/${TOOL}-surface.txt\n+          $TOOL $sub --help 2>&1 >> /tmp/${TOOL}-surface.txt\n+        done\n+\n+        # For HTTP API: dump OpenAPI spec if available\n+        curl -s http://localhost:PORT/openapi.json > /tmp/${TOOL}-openapi.json 2>/dev/null\n+\n+        # For scripts/ops: enumerate build targets\n+        just --list 2>/dev/null > /tmp/${TOOL}-ops.txt || \\\n+          make -qp 2>/dev/null | awk -F: '/^[a-zA-Z]/{print $1}' >> /tmp/${TOOL}-ops.txt\n+      guidance: |\n+        - Read /tmp/${TOOL}-surface.txt to build the command inventory (LLM step)\n+        - Identify the 5-10 most-used commands by scanning READMEs and issues\n+        - Trigger invalid ops manually to collect exact error messages (LLM step)\n+\n+  # ── Phase 3: Research and scaffold (parallel) ────────────────────────────────\n+\n+  research-parallel:\n+    step_id: \"research-parallel\"\n+    type: \"parallel\"\n+    title: \"Research common mistakes, errors, and op patterns\"\n+    depends_on: [\"audit-tool\"]\n+    children: [\"research-errors\", \"research-ops\", \"scaffold-folder\"]\n+    max_concurrency: 3\n+\n+  research-errors:\n+    step_id: \"research-errors\"\n+    type: \"task\"\n+    title: \"Collect error messages and failure modes\"\n+    task_ref: \"task:research-errors\"\n+    meta:\n+      guidance: |\n+        Deliberately trigger errors to collect exact messages:\n+        - Missing required flags/args\n+        - Invalid values\n+        - Wrong command order (e.g. not initialised before running)\n+        - Auth failures\n+        - State machine violations (if applicable)\n+\n+        For each error, record:\n+        - Exact error string (copy-paste from terminal)\n+        - Root cause (one clause)\n+        - Fix (exact command to run)\n+\n+        This feeds the Error Handling table and the description's\n+        \"Use when: troubleshooting X\" keywords.\n+\n+  research-ops:\n+    step_id: \"research-ops\"\n+    type: \"task\"\n+    title: \"Identify repetitive operations worth scripting\"\n+    task_ref: \"task:research-ops\"\n+    meta:\n+      guidance: |\n+        Look for operations that are:\n+        - Run on every project setup (init, configure, auth)\n+        - Multi-step with a fixed order\n+        - Prone to typos or wrong flag combinations\n+        - Frequently asked about (check READMEs, docs, issues)\n+\n+        For each candidate op:\n+        - Write the exact invocation sequence\n+        - Note expected output (what success looks like)\n+        - Note destructive side-effects if any\n+\n+        These become scripts/ entries or named workflow sections.\n+\n+  scaffold-folder:\n+    step_id: \"scaffold-folder\"\n+    type: \"task\"\n+    title: \"Scaffold skill folder structure\"\n+    task_ref: \"task:scaffold-folder\"\n+    meta:\n+      tool: \"skill-creator init script\"\n+      commands: |\n+        SKILL=\"<tool-name>\"\n+        # skill-creator init writes canonical folder + frontmatter placeholder\n+        python3 ~/.agents/skills/skill-creator/scripts/init_skill.py \"${SKILL}\"\n+        # result: skill/${SKILL}/{SKILL.md,references/,scripts/,templates/}\n+        # If skill-creator not installed, scaffold manually:\n+        # mkdir -p \"skill/${SKILL}\"/{references,scripts,templates}\n+        # printf -- \"---\\nname: ${SKILL}\\ndescription: |\\n  [DRAFT]\\n---\\n\" \\\n+        #   > \"skill/${SKILL}/SKILL.md\"\n+      guidance: |\n+        - Do not write SKILL.md content yet — downstream steps do that\n+        - Confirm target location: skill/ (project-local) or\n+          ~/.agents/skills/ (global)\n+\n+  # ── Phase 4: Write core docs (parallel) ─────────────────────────────────────\n+\n+  write-parallel:\n+    step_id: \"write-parallel\"\n+    type: \"parallel\"\n+    title: \"Write SKILL.md body and reference docs\"\n+    depends_on: [\"research-parallel\"]\n+    children: [\"write-skill-md\", \"write-references\", \"write-scripts\"]\n+    max_concurrency: 3\n+\n+  write-skill-md:\n+    step_id: \"write-skill-md\"\n+    type: \"task\"\n+    title: \"Write SKILL.md body\"\n+    task_ref: \"task:write-skill-md\"\n+    meta:\n+      guidance: |\n"
    exit_code: 0

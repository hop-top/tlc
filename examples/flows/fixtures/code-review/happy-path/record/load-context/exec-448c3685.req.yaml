 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/contracts/done.yaml b/examples/flows/fixtures/pr-review-loop/happy-path/contracts/done.yaml\nnew file mode 100644\nindex 0000000..bc430c1\n--- /dev/null\n+++ b/examples/flows/fixtures/pr-review-loop/happy-path/contracts/done.yaml\n@@ -0,0 +1,9 @@\n+name: done_gate\n+provider: filesystem\n+evaluators:\n+  - name: contains\n+    substring: '\"result\": \"Approved\"'\n+    mode: binary\n+  - name: regex\n+    pattern: '\"iterations\"\\s*:\\s*[1-9][0-9]*'\n+    mode: binary\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/contracts/reviewer-pass.yaml b/examples/flows/fixtures/pr-review-loop/happy-path/contracts/reviewer-pass.yaml\nnew file mode 100644\nindex 0000000..c438890\n--- /dev/null\n+++ b/examples/flows/fixtures/pr-review-loop/happy-path/contracts/reviewer-pass.yaml\n@@ -0,0 +1,9 @@\n+name: reviewer_pass_gate\n+provider: filesystem\n+evaluators:\n+  - name: regex\n+    pattern: '\"status\"\\s*:\\s*\"[^\"]+'\n+    mode: binary\n+  - name: regex\n+    pattern: '\"summary\"\\s*:\\s*\"[^\"]+'\n+    mode: binary\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/done/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/done/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/fixer-pass/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/fixer-pass/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/handle-fixer-output/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/handle-fixer-output/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/handle-reviewer-output/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/handle-reviewer-output/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/load-pr-context/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/load-pr-context/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/pr-review-loop/happy-path/record/reviewer-pass/.gitkeep b/examples/flows/fixtures/pr-review-loop/happy-path/record/reviewer-pass/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/systematic-debugging/happy-path/contracts/.gitkeep b/examples/flows/fixtures/systematic-debugging/happy-path/contracts/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/systematic-debugging/happy-path/record/.gitkeep b/examples/flows/fixtures/systematic-debugging/happy-path/record/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/test-driven-development/happy-path/contracts/.gitkeep b/examples/flows/fixtures/test-driven-development/happy-path/contracts/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/test-driven-development/happy-path/record/.gitkeep b/examples/flows/fixtures/test-driven-development/happy-path/record/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/verification-before-completion/happy-path/contracts/.gitkeep b/examples/flows/fixtures/verification-before-completion/happy-path/contracts/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/verification-before-completion/happy-path/record/.gitkeep b/examples/flows/fixtures/verification-before-completion/happy-path/record/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/writing-plans/happy-path/contracts/.gitkeep b/examples/flows/fixtures/writing-plans/happy-path/contracts/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/fixtures/writing-plans/happy-path/record/.gitkeep b/examples/flows/fixtures/writing-plans/happy-path/record/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/examples/flows/oss-release-prep-validated.yaml b/examples/flows/oss-release-prep-validated.yaml\nnew file mode 100644\nindex 0000000..c4ca620\n--- /dev/null\n+++ b/examples/flows/oss-release-prep-validated.yaml\n@@ -0,0 +1,488 @@\n+flow_id: \"flow:oss-release-prep-validated:1.0\"\n+name: \"OSS Release Preparation (Validated)\"\n+version: \"1.0\"\n+description: \"Prepare a codebase for initial OSS release with eva contract gating\"\n+entry_step: \"audit-repo\"\n+\n+config:\n+  category: \"release\"\n+  triggers:\n+    - \"initial OSS release\"\n+    - \"open-sourcing a project\"\n+    - \"preparing public repo\"\n+\n+  validation_strategy: |\n+    ## Validation Strategy\n+\n+    ### eva (deterministic gating)\n+    Every phase that produces a file or a state transition is gated by an\n+    eva contract before the next phase can start.  Contracts live in\n+    evals/oss-release/ and cover:\n+\n+    - oss-audit.yaml      — no HIGH findings in gitleaks report\n+    - oss-legal.yaml      — LICENSE + headers present and well-formed\n+    - oss-docs.yaml       — README, CONTRIBUTING, SECURITY meet structural spec\n+    - oss-community.yaml  — CoC, templates, CHANGELOG present\n+    - oss-cicd.yaml       — CI + release workflows parse as valid YAML\n+    - oss-release.yaml    — tag pushed, GitHub Release exists\n+\n+    Each eva contract uses Tier 1 evaluators (zero LLM calls):\n+    - contains / regex — file presence, keyword, format checks\n+    - json_schema_valid  — YAML/JSON structure validation\n+\n+    ### routellm (LLM cost routing)\n+    Three steps require generative LLM output:\n+    - write-readme         — high complexity; route to strong model\n+    - write-contributing   — medium complexity; route via mf router\n+    - write-security-policy — low complexity; route to weak model\n+\n+    The routellm Controller is initialised once; each step passes its\n+    estimated complexity score as the routing hint.\n+\n+  eva_contracts_dir: \"evals/oss-release\"\n+  routellm_config: \"config/routellm.yaml\"\n+\n+steps:\n+  # ── Phase 1: Audit ──────────────────────────────────────────────────────────\n+\n+  audit-repo:\n+    step_id: \"audit-repo\"\n+    type: \"task\"\n+    title: \"Audit repo for secrets, private refs, and binary blobs\"\n+    task_ref: \"task:audit-repo\"\n+    meta:\n+      tool: \"gitleaks + git one-liner\"\n+      commands: |\n+        gitleaks detect --source . --report-format json \\\n+          --report-path gitleaks-report.json\n+        git rev-list --objects --all \\\n+          | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \\\n+          | awk '/^blob/ && $3 > 1048576 { print $3, $4 }' | sort -rn | head -20\n+      guidance: |\n+        - Review gitleaks-report.json; block release on any HIGH findings\n+        - Inspect large-binary list; decide keep vs. remove each\n+        - Manually grep for internal hostnames, TODOs referencing internal systems\n+\n+  gate-audit:\n+    step_id: \"gate-audit\"\n+    type: \"task\"\n+    title: \"eva gate: audit findings must be zero HIGH\"\n+    task_ref: \"task:gate-audit\"\n+    depends_on: [\"audit-repo\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        # Contract: evals/oss-release/oss-audit.yaml\n+        # Evaluator: regex — asserts gitleaks-report.json contains no HIGH findings\n+        eva run \\\n+          --dataset evals/oss-release/oss-audit-dataset.yaml \\\n+          --no-tui\n+        # exits 1 if any HIGH finding; flow cannot proceed until exit 0\n+      eva_contract: \"evals/oss-release/oss-audit.yaml\"\n+      eva_contract_body: |\n+        name: oss_audit_gate\n+        provider: gitleaks\n+        evaluators:\n+          - name: contains\n+            substring: '\"Severity\":\"Info\"'\n+            mode: warn\n+          - name: regex\n+            pattern: '\"Severity\":\"(High|Critical)\"'\n+            # presence of this pattern = FAIL; invert: wrap in no_pii-style plugin\n+            mode: binary\n+        # dataset sends gitleaks-report.json content as the \"response\"\n+\n+  # ── Phase 2: Legal + Identity (parallel) ────────────────────────────────────\n+\n+  legal-parallel:\n+    step_id: \"legal-parallel\"\n+    type: \"parallel\"\n+    title: \"Legal and identity files\"\n+    depends_on: [\"gate-audit\"]\n+    children: [\"add-license\", \"add-copyright-headers\", \"add-codeowners\"]\n+    max_concurrency: 3\n+\n+  add-license:\n+    step_id: \"add-license\"\n+    type: \"task\"\n+    title: \"Add LICENSE file\"\n+    task_ref: \"task:add-license\"\n+    meta:\n+      tool: \"gh CLI\"\n+      commands: |\n+        gh repo edit --license \"${LICENSE}\"   # e.g. mit, apache-2.0\n+      guidance: |\n+        - Confirm SPDX identifier with owner before running (LLM decision)\n+        - Update go.mod/pyproject.toml/package.json license field\n+\n+  add-copyright-headers:\n+    step_id: \"add-copyright-headers\"\n+    type: \"task\"\n+    title: \"Add copyright/license headers to source files\"\n+    task_ref: \"task:add-copyright-headers\"\n+    meta:\n+      tool: \"addlicense\"\n+      commands: |\n+        addlicense -check -l mit -c \"<copyright holder>\" \\\n+          -ignore \"vendor/**\" -ignore \"**/*.pb.go\" -ignore \"**/*.gen.*\" .\n+        addlicense -l mit -c \"<copyright holder>\" \\\n+          -ignore \"vendor/**\" -ignore \"**/*.pb.go\" -ignore \"**/*.gen.*\" .\n+        git add -A && git commit -m \"chore: add license headers\"\n+\n+  add-codeowners:\n+    step_id: \"add-codeowners\"\n+    type: \"task\"\n+    title: \"Add CODEOWNERS file\"\n+    task_ref: \"task:add-codeowners\"\n+    meta:\n+      guidance: |\n+        - Create .github/CODEOWNERS mapping top-level dirs to maintainer handles\n+        - Add catch-all rule (*) pointing to core maintainers\n+\n+  gate-legal:\n+    step_id: \"gate-legal\"\n+    type: \"task\"\n+    title: \"eva gate: LICENSE, headers, and CODEOWNERS present\"\n+    task_ref: \"task:gate-legal\"\n+    depends_on: [\"legal-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/oss-release/oss-legal-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/oss-release/oss-legal.yaml\"\n+      eva_contract_body: |\n+        name: oss_legal_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: contains\n+            substring: \"MIT License\"    # or Apache, GPL — adapt to project\n+            mode: binary\n+          - name: regex\n+            pattern: \"SPDX-License-Identifier:\"\n+            mode: binary\n+          - name: contains\n+            substring: \"* @\"            # CODEOWNERS entry\n+            mode: binary\n+        # dataset sends concatenated file contents as response\n+\n+  # ── Phase 3: Core Documentation (parallel) ───────────────────────────────────\n+\n+  core-docs-parallel:\n+    step_id: \"core-docs-parallel\"\n+    type: \"parallel\"\n+    title: \"Core documentation\"\n+    depends_on: [\"gate-legal\"]\n+    children: [\"write-readme\", \"write-contributing\", \"write-security-policy\"]\n+    max_concurrency: 3\n+\n+  write-readme:\n+    step_id: \"write-readme\"\n+    type: \"task\"\n+    title: \"Write README.md\"\n+    task_ref: \"task:write-readme\"\n+    meta:\n+      routellm_hint: \"strong\"\n+      guidance: |\n+        Route to strong model — README is the project's public face;\n+        quality matters more than cost here.\n+\n+        Required sections: project name + description, badges, motivation,\n+        quick-start, usage examples, config reference, roadmap, license pointer.\n+\n+        routellm: model=\"router-mf-0.05\"   # low threshold → almost always strong\n+\n+  write-contributing:\n+    step_id: \"write-contributing\"\n+    type: \"task\"\n+    title: \"Write CONTRIBUTING.md\"\n+    task_ref: \"task:write-contributing\"\n+    meta:\n+      routellm_hint: \"medium\"\n+      guidance: |\n+        Route via default mf threshold — structural doc, medium quality bar.\n+        Sections: prerequisites, fork+clone+setup, running tests, commit\n+        convention, PR process, issue triage.\n+\n+        routellm: model=\"router-mf-0.30\"\n+\n+  write-security-policy:\n+    step_id: \"write-security-policy\"\n+    type: \"task\"\n+    title: \"Write SECURITY.md\"\n+    task_ref: \"task:write-security-policy\"\n+    meta:\n+      routellm_hint: \"weak\"\n+      guidance: |\n+        Route to weak model — templated content; weak model is sufficient.\n+        Sections: supported versions table, responsible disclosure,\n+        contact channel, response timeline.\n+\n+        routellm: model=\"router-mf-0.80\"   # high threshold → almost always weak\n+\n+  gate-core-docs:\n+    step_id: \"gate-core-docs\"\n+    type: \"task\"\n+    title: \"eva gate: README, CONTRIBUTING, SECURITY meet structural spec\"\n+    task_ref: \"task:gate-core-docs\"\n+    depends_on: [\"core-docs-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/oss-release/oss-docs-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/oss-release/oss-docs.yaml\"\n+      eva_contract_body: |\n+        name: oss_docs_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: contains\n+            substring: \"## \"          # at least one H2 section\n+            mode: binary\n+          - name: regex\n+            pattern: \"^# .+\"         # H1 title present\n+            mode: binary\n+          - name: contains\n+            substring: \"```\"          # at least one code block\n+            mode: binary\n+          - name: contains\n+            substring: \"Supported Versions\"\n+            mode: binary              # SECURITY.md check\n+        # dataset sends each file as a separate test case\n+\n+  # ── Phase 4: Community Files (parallel) ─────────────────────────────────────\n+\n+  community-parallel:\n+    step_id: \"community-parallel\"\n+    type: \"parallel\"\n+    title: \"Community and governance files\"\n+    depends_on: [\"gate-core-docs\"]\n+    children: [\"add-issue-templates\", \"add-pr-template\",\n+               \"add-code-of-conduct\", \"init-changelog\"]\n+    max_concurrency: 4\n+\n+  add-issue-templates:\n+    step_id: \"add-issue-templates\"\n+    type: \"task\"\n+    title: \"Add GitHub issue templates\"\n+    task_ref: \"task:add-issue-templates\"\n+    meta:\n+      guidance: |\n+        Create .github/ISSUE_TEMPLATE/: bug_report.md, feature_request.md,\n+        blank.md. LLM fills in project-specific context.\n+\n+  add-pr-template:\n+    step_id: \"add-pr-template\"\n+    type: \"task\"\n+    title: \"Add pull request template\"\n+    task_ref: \"task:add-pr-template\"\n+    meta:\n+      guidance: |\n+        Create .github/pull_request_template.md with summary, related issue,\n+        testing notes, and checklist.\n+\n+  add-code-of-conduct:\n+    step_id: \"add-code-of-conduct\"\n+    type: \"task\"\n+    title: \"Add CODE_OF_CONDUCT.md\"\n+    task_ref: \"task:add-code-of-conduct\"\n+    meta:\n+      tool: \"npx covgen\"\n+      commands: |\n+        npx covgen \"<contact-email>\"\n+      guidance: |\n+        - No LLM content generation needed; covgen writes Contributor Covenant v2.1\n+\n+  init-changelog:\n+    step_id: \"init-changelog\"\n+    type: \"task\"\n+    title: \"Initialise CHANGELOG.md\"\n+    task_ref: \"task:init-changelog\"\n+    meta:\n+      guidance: |\n+        Follow Keep a Changelog format. Add [Unreleased] section.\n+        Summarise notable changes since project inception.\n+\n+  gate-community:\n+    step_id: \"gate-community\"\n+    type: \"task\"\n+    title: \"eva gate: CoC, templates, and CHANGELOG present\"\n+    task_ref: \"task:gate-community\"\n+    depends_on: [\"community-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/oss-release/oss-community-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/oss-release/oss-community.yaml\"\n+      eva_contract_body: |\n+        name: oss_community_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: contains\n+            substring: \"Contributor Covenant\"\n+            mode: binary\n+          - name: contains\n+            substring: \"## [Unreleased]\"\n+            mode: binary\n+          - name: regex\n+            pattern: \"steps to reproduce\"\n+            mode: binary              # bug_report template check\n+            case_sensitive: false\n+          - name: contains\n+            substring: \"- [ ]\"        # PR template checklist\n+            mode: binary\n+\n+  # ── Phase 5: CI/CD (parallel) ────────────────────────────────────────────────\n+\n+  cicd-parallel:\n+    step_id: \"cicd-parallel\"\n+    type: \"parallel\"\n+    title: \"CI/CD pipelines and automation\"\n+    depends_on: [\"gate-community\"]\n+    children: [\"add-ci-workflow\", \"add-release-workflow\", \"add-dependency-bot\"]\n+    max_concurrency: 3\n+\n+  add-ci-workflow:\n+    step_id: \"add-ci-workflow\"\n+    type: \"task\"\n+    title: \"Add CI workflow (lint, test, build)\"\n+    task_ref: \"task:add-ci-workflow\"\n+    meta:\n+      guidance: |\n+        Create .github/workflows/ci.yml: push+PR triggers, lint→test→build,\n+        version matrix, dependency caching, coverage upload.\n+\n+  add-release-workflow:\n+    step_id: \"add-release-workflow\"\n+    type: \"task\"\n+    title: \"Add release workflow (tag → publish)\"\n+    task_ref: \"task:add-release-workflow\"\n+    meta:\n+      tool: \"goreleaser init (Go) OR semantic-release init (JS/TS)\"\n+      commands: |\n+        goreleaser init && goreleaser check\n+        # or: npx semantic-release-cli setup\n+\n+  add-dependency-bot:\n+    step_id: \"add-dependency-bot\"\n+    type: \"task\"\n+    title: \"Configure Dependabot (or Renovate)\"\n+    task_ref: \"task:add-dependency-bot\"\n+    meta:\n+      tool: \"npx create-renovate-config OR gh CLI heredoc\"\n+      commands: |\n+        npx create-renovate-config\n+        # or write .github/dependabot.yml directly\n+\n+  gate-cicd:\n+    step_id: \"gate-cicd\"\n+    type: \"task\"\n+    title: \"eva gate: CI + release workflow YAML is structurally valid\"\n+    task_ref: \"task:gate-cicd\"\n+    depends_on: [\"cicd-parallel\"]\n+    meta:\n+      tool: \"eva\"\n+      commands: |\n+        eva run \\\n+          --dataset evals/oss-release/oss-cicd-dataset.yaml \\\n+          --no-tui\n+      eva_contract: \"evals/oss-release/oss-cicd.yaml\"\n+      eva_contract_body: |\n+        name: oss_cicd_gate\n+        provider: filesystem\n+        evaluators:\n+          - name: contains\n+            substring: \"on:\"\n+            mode: binary              # workflow has trigger block\n+          - name: regex\n+            pattern: \"push:|pull_request:\"\n+            mode: binary\n+          - name: contains\n+            substring: \"jobs:\"\n+            mode: binary\n+          - name: regex\n+            pattern: \"on:\\\\s*\\\\n\\\\s*push:\\\\s*\\\\n\\\\s*tags:\"\n+            mode: binary              # release workflow triggered on tags\n+\n+  # ── Phase 6: Final Gate (sequential) ─────────────────────────────────────────\n+\n+  join-all-prep:\n+    step_id: \"join-all-prep\"\n+    type: \"join\"\n+    title: \"All prep phases complete\"\n+    wait_for: [\"gate-cicd\"]\n+\n+  final-review:\n+    step_id: \"final-review\"\n+    type: \"task\"\n+    title: \"Final review: checklist walk-through\"\n+    task_ref: \"task:final-review\"\n+    depends_on: [\"join-all-prep\"]\n+    meta:\n+      guidance: |\n+        Walk through the OSS release checklist:\n+        - No secrets or private refs in history (re-run gitleaks)\n+        - All eva gates passed\n+        - README renders correctly on GitHub\n+        - Repo description, topics, homepage set in GitHub Settings\n+        - Branch protection rules enabled on main\n+\n+  run-full-test-suite:\n+    step_id: \"run-full-test-suite\"\n+    type: \"task\"\n+    title: \"Run full test suite; confirm green\"\n+    task_ref: \"task:run-full-test-suite\"\n+    depends_on: [\"final-review\"]\n+    meta:\n+      tool: \"just / make\"\n+      commands: |\n+        just check      # exits non-zero on any failure\n+\n+  cut-initial-tag:\n+    step_id: \"cut-initial-tag\"\n+    type: \"task\"\n+    title: \"Cut initial release tag (v0.1.0 or v1.0.0)\"\n+    task_ref: \"task:cut-initial-tag\"\n+    depends_on: [\"run-full-test-suite\"]\n+    meta:\n+      tool: \"gh CLI\"\n+      commands: |\n+        VERSION=\"v0.1.0\"\n+        git tag -s \"${VERSION}\" -m \"Initial public release\"\n+        git push origin \"${VERSION}\"\n+        gh release create \"${VERSION}\" --generate-notes --title \"${VERSION}\"\n+      guidance: |\n+        - Confirm version string with owner before tagging (LLM decision)\n+\n+  gate-release:\n+    step_id: \"gate-release\"\n+    type: \"task\"\n+    title: \"eva gate: GitHub Release exists and is well-formed\"\n+    task_ref: \"task:gate-release\"\n+    depends_on: [\"cut-initial-tag\"]\n+    meta:\n+      tool: \"eva + gh CLI\"\n+      commands: |\n+        # Fetch release JSON from gh and pipe as the eval target\n+        gh release view \"${VERSION}\" --json name,tagName,body \\\n+          | eva run \\\n+              --dataset evals/oss-release/oss-release-dataset.yaml \\\n+              --no-tui\n+      eva_contract: \"evals/oss-release/oss-release.yaml\"\n+      eva_contract_body: |\n+        name: oss_release_gate\n+        provider: gh_release\n+        evaluators:\n+          - name: contains\n+            substring: \"tagName\"\n+            mode: binary\n+          - name: regex\n+            pattern: \"v[0-9]+\\\\.[0-9]+\\\\.[0-9]+\"\n+            mode: binary\n+          - name: contains\n+            substring: \"body\"         # release notes present\n+            mode: binary\ndiff --git a/examples/flows/oss-release-prep.yaml b/examples/flows/oss-release-prep.yaml\nnew file mode 100644\nindex 0000000..e12f82b\n--- /dev/null\n+++ b/examples/flows/oss-release-prep.yaml\n@@ -0,0 +1,386 @@\n+flow_id: \"flow:oss-release-prep:1.0\"\n+name: \"OSS Release Preparation\"\n+version: \"1.0\"\n+description: \"Prepare a codebase for initial open-source release\"\n+entry_step: \"audit-repo\"\n+\n+config:\n+  category: \"release\"\n+  triggers:\n+    - \"initial OSS release\"\n+    - \"open-sourcing a project\"\n+    - \"preparing public repo\"\n+\n+  procedure: |\n+    ## OSS Release Preparation\n+\n+    Systematically prepares a private codebase for public open-source release.\n+    Covers legal, documentation, community, CI/CD, and hygiene concerns.\n+\n+    ## Phases\n+\n+    ### Phase 1: Audit (sequential)\n+    Scan the repo before touching anything — find secrets, TODOs,\n+    private refs, and binary blobs that must not ship.\n+\n+    ### Phase 2: Legal + Identity (parallel)\n+    License file, copyright headers, and CODEOWNERS can all be\n+    written independently.\n+\n+    ### Phase 3: Core Documentation (parallel)\n+    README, CONTRIBUTING guide, and security policy are independent.\n+\n+    ### Phase 4: Community Files (parallel)\n+    Issue/PR templates, code of conduct, and changelog skeleton\n+    have no ordering dependencies.\n+\n+    ### Phase 5: CI/CD (parallel)\n+    Test workflow, release workflow, and dependency-update bot\n+    config can be wired up simultaneously.\n+\n+    ### Phase 6: Final Gate (sequential)\n+    Review everything assembled, run the full test suite, then\n+    cut the initial tag and publish.\n+\n+steps:\n+  # ── Phase 1: Audit ──────────────────────────────────────────────────────────\n+\n+  audit-repo:\n+    step_id: \"audit-repo\"\n+    type: \"task\"\n+    title: \"Audit repo for secrets, private refs, and binary blobs\"\n+    task_ref: \"task:audit-repo\"\n+    meta:\n+      tool: \"gitleaks + manual\"\n+      commands: |\n+        # Secret scan — full git history; exits non-zero on findings\n+        gitleaks detect --source . --report-format json \\\n+          --report-path gitleaks-report.json\n+        # Large binary audit\n+        git rev-list --objects --all \\\n+          | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \\\n+          | awk '/^blob/ && $3 > 1048576 { print $3, $4 }' | sort -rn | head -20\n+      guidance: |\n+        - Review gitleaks-report.json; block release on any HIGH findings\n+        - Inspect large-binary list; decide keep vs. remove each\n+        - Manually grep for internal hostnames, IPs, TODO/FIXME referencing\n+          internal systems or people (LLM step — tool cannot infer intent)\n+\n+  # ── Phase 2: Legal + Identity (parallel) ────────────────────────────────────\n+\n+  legal-parallel:\n+    step_id: \"legal-parallel\"\n+    type: \"parallel\"\n+    title: \"Legal and identity files\"\n+    depends_on: [\"audit-repo\"]\n+    children: [\"add-license\", \"add-copyright-headers\", \"add-codeowners\"]\n+    max_concurrency: 3\n+\n+  add-license:\n+    step_id: \"add-license\"\n+    type: \"task\"\n+    title: \"Add LICENSE file\"\n+    task_ref: \"task:add-license\"\n+    meta:\n+      tool: \"gh CLI\"\n+      commands: |\n+        # Confirm SPDX id with owner first (LLM step), then:\n+        YEAR=$(date +%Y)\n+        OWNER=\"<copyright holder>\"\n+        LICENSE=\"mit\"   # or apache-2.0, etc.\n+        # Fetch canonical text from choosealicense.com and write file\n+        curl -sL \"https://choosealicense.com/licenses/${LICENSE}/\" \\\n+          | sed -n 's/.*<pre id=\"license-text\">\\(.*\\)<\\/pre>.*/\\1/p' \\\n+          > /dev/null   # use gh instead:\n+        gh repo edit --license \"${LICENSE}\"\n+        # Update manifest license field (go.mod has no field; package.json does)\n+        # jq --arg l \"${LICENSE}\" '.license = $l' package.json | sponge package.json\n+      guidance: |\n+        - Confirm SPDX identifier with owner before running (LLM decision)\n+        - Replace OWNER and LICENSE vars above\n+        - Update go.mod/pyproject.toml/package.json license field manually\n+          if not handled by gh\n+\n+  add-copyright-headers:\n+    step_id: \"add-copyright-headers\"\n+    type: \"task\"\n+    title: \"Add copyright/license headers to source files\"\n+    task_ref: \"task:add-copyright-headers\"\n+    meta:\n+      tool: \"addlicense\"\n+      commands: |\n+        YEAR=$(date +%Y)\n+        # Dry run first\n+        addlicense -check -l mit -c \"<copyright holder>\" \\\n+          -ignore \"vendor/**\" -ignore \"**/*.pb.go\" -ignore \"**/*.gen.*\" .\n+        # Apply headers\n+        addlicense -l mit -c \"<copyright holder>\" \\\n+          -ignore \"vendor/**\" -ignore \"**/*.pb.go\" -ignore \"**/*.gen.*\" .\n+        git add -A && git commit -m \"chore: add license headers\"\n+      guidance: |\n+        - Install: go install github.com/google/addlicense@latest\n+        - Replace <copyright holder> with the legal entity name\n+        - Review the diff before committing; adjust -ignore patterns as needed\n+\n+  add-codeowners:\n+    step_id: \"add-codeowners\"\n+    type: \"task\"\n+    title: \"Add CODEOWNERS file\"\n+    task_ref: \"task:add-codeowners\"\n+    meta:\n+      guidance: |\n+        - Create .github/CODEOWNERS (or CODEOWNERS at root)\n+        - Map top-level directories to maintainer GitHub handles\n+        - Add a catch-all rule (*) pointing to core maintainers\n+\n+  # ── Phase 3: Core Documentation (parallel) ───────────────────────────────────\n+\n+  core-docs-parallel:\n+    step_id: \"core-docs-parallel\"\n+    type: \"parallel\"\n+    title: \"Core documentation\"\n+    depends_on: [\"legal-parallel\"]\n+    children: [\"write-readme\", \"write-contributing\", \"write-security-policy\"]\n+    max_concurrency: 3\n+\n+  write-readme:\n+    step_id: \"write-readme\"\n+    type: \"task\"\n+    title: \"Write README.md\"\n+    task_ref: \"task:write-readme\"\n+    meta:\n+      guidance: |\n+        Required sections:\n+        - Project name + one-line description\n+        - Badges (build status, license, latest release)\n+        - Why this project exists (motivation)\n+        - Quick-start / installation\n+        - Usage examples (runnable snippets)\n+        - Configuration reference (or link)\n+        - Roadmap / status\n+        - License and contributing pointers\n+\n+  write-contributing:\n+    step_id: \"write-contributing\"\n+    type: \"task\"\n+    title: \"Write CONTRIBUTING.md\"\n+    task_ref: \"task:write-contributing\"\n+    meta:\n+      guidance: |\n+        - Prerequisites (language version, tools)\n+        - Fork + clone + local-dev setup steps\n+        - Running tests and linting\n+        - Commit message convention\n+        - PR process and review SLA\n+        - Issue triage policy\n+\n+  write-security-policy:\n+    step_id: \"write-security-policy\"\n+    type: \"task\"\n+    title: \"Write SECURITY.md\"\n+    task_ref: \"task:write-security-policy\"\n+    meta:\n+      guidance: |\n+        - Supported versions table\n+        - Responsible disclosure instructions\n+        - Contact channel (security@… or GitHub private advisory)\n+        - Expected response timeline\n+\n+  # ── Phase 4: Community Files (parallel) ─────────────────────────────────────\n+\n+  community-parallel:\n+    step_id: \"community-parallel\"\n+    type: \"parallel\"\n+    title: \"Community and governance files\"\n+    depends_on: [\"core-docs-parallel\"]\n+    children: [\"add-issue-templates\", \"add-pr-template\",\n+               \"add-code-of-conduct\", \"init-changelog\"]\n+    max_concurrency: 4\n+\n+  add-issue-templates:\n+    step_id: \"add-issue-templates\"\n+    type: \"task\"\n+    title: \"Add GitHub issue templates\"\n+    task_ref: \"task:add-issue-templates\"\n+    meta:\n+      guidance: |\n+        Create .github/ISSUE_TEMPLATE/:\n+        - bug_report.md — env, steps to reproduce, expected vs actual\n+        - feature_request.md — problem statement, proposed solution\n+        - blank.md — catch-all with checklist\n+\n+  add-pr-template:\n+    step_id: \"add-pr-template\"\n+    type: \"task\"\n+    title: \"Add pull request template\"\n+    task_ref: \"task:add-pr-template\"\n+    meta:\n+      guidance: |\n+        Create .github/pull_request_template.md:\n+        - Summary of change\n+        - Related issue(s)\n+        - Testing notes\n+        - Checklist (tests, docs, changelog entry)\n+\n+  add-code-of-conduct:\n+    step_id: \"add-code-of-conduct\"\n+    type: \"task\"\n+    title: \"Add CODE_OF_CONDUCT.md\"\n+    task_ref: \"task:add-code-of-conduct\"\n+    meta:\n+      tool: \"npx covgen\"\n+      commands: |\n+        # Generates Contributor Covenant v2.1 with contact email substituted\n+        npx covgen \"<contact-email>\"\n+        # optionally relocate: mv CODE_OF_CONDUCT.md .github/CODE_OF_CONDUCT.md\n+      guidance: |\n+        - Replace <contact-email> with the project's public contact address\n+        - No LLM content generation needed; covgen writes the canonical text\n+\n+  init-changelog:\n+    step_id: \"init-changelog\"\n+    type: \"task\"\n+    title: \"Initialise CHANGELOG.md\"\n+    task_ref: \"task:init-changelog\"\n+    meta:\n+      guidance: |\n+        - Follow Keep a Changelog format\n+        - Add [Unreleased] section\n+        - Summarise notable changes since project inception\n+          (or note \"initial public release\" if history is private)\n+\n+  # ── Phase 5: CI/CD (parallel) ────────────────────────────────────────────────\n+\n+  cicd-parallel:\n+    step_id: \"cicd-parallel\"\n+    type: \"parallel\"\n+    title: \"CI/CD pipelines and automation\"\n+    depends_on: [\"community-parallel\"]\n+    children: [\"add-ci-workflow\", \"add-release-workflow\", \"add-dependency-bot\"]\n+    max_concurrency: 3\n+\n+  add-ci-workflow:\n+    step_id: \"add-ci-workflow\"\n+    type: \"task\"\n+    title: \"Add CI workflow (lint, test, build)\"\n+    task_ref: \"task:add-ci-workflow\"\n+    meta:\n+      guidance: |\n+        Create .github/workflows/ci.yml:\n+        - Trigger: push + pull_request on main/master\n+        - Jobs: lint → test → build (sequential within job)\n+        - Matrix: supported language/runtime versions\n+        - Cache dependencies for speed\n+        - Upload coverage report (e.g. Codecov)\n+\n+  add-release-workflow:\n+    step_id: \"add-release-workflow\"\n+    type: \"task\"\n+    title: \"Add release workflow (tag → publish)\"\n+    task_ref: \"task:add-release-workflow\"\n+    meta:\n+      tool: \"goreleaser init (Go) OR semantic-release init (JS/TS)\"\n+      commands: |\n+        # Go projects\n+        goreleaser init          # writes .goreleaser.yaml\n+        goreleaser check         # validates config\n+        # JS/TS projects\n+        npx semantic-release-cli setup\n+        # Both scaffold the GitHub Actions workflow; review before committing\n+      guidance: |\n+        - goreleaser init covers: build matrix, GitHub Release, checksums,\n+          cosign signing, Homebrew tap — edit .goreleaser.yaml to taste\n+        - semantic-release covers: version bump, CHANGELOG, npm publish,\n+          GitHub Release — edit .releaserc to add/remove plugins\n+        - After scaffolding, commit and verify CI picks up the workflow\n+\n+  add-dependency-bot:\n+    step_id: \"add-dependency-bot\"\n+    type: \"task\"\n+    title: \"Configure Dependabot (or Renovate)\"\n+    task_ref: \"task:add-dependency-bot\"\n+    meta:\n+      tool: \"npx create-renovate-config OR gh CLI write\"\n+      commands: |\n+        # Option A — Renovate (richer rules)\n+        npx create-renovate-config\n+        # Option B — Dependabot via gh CLI (no npm required)\n+        mkdir -p .github\n+        cat > .github/dependabot.yml << 'EOF'\n+        version: 2\n+        updates:\n+          - package-ecosystem: \"gomod\"\n+            directory: \"/\"\n+            schedule: { interval: \"weekly\" }\n+            open-pull-requests-limit: 5\n+            labels: [\"dependencies\"]\n+          - package-ecosystem: \"github-actions\"\n+            directory: \"/\"\n+            schedule: { interval: \"weekly\" }\n+        EOF\n+      guidance: |\n+        - Adjust package-ecosystem entries to match the actual stack\n+        - Renovate is preferred for monorepos or complex update rules\n+\n+  # ── Phase 6: Final Gate (sequential) ─────────────────────────────────────────\n+\n+  join-all-prep:\n+    step_id: \"join-all-prep\"\n+    type: \"join\"\n+    title: \"All prep phases complete\"\n+    wait_for: [\"cicd-parallel\"]\n+\n+  final-review:\n+    step_id: \"final-review\"\n+    type: \"task\"\n+    title: \"Final review: checklist walk-through\"\n+    task_ref: \"task:final-review\"\n+    depends_on: [\"join-all-prep\"]\n+    meta:\n+      guidance: |\n+        Walk through the OSS release checklist:\n+        - No secrets or private refs in history (re-run scanner)\n+        - LICENSE present and correct\n+        - README renders correctly on GitHub\n+        - All CI workflows pass on the branch\n+        - CHANGELOG has an [Unreleased] or v0.1.0 entry\n+        - Issue/PR templates render in GitHub UI\n+        - Repo description, topics, and homepage set in GitHub Settings\n+        - Branch protection rules enabled on main\n+        - Discussions / Issues enabled as appropriate\n+\n+  run-full-test-suite:\n+    step_id: \"run-full-test-suite\"\n+    type: \"task\"\n+    title: \"Run full test suite; confirm green\"\n+    task_ref: \"task:run-full-test-suite\"\n+    depends_on: [\"final-review\"]\n+    meta:\n+      tool: \"just / make\"\n+      commands: |\n+        just check      # or: make test\n+        # exits non-zero on any failure — no LLM interpretation needed\n+      guidance: |\n+        - If no justfile/Makefile target exists, run the test runner directly\n+          (go test ./..., npm test, pytest, etc.)\n+        - Check coverage output meets project threshold before proceeding\n+\n+  cut-initial-tag:\n+    step_id: \"cut-initial-tag\"\n+    type: \"task\"\n+    title: \"Cut initial release tag (v0.1.0 or v1.0.0)\"\n+    task_ref: \"task:cut-initial-tag\"\n+    depends_on: [\"run-full-test-suite\"]\n+    meta:\n+      tool: \"gh CLI\"\n+      commands: |\n+        VERSION=\"v0.1.0\"   # confirm with owner first (LLM decision)\n+        git tag -s \"${VERSION}\" -m \"Initial public release\"\n+        git push origin \"${VERSION}\"\n+        # Creates GitHub Release with auto-generated notes from commits\n+        gh release create \"${VERSION}\" --generate-notes --title \"${VERSION}\"\n+      guidance: |\n+        - Confirm version string with owner before tagging (LLM decision)\n+        - Update version constant/package.json/pyproject.toml before tagging\n+        - Commit version bump before running the commands above\n+        - Announce on relevant channels after release page is live\ndiff --git a/examples/flows/pr-review-loop.yaml b/examples/flows/pr-review-loop.yaml\nnew file mode 100644\nindex 0000000..24b61f0\n--- /dev/null\n+++ b/examples/flows/pr-review-loop.yaml\n@@ -0,0 +1,305 @@\n+flow_id: \"flow:pr-review-loop:1.0\"\n+name: \"PR Review Loop\"\n+version: \"1.0\"\n+description: |\n+  Automated reviewer→fixer loop for a GitHub PR. Mirrors octorus AI Rally:\n+  reviewer agent posts feedback, fixer agent applies changes, loop continues\n+  until approved or max iterations reached.\n+entry_step: \"load-pr-context\"\n+\n+config:\n+  category: \"quality-assurance\"\n+  triggers:\n+    - \"PR ready for review\"\n+    - \"feedback applied, re-review needed\"\n+    - \"CI passed, needs code review\"\n+\n+  inputs:\n+    repo:\n+      description: \"GitHub repo slug, e.g. owner/repo\"\n+      required: true\n+    pr:\n+      description: \"PR number\"\n+      required: true\n+    working_dir:\n+      description: \"Local clone path (default: cwd)\"\n+      required: false\n+    max_iterations:\n+      description: \"Max review-fix cycles before giving up (default: 5)\"\n+      required: false\n+\n+  procedure: |\n+    ## PR Review Loop\n+\n+    Automates the review → fix → re-review cycle until a PR is approved or\n+    max iterations are reached.\n+\n+    ### States\n+\n+    ```\n+    load-pr-context\n+        ↓\n+    reviewer-pass          ← iterates back here after each fix\n+        ↓ request_changes\n+    fixer-pass\n+        ↓ completed\n+    [back to reviewer-pass]\n+        ↓ approve\n+    done ✓\n+    ```\n+\n+    ### Tool preference\n+\n+    Use `gh` and `git` for all deterministic operations. Call an LLM step\n+    only when judgement is required (review quality, fix strategy).\n+\n+    ### Headless policy (no human in loop)\n+\n+    | Situation                  | Behavior                              |\n+    |----------------------------|---------------------------------------|\n+    | Clarification needed       | Agent proceeds with best judgement    |\n+    | Dangerous git op requested | Auto-deny; fixer continues without it |\n+    | Post review/fix to PR      | Auto-post when `auto_post = true`     |\n+\n+steps:\n+\n+  # ── Phase 1: context ────────────────────────────────────────────────────────\n+\n+  load-pr-context:\n+    step_id: \"load-pr-context\"\n+    type: \"task\"\n+    title: \"Fetch PR metadata and diff\"\n+    task_template:\n+      title: \"Load PR context for review loop\"\n+      description: |\n+        Collect all context needed by reviewer and fixer.\n+\n+        ## Tool steps (no LLM needed)\n+\n+        ```bash\n+        # PR metadata\n+        gh pr view {{repo}} --pr {{pr}} \\\n+          --json number,title,body,headRefName,baseRefName,headRefOid \\\n+          > /tmp/pr-meta.json\n+\n+        # Full diff (for reviewer prompt)\n+        gh pr diff {{repo}} --pr {{pr}} > /tmp/pr-diff.patch\n+\n+        # CI status\n+        gh pr checks {{repo}} --pr {{pr}} --json name,status,conclusion \\\n+          > /tmp/pr-checks.json\n+\n+        # External bot comments (Copilot, CodeRabbit, etc.)\n+        gh api repos/{{repo}}/pulls/{{pr}}/comments \\\n+          --paginate \\\n+          --jq '[.[] | select(.user.login | endswith(\"[bot]\"))]' \\\n+          > /tmp/pr-bot-comments.json\n+        ```\n+\n+        Save outputs to /tmp/pr-{meta,diff,checks,bot-comments}.json.\n+        These are the sole inputs to subsequent steps.\n+      requirements:\n+        tools: [\"gh\", \"git\"]\n+\n+  # ── Phase 2: reviewer pass ───────────────────────────────────────────────────\n+\n+  reviewer-pass:\n+    step_id: \"reviewer-pass\"\n+    type: \"task\"\n+    title: \"Reviewer agent: analyze diff and produce structured feedback\"\n+    depends_on: [\"load-pr-context\"]\n+    task_template:\n+      title: \"Run reviewer agent on PR diff\"\n+      description: |\n+        Read /tmp/pr-{meta,diff,bot-comments}.json.\n+        Produce structured review feedback.\n+\n+        ## Reviewer role\n+\n+        - Read-only: no git writes, no file edits\n+        - Allowed gh commands: `gh pr view`, `gh pr diff`, `gh pr checks`,\n+          `gh api --method GET`\n+        - Focus: correctness, security, perf, style, missing tests/docs\n+\n+        ## Output (JSON to stdout, save to /tmp/pr-review-N.json)\n+\n+        ```json\n+        {\n+          \"action\": \"approve|request_changes|comment\",\n+          \"summary\": \"<one paragraph>\",\n+          \"comments\": [\n+            {\n+              \"path\": \"src/foo.go\",\n+              \"line\": 42,\n+              \"body\": \"<specific feedback>\",\n+              \"severity\": \"critical|major|minor|suggestion\"\n+            }\n+          ],\n+          \"blocking_issues\": [\"<issue 1>\", \"<issue 2>\"]\n+        }\n+        ```\n+\n+        If `action == \"approve\"`: flow exits success.\n+        If `action == \"request_changes\"`: fixer-pass runs next.\n+        If `action == \"comment\"`: post comments; check blocking_issues to decide\n+        whether fixer-pass is needed.\n+\n+        ## Post review to PR\n+\n+        ```bash\n+        # Post inline comments via gh\n+        gh api repos/{{repo}}/pulls/{{pr}}/reviews \\\n+          --method POST \\\n+          --field body=\"$(jq -r .summary /tmp/pr-review-N.json)\" \\\n+          --field event=\"$(jq -r .action /tmp/pr-review-N.json | tr 'a-z' 'A-Z')\" \\\n+          --field \"comments=$(jq .comments /tmp/pr-review-N.json)\"\n+        ```\n+      requirements:\n+        capabilities: [\"code-review\", \"security-review\"]\n+        tools: [\"gh\", \"git\"]\n+\n+  check-approval:\n+    step_id: \"check-approval\"\n+    type: \"branch\"\n+    title: \"Check if PR is approved; route to done or fixer\"\n+    depends_on: [\"reviewer-pass\"]\n+    cases:\n+      - when: \"action == 'approve'\"\n+        next: \"done\"\n+      - when: \"action == 'request_changes'\"\n+        next: \"fixer-pass\"\n+    # default_next handles 'comment' action (blocking_issues present → fixer; none → done-equivalent)\n+    default_next: \"fixer-pass\"\n+    meta:\n+      guidance: |\n+        Read `action` from /tmp/pr-review-N.json.\n+        Valid values: approve | request_changes | comment.\n+        'comment' with blocking_issues → treat as request_changes (default_next).\n+\n+        Also check iteration count against max_iterations (default 5).\n+        If count >= max: surface warning and halt without merge.\n+\n+  # ── Phase 3: fixer pass ──────────────────────────────────────────────────────\n+\n+  fixer-pass:\n+    step_id: \"fixer-pass\"\n+    type: \"task\"\n+    title: \"Fixer agent: apply changes from review feedback\"\n+    task_template:\n+      title: \"Run fixer agent on review comments\"\n+      description: |\n+        Read /tmp/pr-review-N.json.\n+        Apply all blocking issues and major comments.\n+\n+        ## Fixer role\n+\n+        - File ops: Read, Edit, Write, Glob, Grep\n+        - Git (safe subset only): status, diff, add, commit, log, show,\n+          branch, switch, stash\n+        - Forbidden git ops: reset --hard, clean -fd, push --force, push\n+          (unless user explicitly grants)\n+        - gh: pr view, pr diff, pr checks, api GET only\n+\n+        ## Critical rules\n+\n+        - NEVER `git reset --hard` — destroys work\n+        - NEVER `git clean -fd` — deletes untracked files\n+        - Commit changes locally after each fix batch\n+        - If unclear: output `status: needs_clarification` + question\n+\n+        ## Output (JSON to stdout, save to /tmp/pr-fix-N.json)\n+\n+        ```json\n+        {\n+          \"status\": \"completed|needs_clarification|needs_permission|error\",\n+          \"summary\": \"<what was done>\",\n+          \"files_modified\": [\"src/foo.go\", \"src/bar.go\"],\n+          \"question\": \"<if needs_clarification>\",\n+          \"permission_request\": {\n+            \"action\": \"git push origin HEAD\",\n+            \"reason\": \"reviewer requires changes pushed before re-review\"\n+          }\n+        }\n+        ```\n+\n+        ## Commit pattern\n+\n+        ```bash\n+        git add <files>\n+        git commit -m \"fix: address review feedback (iteration N)\"\n+        ```\n+      requirements:\n+        capabilities: [\"code-modification\", \"refactoring\"]\n+        tools: [\"git\", \"gh\"]\n+\n+  handle-fixer-output:\n+    step_id: \"handle-fixer-output\"\n+    type: \"task\"\n+    title: \"Handle fixer output: clarification, permission, or re-review\"\n+    depends_on: [\"fixer-pass\"]\n+    task_template:\n+      title: \"Route fixer result to next action\"\n+      description: |\n+        ```bash\n+        STATUS=$(jq -r .status /tmp/pr-fix-N.json)\n+        ```\n+\n+        | status                | action                                       |\n+        |-----------------------|----------------------------------------------|\n+        | `completed`           | post fix summary to PR, loop → reviewer-pass |\n+        | `needs_clarification` | surface question; answer → fixer continues   |\n+        | `needs_permission`    | surface request; deny if dangerous git op    |\n+        | `error`               | halt, surface error                          |\n+\n+        ### Post fix summary to PR\n+\n+        ```bash\n+        SUMMARY=$(jq -r .summary /tmp/pr-fix-N.json)\n+        gh pr comment {{pr}} --repo {{repo}} --body \"$SUMMARY\"\n+        ```\n+\n+        ### Dangerous git op check (auto-deny)\n+\n+        ```bash\n+        ACTION=$(jq -r '.permission_request.action // \"\"' /tmp/pr-fix-N.json)\n+        SAFE_CMDS=\"status|diff|add|commit|log|show|branch|switch|stash\"\n+        if echo \"$ACTION\" | grep -qvE \"^git ($SAFE_CMDS)\"; then\n+          echo \"Auto-denied: $ACTION\"\n+          # fixer continues without the permission\n+        fi\n+        ```\n+\n+        When status == completed: increment iteration counter and loop back\n+        to reviewer-pass (up to max_iterations).\n+      requirements:\n+        tools: [\"jq\", \"gh\", \"bash\"]\n+\n+  # ── Phase 4: done ────────────────────────────────────────────────────────────\n+  # Note: the loop-back from handle-fixer-output → reviewer-pass cannot be\n+  # expressed as a DAG edge. The loop is driven by the agent following the\n+  # procedure instructions in handle-fixer-output until max_iterations is hit.\n+\n+  done:\n+    step_id: \"done\"\n+    type: \"task\"\n+    title: \"PR approved — emit final summary\"\n+    task_template:\n+      title: \"Emit final rally result\"\n+      description: |\n+        ```bash\n+        ITER=$(cat /tmp/pr-iteration-count.txt)\n+        SUMMARY=$(jq -r .summary /tmp/pr-review-N.json)\n+\n+        cat <<EOF\n+        {\n+          \"result\": \"Approved\",\n+          \"iterations\": $ITER,\n+          \"summary\": \"$SUMMARY\"\n+        }\n+        EOF\n+        ```\n+\n+        Exit code 0 = approved.\n+        Exit code 1 = not approved / max iterations / error.\n+      requirements:\n+        tools: [\"jq\", \"bash\"]\ndiff --git a/go.mod b/go.mod\nindex 8387fda..a5f7f41 100644\n--- a/go.mod\n+++ b/go.mod\n@@ -27,6 +27,7 @@ require (\n \thop.top/upgrade v0.0.0-20260323164843-b8379a5355f7\n \thop.top/uri v0.0.0\n \thop.top/uri/completions v0.0.0-20260315135125-fc061a7b6a61\n+\thop.top/xrr v0.0.0\n \tmodernc.org/sqlite v1.44.1\n )\n \n@@ -99,3 +100,5 @@ require (\n replace hop.top/uri v0.0.0 => hop.top/uri v0.0.0-20260315135125-fc061a7b6a61\n \n replace hop.top/hdl v0.0.0 => /Users/jadb/.w/ideacrafterslabs/hdl/hops/main\n+\n+replace hop.top/xrr v0.0.0 => /Users/jadb/.w/ideacrafterslabs/xrr/hops/main/go\ndiff --git a/go.sum b/go.sum\nindex 61c7b3f..9c9841e 100644\n--- a/go.sum\n+++ b/go.sum\n@@ -206,8 +206,6 @@ golang.org/x/sync v0.19.0 h1:vV+1eWNmZ5geRlYjzm2adRgW2/mcpevXNg50YZtPCE4=\n golang.org/x/sync v0.19.0/go.mod h1:9KTHXmSnoGruLpwFjVSX0lNNA75CykiMECbovNTZqGI=\n golang.org/x/sys v0.0.0-20210809222454-d867a43fc93e/go.mod h1:oPkhp1MJrh7nUepCBck5+mAzfO9JrbApNNgaTdGDITg=\n golang.org/x/sys v0.6.0/go.mod h1:oPkhp1MJrh7nUepCBck5+mAzfO9JrbApNNgaTdGDITg=\n-golang.org/x/sys v0.40.0 h1:DBZZqJ2Rkml6QMQsZywtnjnnGvHza6BTfYFWY9kjEWQ=\n-golang.org/x/sys v0.40.0/go.mod h1:OgkHotnGiDImocRcuBABYBEXf8A9a87e/uXjp9XT3ks=\n golang.org/x/sys v0.42.0 h1:omrd2nAlyT5ESRdCLYdm3+fMfNFE/+Rf4bDIQImRJeo=\n golang.org/x/sys v0.42.0/go.mod h1:4GL1E5IUh+htKOUEOaiffhrAeqysfVGipDYzABqnCmw=\n golang.org/x/term v0.39.0 h1:RclSuaJf32jOqZz74CkPA9qFuVTX7vhLlpfj/IGWlqY=\ndiff --git a/internal/cli/flow.go b/internal/cli/flow.go\nindex ad5927f..ff039a7 100644\n--- a/internal/cli/flow.go\n+++ b/internal/cli/flow.go\n@@ -87,7 +87,7 @@ Usage:\n \t\t}\n \n \t\t_, _ = fmt.Fprintf(cmd.OutOrStdout(), \"Starting flow: %s (ID: %s)\\n\", flow.Name, flow.ID)\n-\t\trun, err := executor.Execute(ctx, flow, by)\n+\t\trun, _, err := executor.Execute(ctx, flow, by)\n \t\tif err != nil {\n \t\t\treturn fmt.Errorf(\"flow execution failed: %w\", err)\n \t\t}\ndiff --git a/internal/cli/flow_test_cmd.go b/internal/cli/flow_test_cmd.go\nnew file mode 100644\nindex 0000000..9947e0a\n--- /dev/null\n+++ b/internal/cli/flow_test_cmd.go\n@@ -0,0 +1,290 @@\n+package cli\n+\n+import (\n+\t\"context\"\n+\t\"fmt\"\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\n+\t\"github.com/spf13/cobra\"\n+\t\"hop.top/tlc/internal/core\"\n+\t\"hop.top/tlc/internal/flowtest\"\n+\t\"hop.top/tlc/internal/uri\"\n+\txrr \"hop.top/xrr\"\n+)\n+\n+// ExitCodeError wraps a process exit code so callers can detect specific codes.\n+type ExitCodeError struct {\n+\tCode    int\n+\tMessage string\n+}\n+\n+func (e *ExitCodeError) Error() string { return e.Message }\n+\n+func init() {\n+\tFlowCmd.AddCommand(NewFlowTestCmd())\n+}\n+\n+// NewFlowTestCmd creates the `tlc flow test` subcommand.\n+func NewFlowTestCmd() *cobra.Command {\n+\tvar (\n+\t\trecord      bool\n+\t\tpassthrough []string\n+\t\tkeepSandbox bool\n+\t\tsteps       []string\n+\t)\n+\n+\tcmd := &cobra.Command{\n+\t\tUse:   \"test <flow-file> [run-name]\",\n+\t\tShort: \"Run deterministic e2e tests against a flow definition\",\n+\t\tLong: `Run a flow definition through a hermetic sandbox.\n+\n+In replay mode (default), each tool call is served from a recorded cassette.\n+In record mode (--record), tool calls are proxied to real binaries and cassettes\n+are written for future replay runs.\n+\n+Exit codes:\n+  0  All steps executed; all contracts passed\n+  1  Step failed or contract violated\n+  2  Cassette miss in replay mode\n+  3  Sandbox setup failure`,\n+\t\tArgs: cobra.RangeArgs(1, 2),\n+\t\tRunE: func(cmd *cobra.Command, args []string) error {\n+\t\t\tflowFile := args[0]\n+\t\t\trunName := \"\"\n+\t\t\tif len(args) == 2 {\n+\t\t\t\trunName = args[1]\n+\t\t\t}\n+\t\t\treturn runFlowTest(cmd, flowFile, runName, record, passthrough, keepSandbox, steps)\n+\t\t},\n+\t}\n+\n+\tcmd.Flags().BoolVar(&record, \"record\", false,\n+\t\t\"Run against real infra; write/update cassettes\")\n+\tcmd.Flags().StringArrayVar(&passthrough, \"passthrough\", nil,\n+\t\t\"Force live execution for named tools (repeatable or comma-separated)\")\n+\tcmd.Flags().BoolVar(&keepSandbox, \"keep-sandbox\", false,\n+\t\t\"Retain tmp dir after run (for debugging)\")\n+\tcmd.Flags().StringSliceVar(&steps, \"steps\", nil,\n+\t\t\"Run only the named steps (comma-separated)\")\n+\n+\treturn cmd\n+}\n+\n+func runFlowTest(\n+\tcmd *cobra.Command,\n+\tflowFile, runName string,\n+\trecord bool,\n+\tcliPassthrough []string,\n+\tkeepSandbox bool,\n+\t_ []string, // steps filter — reserved for future use\n+) error {\n+\t// Determine mode.\n+\tmode := xrr.ModeReplay\n+\tif record {\n+\t\tmode = xrr.ModeRecord\n+\t}\n+\n+\t// Flatten comma-separated passthrough values.\n+\tvar passthroughFlat []string\n+\tfor _, pt := range cliPassthrough {\n+\t\tfor _, s := range strings.Split(pt, \",\") {\n+\t\t\ts = strings.TrimSpace(s)\n+\t\t\tif s != \"\" {\n+\t\t\t\tpassthroughFlat = append(passthroughFlat, s)\n+\t\t\t}\n+\t\t}\n+\t}\n+\n+\t// Resolve flow file.\n+\ts, err := getStorage()\n+\tif err != nil {\n+\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: storage: %v\", err)}\n+\t}\n+\tdefer func() { _ = s.Close() }()\n+\n+\tctx := context.Background()\n+\tres, err := uri.NewResolver(s).ResolveFlow(ctx, flowFile)\n+\tif err != nil {\n+\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: resolve flow: %v\", err)}\n+\t}\n+\tflow := res.Flow\n+\n+\t// Derive flow name from file path for fixture lookup.\n+\t// DiscoverRuns resolves fixtures/<flowName>/ from flowBaseDir.\n+\t// Use abs path so cassette dirs passed via env to shims are absolute.\n+\tflowName := flowFileBaseName(flowFile)\n+\tflowBaseDir, err := filepath.Abs(filepath.Dir(flowFile))\n+\tif err != nil {\n+\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: abs path: %v\", err)}\n+\t}\n+\n+\t// Discover runs.\n+\tvar discoverOpts []flowtest.Option\n+\tif runName != \"\" {\n+\t\tdiscoverOpts = append(discoverOpts, flowtest.WithRunName(runName))\n+\t}\n+\truns, err := flowtest.DiscoverRuns(flowName, flowBaseDir, discoverOpts...)\n+\tif err != nil {\n+\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: discover runs: %v\", err)}\n+\t}\n+\n+\tif len(runs) == 0 {\n+\t\t_, _ = fmt.Fprintf(cmd.OutOrStdout(),\n+\t\t\t\"flow test: no runs found in %s/fixtures/%s\\n\", flowBaseDir, flowName)\n+\t\treturn nil\n+\t}\n+\n+\t// Run each discovered test run.\n+\toverallFail := false\n+\tfor _, run := range runs {\n+\t\texitCode, err := executeRun(ctx, cmd, flow, s, run, mode, passthroughFlat, keepSandbox)\n+\t\tif err != nil {\n+\t\t\t_, _ = fmt.Fprintf(cmd.ErrOrStderr(), \"  run %q: %v\\n\", run.Name, err)\n+\t\t}\n+\t\tif exitCode != 0 {\n+\t\t\toverallFail = true\n+\t\t}\n+\t}\n+\n+\tif overallFail {\n+\t\treturn &ExitCodeError{Code: 1, Message: \"flow test: one or more runs failed\"}\n+\t}\n+\treturn nil\n+}\n+\n+func executeRun(\n+\tctx context.Context,\n+\tcmd *cobra.Command,\n+\tflow *core.Flow,\n+\ts interface {\n+\t\tcore.Repository\n+\t\tcore.LogRepository\n+\t},\n+\trun flowtest.Run,\n+\tmode xrr.Mode,\n+\tcliPassthrough []string,\n+\tkeepSandbox bool,\n+) (int, error) {\n+\t_, _ = fmt.Fprintf(cmd.OutOrStdout(), \"\\nrun: %s\\n\", run.Name)\n+\n+\t// Merge CLI passthrough with manifest passthrough.\n+\tmergedPassthrough := flowtest.MergePassthrough(cliPassthrough, run.Passthrough)\n+\n+\t// Create sandbox.\n+\tcwd, err := os.Getwd()\n+\tif err != nil {\n+\t\treturn 3, fmt.Errorf(\"getwd: %w\", err)\n+\t}\n+\tsb, err := flowtest.NewSandbox(cwd)\n+\tif err != nil {\n+\t\treturn 3, fmt.Errorf(\"sandbox: %w\", err)\n+\t}\n+\tsb.Keep = keepSandbox\n+\tdefer sb.Teardown()\n+\n+\t// Extract shim binaries.\n+
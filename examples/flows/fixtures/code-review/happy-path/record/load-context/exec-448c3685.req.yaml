os.MkdirAll(cassetteDir, 0o755); err != nil {\n+\t\t\treturn nil, fmt.Errorf(\"sandbox agent runner: mkdir cassette dir: %w\", err)\n+\t\t}\n+\t}\n+\n+\tenv := r.sandbox.Env(step.ID, r.mode, r.run)\n+\n+\t// Find the real claude by skipping the sandbox BinDir — the outer agent\n+\t// process must not go through its own shim (that would recurse and fail).\n+\tclaudePath, err := findRealAgent(env, r.sandbox.BinDir, \"claude\")\n+\tif err != nil {\n+\t\treturn nil, fmt.Errorf(\"sandbox agent runner: %w\", err)\n+\t}\n+\n+\tcmd := exec.CommandContext(ctx, claudePath, \"-p\", prompt,\n+\t\t\"--print\", \"--output-format\", \"json\", \"--dangerously-skip-permissions\")\n+\tcmd.Dir = r.sandbox.RepoDir\n+\t// Point CLAUDE_CONFIG_DIR at the real ~/.claude so auth/keychain are found.\n+\t// The sandbox HOME is kept for git/gh isolation.\n+\tagentEnv := replaceEnvVar(env, \"CLAUDE_CONFIG_DIR\", r.realClaudeDir)\n+\tcmd.Env = agentEnv\n+\t// Explicit empty stdin so claude doesn't wait 3s for piped input.\n+\tcmd.Stdin = strings.NewReader(\"\")\n+\n+\tcombined, err := cmd.CombinedOutput()\n+\tif err != nil {\n+\t\tif exitErr, ok := err.(*exec.ExitError); ok {\n+\t\t\treturn nil, fmt.Errorf(\"sandbox agent runner: step %q: claude exited %d: %s\",\n+\t\t\t\tstep.ID, exitErr.ExitCode(), string(combined))\n+\t\t}\n+\t\treturn nil, fmt.Errorf(\"sandbox agent runner: step %q: %w\", step.ID, err)\n+\t}\n+\tstdout := combined\n+\n+\t// --output-format json returns {\"type\":\"result\",\"subtype\":\"success\",\"result\":\"...\",\"...\"}\n+\t// Pass the full parsed object as step output; fallback to raw wrap on parse error.\n+\tvar result map[string]any\n+\tif jsonErr := json.Unmarshal(stdout, &result); jsonErr != nil {\n+\t\tresult = map[string]any{\"output\": string(stdout)}\n+\t}\n+\treturn result, nil\n+}\n+\n+// replaceEnvVar returns env with the value of key replaced by val.\n+// If key is not present, it appends \"key=val\".\n+func replaceEnvVar(env []string, key, val string) []string {\n+\tprefix := key + \"=\"\n+\tout := make([]string, 0, len(env))\n+\tfound := false\n+\tfor _, kv := range env {\n+\t\tif len(kv) >= len(prefix) && kv[:len(prefix)] == prefix {\n+\t\t\tout = append(out, prefix+val)\n+\t\t\tfound = true\n+\t\t} else {\n+\t\t\tout = append(out, kv)\n+\t\t}\n+\t}\n+\tif !found {\n+\t\tout = append(out, prefix+val)\n+\t}\n+\treturn out\n+}\n+\n+// findRealAgent returns the path of the real agent binary (e.g. \"claude\") by\n+// scanning the PATH entries in env and skipping shimDir. This prevents the\n+// runner from dispatching through its own shim.\n+func findRealAgent(env []string, shimDir, name string) (string, error) {\n+\tpathVal := \"\"\n+\tfor _, kv := range env {\n+\t\tif len(kv) > 5 && kv[:5] == \"PATH=\" {\n+\t\t\tpathVal = kv[5:]\n+\t\t\tbreak\n+\t\t}\n+\t}\n+\tfor _, dir := range filepath.SplitList(pathVal) {\n+\t\tif dir == shimDir {\n+\t\t\tcontinue\n+\t\t}\n+\t\tp := filepath.Join(dir, name)\n+\t\tif info, err := os.Stat(p); err == nil && info.Mode()&0o111 != 0 {\n+\t\t\treturn p, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"real %q not found in PATH (shimDir=%s excluded)\", name, shimDir)\n+}\ndiff --git a/internal/flowtest/embed.go b/internal/flowtest/embed.go\nnew file mode 100644\nindex 0000000..20ebe19\n--- /dev/null\n+++ b/internal/flowtest/embed.go\n@@ -0,0 +1,66 @@\n+package flowtest\n+\n+import (\n+\t\"embed\"\n+\t\"fmt\"\n+\t\"io/fs\"\n+\t\"os\"\n+\t\"path/filepath\"\n+)\n+\n+//go:embed shims/bin/*\n+var shimsFS embed.FS\n+\n+// passthroughAlways are tools that always exec the real binary without cassettes.\n+// Symlinked to tlc-shim-passthrough (if present) or tlc-shim-catchall.\n+var passthroughAlways = []string{\n+\t\"node\", \"vite\", \"next\",\n+\t\"ls\", \"cat\", \"head\", \"tail\", \"wc\", \"grep\", \"pwd\",\n+\t\"cp\", \"mkdir\", \"chmod\", \"ps\", \"lsof\", \"sleep\",\n+}\n+\n+// ExtractShims extracts embedded shim binaries into s.BinDir and creates\n+// passthrough-always and catch-all symlinks for tools not explicitly embedded.\n+func (s *Sandbox) ExtractShims() error {\n+\tentries, err := fs.ReadDir(shimsFS, \"shims/bin\")\n+\tif err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: read embedded shims: %w\", err)\n+\t}\n+\n+\tfor _, entry := range entries {\n+\t\tif entry.IsDir() || entry.Name() == \".gitkeep\" {\n+\t\t\tcontinue\n+\t\t}\n+\t\tdata, err := shimsFS.ReadFile(\"shims/bin/\" + entry.Name())\n+\t\tif err != nil {\n+\t\t\treturn fmt.Errorf(\"flowtest: read shim %s: %w\", entry.Name(), err)\n+\t\t}\n+\t\tdst := filepath.Join(s.BinDir, entry.Name())\n+\t\tif err := os.WriteFile(dst, data, 0o755); err != nil {\n+\t\t\treturn fmt.Errorf(\"flowtest: write shim %s: %w\", entry.Name(), err)\n+\t\t}\n+\t}\n+\n+\t// Determine the passthrough-always target binary.\n+\t// Prefer tlc-shim-passthrough (dedicated passthrough); fall back to\n+\t// tlc-shim-catchall (which also handles passthrough via env override).\n+\tpassthroughBin := filepath.Join(s.BinDir, \"tlc-shim-passthrough\")\n+\tif _, err := os.Stat(passthroughBin); os.IsNotExist(err) {\n+\t\tpassthroughBin = filepath.Join(s.BinDir, \"tlc-shim-catchall\")\n+\t}\n+\tif _, err := os.Stat(passthroughBin); os.IsNotExist(err) {\n+\t\t// Neither binary embedded yet — skip passthrough symlinks.\n+\t\treturn nil\n+\t}\n+\n+\tfor _, name := range passthroughAlways {\n+\t\tdst := filepath.Join(s.BinDir, name)\n+\t\tif _, err := os.Lstat(dst); os.IsNotExist(err) {\n+\t\t\tif err := os.Symlink(passthroughBin, dst); err != nil {\n+\t\t\t\treturn fmt.Errorf(\"flowtest: symlink %s → passthrough: %w\", name, err)\n+\t\t\t}\n+\t\t}\n+\t}\n+\n+\treturn nil\n+}\ndiff --git a/internal/flowtest/flows_test.go b/internal/flowtest/flows_test.go\nnew file mode 100644\nindex 0000000..2e74af3\n--- /dev/null\n+++ b/internal/flowtest/flows_test.go\n@@ -0,0 +1,80 @@\n+//go:build !shimbin\n+\n+package flowtest_test\n+\n+import (\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\t\"testing\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\n+\t\"hop.top/tlc/internal/core\"\n+\t\"hop.top/tlc/internal/flowtest\"\n+)\n+\n+// flowsDir is the canonical location of all example flow definitions.\n+const flowsDir = \"../../examples/flows\"\n+\n+// allFlows returns all YAML flow files under flowsDir.\n+func allFlows(t *testing.T) []string {\n+\tt.Helper()\n+\tentries, err := os.ReadDir(flowsDir)\n+\trequire.NoError(t, err, \"read flows dir\")\n+\n+\tvar flows []string\n+\tfor _, e := range entries {\n+\t\tif e.IsDir() || !strings.HasSuffix(e.Name(), \".yaml\") {\n+\t\t\tcontinue\n+\t\t}\n+\t\tflows = append(flows, filepath.Join(flowsDir, e.Name()))\n+\t}\n+\trequire.NotEmpty(t, flows, \"no flow files found in %s\", flowsDir)\n+\treturn flows\n+}\n+\n+// TestAllFlowsParse verifies every flow YAML parses without error.\n+func TestAllFlowsParse(t *testing.T) {\n+\tfor _, path := range allFlows(t) {\n+\t\tpath := path\n+\t\tname := strings.TrimSuffix(filepath.Base(path), \".yaml\")\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tt.Parallel()\n+\t\t\tf, err := os.Open(path)\n+\t\t\trequire.NoError(t, err)\n+\t\t\tdefer f.Close() //nolint:errcheck\n+\n+\t\t\tflow, err := core.ParseFlow(f, path)\n+\t\t\trequire.NoError(t, err, \"ParseFlow failed\")\n+\n+\t\t\tassert.NotEmpty(t, flow.ID, \"flow_id must be set\")\n+\t\t\tassert.NotEmpty(t, flow.EntryStep, \"entry_step must be set\")\n+\t\t\tassert.NotEmpty(t, flow.Steps, \"steps must not be empty\")\n+\n+\t\t\t// entry_step must exist in steps map\n+\t\t\t_, ok := flow.Steps[flow.EntryStep]\n+\t\t\tassert.True(t, ok, \"entry_step %q not found in steps\", flow.EntryStep)\n+\t\t})\n+\t}\n+}\n+\n+// TestAllFlowsHaveHappyPathFixture verifies each flow has a happy-path run scaffold.\n+// This fails until fixtures are created — driving fixture creation via TDD.\n+func TestAllFlowsHaveHappyPathFixture(t *testing.T) {\n+\tfor _, path := range allFlows(t) {\n+\t\tpath := path\n+\t\tname := strings.TrimSuffix(filepath.Base(path), \".yaml\")\n+\t\tt.Run(name, func(t *testing.T) {\n+\t\t\tt.Parallel()\n+\t\t\tflowBaseDir := filepath.Dir(path)\n+\n+\t\t\truns, err := flowtest.DiscoverRuns(name, flowBaseDir, flowtest.WithRunName(\"happy-path\"))\n+\t\t\trequire.NoError(t, err, \"DiscoverRuns should find happy-path for %s\", name)\n+\t\t\trequire.Len(t, runs, 1)\n+\t\t\tassert.Equal(t, \"happy-path\", runs[0].Name)\n+\t\t\tassert.Equal(t, 0, runs[0].ExpectedExit)\n+\t\t})\n+\t}\n+}\ndiff --git a/internal/flowtest/hook.go b/internal/flowtest/hook.go\nnew file mode 100644\nindex 0000000..004d7e7\n--- /dev/null\n+++ b/internal/flowtest/hook.go\n@@ -0,0 +1,158 @@\n+package flowtest\n+\n+import (\n+\t\"bytes\"\n+\t\"context\"\n+\t\"encoding/json\"\n+\t\"fmt\"\n+\t\"io\"\n+\t\"net/http\"\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\n+\t\"gopkg.in/yaml.v3\"\n+)\n+\n+// ContractError is returned when an eva contract rejects a step's output.\n+type ContractError struct {\n+\tStepID  string\n+\tRule    string\n+\tMessage string\n+}\n+\n+func (e *ContractError) Error() string {\n+\tif e.Rule != \"\" {\n+\t\treturn fmt.Sprintf(\"flowtest: step %q: contract rule %q failed: %s\", e.StepID, e.Rule, e.Message)\n+\t}\n+\treturn fmt.Sprintf(\"flowtest: step %q: contract failed: %s\", e.StepID, e.Message)\n+}\n+\n+// contractFile is the parsed representation of a <stepID>.yaml contract file.\n+// The contract field is the named contract registered at the EVA gateway.\n+type contractFile struct {\n+\tContract string `yaml:\"contract\"` // EVA contract name\n+}\n+\n+// Hook runs an optional eva contract after a step completes.\n+// Contract evaluation requires the EVA gateway — configured via EVA_URL env var.\n+// When EVA_URL is not set, the hook passes silently (contracts are not evaluated).\n+type Hook struct {\n+\tcontractsDir string\n+\tevaURL       string // override for tests; defaults to os.Getenv(\"EVA_URL\")\n+\tevaKey       string // override for tests; defaults to os.Getenv(\"EVA_KEY\")\n+}\n+\n+// NewHook creates a Hook that looks for contracts in contractsDir.\n+func NewHook(contractsDir string) *Hook {\n+\treturn &Hook{\n+\t\tcontractsDir: contractsDir,\n+\t\tevaURL:       os.Getenv(\"EVA_URL\"),\n+\t\tevaKey:       os.Getenv(\"EVA_KEY\"),\n+\t}\n+}\n+\n+// WithEvaURL sets the EVA gateway URL (overrides EVA_URL env var). Used in tests.\n+func (h *Hook) WithEvaURL(url string) *Hook {\n+\th.evaURL = url\n+\treturn h\n+}\n+\n+// Run looks for <contractsDir>/<stepID>.yaml. If present and EVA_URL is set,\n+// it invokes POST {EVA_URL}/v1/contract/invoke with the step output.\n+//\n+//   - No contract file → nil (silent pass).\n+//   - EVA_URL not set → nil (silent pass; contract validation skipped).\n+//   - EVA 200 → nil.\n+//   - EVA 422 (contract_violation) → ContractError.\n+//   - Other EVA errors → wrapped error.\n+func (h *Hook) Run(stepID string, output map[string]any) error {\n+\tcontractPath := filepath.Join(h.contractsDir, stepID+\".yaml\")\n+\tif _, err := os.Stat(contractPath); os.IsNotExist(err) {\n+\t\treturn nil // no contract → silent pass\n+\t} else if err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: stat contract %s: %w\", contractPath, err)\n+\t}\n+\n+\tif h.evaURL == \"\" {\n+\t\t// EVA gateway not configured — skip contract evaluation silently.\n+\t\treturn nil\n+\t}\n+\n+\t// Read contract file to get the contract name.\n+\tdata, err := os.ReadFile(contractPath)\n+\tif err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: read contract %s: %w\", contractPath, err)\n+\t}\n+\tvar cf contractFile\n+\tif err := yaml.Unmarshal(data, &cf); err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: parse contract %s: %w\", contractPath, err)\n+\t}\n+\tcontractName := cf.Contract\n+\tif contractName == \"\" {\n+\t\t// Fall back to step ID as contract name.\n+\t\tcontractName = stepID\n+\t}\n+\n+\treturn h.invokeEvaGate(stepID, contractName, output)\n+}\n+\n+// invokeEvaGate calls POST {evaURL}/v1/contract/invoke.\n+func (h *Hook) invokeEvaGate(stepID, contractName string, output map[string]any) error {\n+\tpayload := map[string]any{\n+\t\t\"contract\": contractName,\n+\t\t\"body\":     output,\n+\t}\n+\traw, err := json.Marshal(payload)\n+\tif err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: marshal payload: %w\", err)\n+\t}\n+\n+\turl := strings.TrimRight(h.evaURL, \"/\") + \"/v1/contract/invoke\"\n+\treq, err := http.NewRequestWithContext(context.Background(), http.MethodPost, url, bytes.NewReader(raw))\n+\tif err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: build request: %w\", err)\n+\t}\n+\treq.Header.Set(\"Content-Type\", \"application/json\")\n+\tif h.evaKey != \"\" {\n+\t\treq.Header.Set(\"X-Eva-Key\", h.evaKey)\n+\t}\n+\n+\tresp, err := http.DefaultClient.Do(req)\n+\tif err != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: eva request failed: %w\", err)\n+\t}\n+\tdefer resp.Body.Close() //nolint:errcheck\n+\n+\tbody, _ := io.ReadAll(resp.Body)\n+\n+\tif resp.StatusCode == http.StatusOK {\n+\t\treturn nil\n+\t}\n+\n+\t// Parse violation response.\n+\tvar evaResp struct {\n+\t\tEvaStatus  string `json:\"eva_status\"`\n+\t\tViolations []struct {\n+\t\t\tEvaluator string  `json:\"evaluator\"`\n+\t\t\tReason    *string `json:\"reason,omitempty\"`\n+\t\t} `json:\"violations,omitempty\"`\n+\t}\n+\tif jerr := json.Unmarshal(body, &evaResp); jerr != nil {\n+\t\treturn fmt.Errorf(\"flowtest: hook: unexpected eva status %d\", resp.StatusCode)\n+\t}\n+\n+\tif evaResp.EvaStatus == \"contract_violation\" && len(evaResp.Violations) > 0 {\n+\t\tv := evaResp.Violations[0]\n+\t\tmsg := v.Evaluator\n+\t\tif v.Reason != nil && *v.Reason != \"\" {\n+\t\t\tmsg += \": \" + *v.Reason\n+\t\t}\n+\t\treturn &ContractError{StepID: stepID, Rule: v.Evaluator, Message: msg}\n+\t}\n+\n+\treturn &ContractError{\n+\t\tStepID:  stepID,\n+\t\tMessage: fmt.Sprintf(\"eva status %q (http %d)\", evaResp.EvaStatus, resp.StatusCode),\n+\t}\n+}\ndiff --git a/internal/flowtest/hook_test.go b/internal/flowtest/hook_test.go\nnew file mode 100644\nindex 0000000..adec988\n--- /dev/null\n+++ b/internal/flowtest/hook_test.go\n@@ -0,0 +1,85 @@\n+package flowtest_test\n+\n+import (\n+\t\"encoding/json\"\n+\t\"net/http\"\n+\t\"net/http/httptest\"\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"testing\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\n+\t\"hop.top/tlc/internal/flowtest\"\n+)\n+\n+func TestHookNoContract(t *testing.T) {\n+\th := flowtest.NewHook(t.TempDir()) // empty contracts dir\n+\terr := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+\tassert.NoError(t, err, \"no contract → silent pass\")\n+}\n+\n+func TestHookMissingContractsDir(t *testing.T) {\n+\th := flowtest.NewHook(\"/nonexistent/contracts\")\n+\terr := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+\tassert.NoError(t, err, \"missing dir → silent pass (no contract file)\")\n+}\n+\n+func TestHookNoEVAURL(t *testing.T) {\n+\t// Contract exists but EVA_URL is not set → skip evaluation, return nil.\n+\tdir := t.TempDir()\n+\trequire.NoError(t, os.WriteFile(filepath.Join(dir, \"step-foo.yaml\"),\n+\t\t[]byte(\"contract: my-contract\\n\"), 0o644))\n+\n+\tt.Setenv(\"EVA_URL\", \"\") // ensure not set\n+\th := flowtest.NewHook(dir)\n+\terr := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+\tassert.NoError(t, err, \"no EVA_URL → silent pass\")\n+}\n+\n+func TestHookContractPass(t *testing.T) {\n+\t// Start a mock EVA gateway that returns 200 pass.\n+\tsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n+\t\tassert.Equal(t, \"/v1/contract/invoke\", r.URL.Path)\n+\t\tw.WriteHeader(http.StatusOK)\n+\t\t_, _ = w.Write([]byte(`{\"eva_status\":\"pass\",\"attempts\":1}`))\n+\t}))\n+\tt.Cleanup(srv.Close)\n+\n+\tdir := t.TempDir()\n+\trequire.NoError(t, os.WriteFile(filepath.Join(dir, \"step-foo.yaml\"),\n+\t\t[]byte(\"contract: step-foo\\n\"), 0o644))\n+\n+\th := flowtest.NewHook(dir).WithEvaURL(srv.URL)\n+\terr := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+\tassert.NoError(t, err)\n+}\n+\n+func TestHookContractFail(t *testing.T) {\n+\treason := \"output.missing_field must not be null\"\n+\t// Start a mock EVA gateway that returns 422 violation.\n+\tsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n+\t\tw.WriteHeader(http.StatusUnprocessableEntity)\n+\t\tresp := map[string]any{\n+\t\t\t\"eva_status\": \"contract_violation\",\n+\t\t\t\"violations\": []map[string]any{\n+\t\t\t\t{\"evaluator\": \"must_have_field\", \"reason\": reason},\n+\t\t\t},\n+\t\t}\n+\t\t_ = json.NewEncoder(w).Encode(resp)\n+\t}))\n+\tt.Cleanup(srv.Close)\n+\n+\tdir := t.TempDir()\n+\trequire.NoError(t, os.WriteFile(filepath.Join(dir, \"step-foo.yaml\"),\n+\t\t[]byte(\"contract: step-foo\\n\"), 0o644))\n+\n+\th := flowtest.NewHook(dir).WithEvaURL(srv.URL)\n+\terr := h.Run(\"step-foo\", map[string]any{\"result\": \"ok\"})\n+\n+\tvar ce *flowtest.ContractError\n+\trequire.ErrorAs(t, err, &ce)\n+\tassert.Equal(t, \"step-foo\", ce.StepID)\n+\tassert.Equal(t, \"must_have_field\", ce.Rule)\n+}\ndiff --git a/internal/flowtest/run.go b/internal/flowtest/run.go\nnew file mode 100644\nindex 0000000..da3ff29\n--- /dev/null\n+++ b/internal/flowtest/run.go\n@@ -0,0 +1,127 @@\n+// Package flowtest provides deterministic e2e testing for tlc flow definitions.\n+package flowtest\n+\n+import (\n+\t\"fmt\"\n+\t\"os\"\n+\t\"path/filepath\"\n+\n+\t\"gopkg.in/yaml.v3\"\n+)\n+\n+// RunManifest is the optional test.yaml manifest inside a run directory.\n+type RunManifest struct {\n+\tName         string   `yaml:\"name,omitempty\"`\n+\tDescription  string   `yaml:\"description,omitempty\"`\n+\tExpectedExit int      `yaml:\"expected_exit\"`\n+\tPassthrough  []string `yaml:\"passthrough,omitempty\"`\n+}\n+\n+// Run describes one named test run for a flow.\n+type Run struct {\n+\tName         string\n+\tDir          string   // path to run dir\n+\tRecordDir    string   // path to record/ subdir → xrr.NewFileCassette\n+\tContractsDir string   // path to contracts/ subdir\n+\tExpectedExit int\n+\tPassthrough  []string\n+}\n+\n+// options holds optional parameters for DiscoverRuns.\n+type options struct {\n+\trunName string\n+}\n+\n+// Option configures DiscoverRuns.\n+type Option func(*options)\n+\n+// WithRunName filters to a single named run.\n+func WithRunName(name string) Option {\n+\treturn func(o *options) { o.runName = name }\n+}\n+\n+// DiscoverRuns finds all named runs for flowName in baseDir.\n+//\n+// baseDir is the parent of the fixtures/<flowName>/ directory (typically the\n+// flow file's directory or the project root). The fixtures directory is\n+// resolved as baseDir/fixtures/<flowName>/. Each subdirectory of that\n+// fixtures dir is a named run. A test.yaml manifest inside the run dir can\n+// override defaults. If WithRunName is set, only that run is returned.\n+func DiscoverRuns(flowName, baseDir string, opts ...Option) ([]Run, error) {\n+\to := &options{}\n+\tfor _, fn := range opts {\n+\t\tfn(o)\n+\t}\n+\n+\tfixturesDir := filepath.Join(baseDir, \"fixtures\", flowName)\n+\tentries, err := os.ReadDir(fixturesDir)\n+\tif err != nil {\n+\t\tif os.IsNotExist(err) {\n+\t\t\treturn nil, fmt.Errorf(\n+\t\t\t\t\"flowtest: fixtures dir not found for %q: %s\", flowName, fixturesDir)\n+\t\t}\n+\t\treturn nil, fmt.Errorf(\"flowtest: DiscoverRuns %q: %w\", fixturesDir, err)\n+\t}\n+\n+\tvar runs []Run\n+\tfor _, entry := range entries {\n+\t\tif !entry.IsDir() {\n+\t\t\tcontinue\n+\t\t}\n+\t\tdirName := entry.Name()\n+\t\tif o.runName != \"\" && dirName != o.runName {\n+\t\t\tcontinue\n+\t\t}\n+\n+\t\trunDir := filepath.Join(fixturesDir, dirName)\n+\t\trun, err := loadRun(flowName, runDir, dirName)\n+\t\tif err != nil {\n+\t\t\treturn nil, err\n+\t\t}\n+\t\truns = append(runs, run)\n+\t}\n+\n+\tif o.runName != \"\" && len(runs) == 0 {\n+\t\treturn nil, fmt.Errorf(\"flowtest: run %q not found in %s\", o.runName, fixturesDir)\n+\t}\n+\n+\treturn runs, nil\n+}\n+\n+// loadRun constructs a Run from a run directory, optionally reading test.yaml.\n+func loadRun(flowName, runDir, dirName string) (Run, error) {\n+\trun := Run{\n+\t\tName:         dirName,\n+\t\tDir:          runDir,\n+\t\tRecordDir:    filepath.Join(runDir, \"record\"),\n+\t\tContractsDir: filepath.Join(runDir, \"contracts\"),\n+\t}\n+\n+\tmanifestPath := filepath.Join(runDir, \"test.yaml\")\n+\tdata, err := os.ReadFile(manifestPath)\n+\tif err == nil {\n+\t\tvar m RunManifest\n+\t\tif err := yaml.Unmarshal(data, &m); err != nil {\n+\t\t\treturn Run{}, fmt.Errorf(\"flowtest: parse manifest %s: %w\", manifestPath, err)\n+\t\t}\n+\t\tif m.Name != \"\" {\n+\t\t\trun.Name = m.Name\n+\t\t}\n+\t\trun.ExpectedExit = m.ExpectedExit\n+\t\trun.Passthrough = m.Passthrough\n+\t} else if !os.IsNotExist(err) {\n+\t\treturn Run{}, fmt.Errorf(\"flowtest: read manifest %s: %w\", manifestPath, err)\n+\t}\n+\n+\t_ = flowName // reserved for future manifest validation\n+\treturn run, nil\n+}\n+\n+// MergePassthrough merges CLI passthrough list with manifest passthrough list.\n+// CLI flags take precedence: if cliPassthrough is non-empty, it wins entirely.\n+func MergePassthrough(cliPassthrough, manifestPassthrough []string) []string {\n+\tif len(cliPassthrough) > 0 {\n+\t\treturn cliPassthrough\n+\t}\n+\treturn manifestPassthrough\n+}\ndiff --git a/internal/flowtest/run_test.go b/internal/flowtest/run_test.go\nnew file mode 100644\nindex 0000000..8ec5f99\n--- /dev/null\n+++ b/internal/flowtest/run_test.go\n@@ -0,0 +1,87 @@\n+package flowtest_test\n+\n+import (\n+\t\"os\"\n+\t\"path/filepath\"\n+\t\"testing\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\n+\t\"hop.top/tlc/internal/flowtest\"\n+)\n+\n+// makeFixturesRoot creates a run dir at <root>/fixtures/<flowName>/<runName>/\n+// and optionally writes a test.yaml manifest. Returns the project root (to\n+// pass as baseDir to DiscoverRuns).\n+func makeFixturesRoot(t *testing.T, flowName, runName string, manifest []byte) string {\n+\tt.Helper()\n+\troot := t.TempDir()\n+\trunDir := filepath.Join(root, \"fixtures\", flowName, runName)\n+\trequire.NoError(t, os.MkdirAll(filepath.Join(runDir, \"record\"), 0o755))\n+\trequire.NoError(t, os.MkdirAll(filepath.Join(runDir, \"contracts\"), 0o755))\n+\tif manifest != nil {\n+\t\trequire.NoError(t, os.WriteFile(filepath.Join(runDir, \"test.yaml\"), manifest, 0o644))\n+\t}\n+\treturn root\n+}\n+\n+func TestRunResolutionByDirName(t *testing.T) {\n+\troot := makeFixturesRoot(t, \"pr-review-loop\", \"happy-path\", nil)\n+\truns, err := flowtest.DiscoverRuns(\"pr-review-loop\", root)\n+\trequire.NoError(t, err)\n+\trequire.Len(t, runs, 1)\n+\tassert.Equal(t, \"happy-path\", runs[0].Name)\n+\tassert.Equal(t, 0, runs[0].ExpectedExit)\n+\tassert.Empty(t, runs[0].Passthrough)\n+}\n+\n+func TestRunResolutionWithManifest(t *testing.T) {\n+\tmanifest := []byte(`\n+expected_exit: 1\n+passthrough:\n+  - docker\n+description: hits max_iterations cap\n+`)\n+\troot := makeFixturesRoot(t, \"pr-review-loop\", \"max-iterations\", manifest)\n+\truns, err := flowtest.DiscoverRuns(\"pr-review-loop\", root)\n+\trequire.NoError(t, err)\n+\trequire.Len(t, runs, 1)\n+\tassert.Equal(t, 1, runs[0].ExpectedExit)\n+\tassert.Equal(t, []string{\"docker\"}, runs[0].Passthrough)\n+}\n+\n+func TestRunResolutionSingleNamed(t *testing.T) {\n+\troot := t.TempDir()\n+\tfor _, name := range []string{\"happy-path\", \"edge-case\"} {\n+\t\trunDir := filepath.Join(root, \"fixtures\", \"pr-review-loop\", name)\n+\t\trequire.NoError(t, os.MkdirAll(filepath.Join(runDir, \"record\"), 0o755))\n+\t}\n+\n+\truns, err := flowtest.DiscoverRuns(\"pr-review-loop\", root, flowtest.WithRunName(\"happy-path\"))\n+\trequire.NoError(t, err)\n+\trequire.Len(t, runs, 1)\n+\tassert.Equal(t, \"happy-path\", runs[0].Name)\n+}\n+\n+func TestRunResolutionNotFound(t *testing.T) {\n+\troot := t.TempDir()\n+\tfixturesDir := filepath.Join(root, \"fixtures\", \"pr-review-loop\", \"some-run\")\n+\trequire.NoError(t, os.MkdirAll(fixturesDir, 0o755))\n+\t_, err := flowtest.DiscoverRuns(\"pr-review-loop\", root, flowtest.WithRunName(\"missing\"))\n+\trequire.Error(t, err)\n+}\n+\n+func TestMergePassthrough(t *testing.T) {\n+\t// CLI wins when non-empty\n+\tgot := flowtest.MergePassthrough([]string{\"wrangler\"}, []string{\"docker\"})\n+\tassert.Equal(t, []string{\"wrangler\"}, got)\n+\n+\t// manifest used when CLI empty\n+\tgot = flowtest.MergePassthrough(nil, []string{\"docker\"})\n+\tassert.Equal(t, []string{\"docker\"}, got)\n+\n+\t// both empty\n+\tgot = flowtest.MergePassthrough(nil, nil)\n+\tassert.Nil(t, got)\n+}\ndiff --git a/internal/flowtest/sandbox.go b/internal/flowtest/sandbox.go\nnew file mode 100644\nindex 0000000..7b0cf54\n--- /dev/null\n+++ b/internal/flowtest/sandbox.go\n@@ -0,0 +1,121 @@\n+package flowtest\n+\n+import (\n+\t\"fmt\"\n+\t\"os\"\n+\t\"os/exec\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\n+\txrr \"hop.top/xrr\"\n+)\n+\n+// Sandbox is a hermetic test environment for one flow test run.\n+type Sandbox struct {\n+\tRootDir string\n+\tRepoDir string\n+\tBinDir  string\n+\tHomeDir string\n+\tKeep    bool\n+}\n+\n+// NewSandbox creates tmp/tlc-flow-test-<uuid>/{repo,bin,home} and\n+// git clone --local <cwd> into repo/.\n+func NewSandbox(cwd string) (*Sandbox, error) {\n+\troot, err := os.MkdirTemp(\"\", \"tlc-flow-test-*\")\n+\tif err != nil {\n+\t\treturn nil, fmt.Errorf(\"flowtest: create sandbox root: %w\", err)\n+\t}\n+\n+\tsb := &Sandbox{\n+\t\tRootDir: root,\n+\t\tRepoDir: filepath.Join(root, \"repo\"),\n+\t\tBinDir:  filepath.Join(root, \"bin\"),\n+\t\tHomeDir: filepath.Join(root, \"home\"),\n+\t}\n+\n+\tfor _, dir := range []string{sb.RepoDir, sb.BinDir, sb.HomeDir} {\n+\t\tif err := os.MkdirAll(dir, 0o755); err != nil {\n+\t\t\t_ = os.RemoveAll(root)\n+\t\t\treturn nil, fmt.Errorf(\"flowtest: create sandbox dir %s: %w\", dir, err)\n+\t\t}\n+\t}\n+\n+\t// git clone --local <cwd> into repo/\n+\tcloneCmd := exec.Command(\"git\", \"clone\", \"--local\", cwd, sb.RepoDir)\n+\tcloneCmd.Stdout = os.Stderr\n+\tcloneCmd.Stderr = os.Stderr\n+\tif err := cloneCmd.Run(); err != nil {\n+\t\t_ = os.RemoveAll(root)\n+\t\treturn nil, fmt.Errorf(\"flowtest: git clone sandbox repo: %w\", err)\n+\t}\n+\n+\treturn sb, nil\n+}\n+\n+// Env returns the os.Environ()-style slice to inject into each step subprocess.\n+func (s *Sandbox) Env(stepID string, mode xrr.Mode, run *Run) []string {\n+\tpassthrough := \"\"\n+\tif run != nil && len(run.Passthrough) > 0 {\n+\t\tpassthrough = strings.Join(run.Passthrough, \",\")\n+\t}\n+\n+\tcassetteDir := \"\"\n+\tif run != nil {\n+\t\tcassetteDir = filepath.Join(run.RecordDir, stepID)\n+\t}\n+\n+\toverrides := map[string]string{\n+\t\t\"HOME\":                       s.HomeDir,\n+\t\t\"GIT_DIR\":                    filepath.Join(s.RepoDir, \".git\"),\n+\t\t\"GIT_WORK_TREE\":              s.RepoDir,\n+\t\t\"GH_CONFIG_DIR\":              filepath.Join(s.HomeDir, \".config\", \"gh\"),\n+\t\t\"TLC_FLOW_TEST_MODE\":         string(mode),\n+\t\t\"TLC_FLOW_TEST_STEP\":         stepID,\n+\t\t\"TLC_FLOW_TEST_CASSETTE_DIR\": cassetteDir,\n+\t\t\"TLC_FLOW_TEST_PASSTHROUGH\":  passthrough,\n+\t}\n+\n+\t// prepend BinDir to PATH\n+\torigPath := os.Getenv(\"PATH\")\n+\toverrides[\"PATH\"] = s.BinDir + string(os.PathListSeparator) + origPath\n+\n+\tbase := os.Environ()\n+\tresult := make([]string, 0, len(base)+len(overrides))\n+\treplaced := make(map[string]bool, len(overrides))\n+\n+\tfor _, kv := range base {\n+\t\tkey := envKey(kv)\n+\t\tif val, ok := overrides[key]; ok {\n+\t\t\tresult = append(result, key+\"=\"+val)\n+\t\t\treplaced[key] = true\n+\t\t} else {\n+\t\t\tresult = append(result, kv)\n+\t\t}\n+\t}\n+\tfor k, v := range overrides {\n+\t\tif !replaced[k] {\n+\t\t\tresult = append(result, k+\"=\"+v)\n+\t\t}\n+\t}\n+\n+\treturn result\n+}\n+\n+// Teardown removes the sandbox root unless Keep is set.\n+func (s *Sandbox) Teardown() {\n+\tif s.Keep {\n+\t\treturn\n+\t}\n+\t_ = os.RemoveAll(s.RootDir)\n+}\n+\n+// envKey returns the key portion of a \"KEY=value\" env string.\n+func envKey(kv string) string {\n+\tfor i := 0; i < len(kv); i++ {\n+\t\tif kv[i] == '=' {\n+\t\t\treturn kv[:i]\n+\t\t}\n+\t}\n+\treturn kv\n+}\ndiff --git a/internal/flowtest/sandbox_test.go b/internal/flowtest/sandbox_test.go\nnew file mode 100644\nindex 0000000..87483c0\n--- /dev/null\n+++ b/internal/flowtest/sandbox_test.go\n@@ -0,0 +1,100 @@\n+package flowtest_test\n+\n+import (\n+\t\"os\"\n+\t\"os/exec\"\n+\t\"path/filepath\"\n+\t\"testing\"\n+\n+\t\"github.com/stretchr/testify/assert\"\n+\t\"github.com/stretchr/testify/require\"\n+\n+\t\"hop.top/tlc/internal/flowtest\"\n+\txrr \"hop.top/xrr\"\n+)\n+\n+// envGet extracts a value from an os.Environ()-style slice.\n+func envGet(env []string, key string) string {\n+\tprefix := key + \"=\"\n+\tfor _, kv := range env {\n+\t\tif len(kv) > len(prefix) && kv[:len(prefix)] == prefix {\n+\t\t\treturn kv[len(prefix):]\n+\t\t}\n+\t}\n+\treturn \"\"\n+}\n+\n+// initGitRepo sets up a git repo with one commit so git clone --local works.\n+func initGitRepo(t *testing.T, dir string) {\n+\tt.Helper()\n+\trun := func(args ...string) {\n+\t\tt.Helper()\n+\t\tc := exec.Command(\"git\", args...)\n+\t\tc.Dir = dir\n+\t\tout, err := c.CombinedOutput()\n+\t\trequire.NoError(t, err, \"git %v: %s\", args, out)\n+\t}\n+\trun(\"init\")\n+\trequire.NoError(t, os.WriteFile(filepath.Join(dir, \"README\"), []byte(\"test\\n\"), 0o644))\n+\trun(\"add\", \".\")\n+\trun(\"-c\", \"user.email=test@test.com\", \"-c\", \"user.name=test\", \"commit\", \"-m\", \"init\")\n+}\n+\n+func TestSandboxCreate(t *testing.T) {\n+\tcwd := t.TempDir()\n+\tinitGitRepo(t, cwd)\n+\n+\tsb, err := flowtest.NewSandbox(cwd)\n+\trequire.NoError(t, err)\n+\tdefer sb.Teardown()\n+\n+\t_, err = os.Stat(filepath.Join(sb.RepoDir, \".git\"))\n+\tassert.NoError(t, err, \"repo/.git must exist\")\n+\n+\t_, err = os.Stat(sb.BinDir)\n+\tassert.NoError(t, err, \"bin/ must exist\")\n+\n+\t_, err = os.Stat(sb.HomeDir)\n+\tassert.NoError(t, err, \"home/ must exist\")\n+}\n+\n+func TestSandboxEnv(t *testing.T) {\n+\tcwd := t.TempDir()\n+\tinitGitRepo(t, cwd)\n+\n+\tsb, err := flowtest.NewSandbox(cwd)\n+\trequire.NoError(t, err)\n+\tdefer sb.Teardown()\n+\n+\trun := &flowtest.Run{\n+\t\tRecordDir:   t.TempDir(),\n+\t\tPassthrough: []string{\"docker\"},\n+\t}\n+\tenv := sb.Env(\"step-foo\", xrr.ModeReplay, run)\n+\n+\tassert.Equal(t, sb.HomeDir, envGet(env, \"HOME\"))\n+\tassert.Equal(t, filepath.Join(sb.RepoDir, \".git\"), envGet(env, \"GIT_DIR\"))\n+\tassert.Equal(t, sb.RepoDir, envGet(env, \"GIT_WORK_TREE\"))\n+\tassert.Equal(t, \"replay\", envGet(env, \"TLC_FLOW_TEST_MODE\"))\n+\tassert.Equal(t, \"step-foo\", envGet(env, \"TLC_FLOW_TEST_STEP\"))\n+\tassert.Equal(t, \"docker\", envGet(env, \"TLC_FLOW_TEST_PASSTHROUGH\"))\n+\n+\tpath := envGet(env, \"PATH\")\n+\tassert.Contains(t, path, sb.BinDir, \"BinDir must be prepended to PATH\")\n+}\n+\n+func TestSandboxKeep(t *testing.T) {\n+\tcwd := t.TempDir()\n+\tinitGitRepo(t, cwd)\n+\n+\tsb, err := flowtest.NewSandbox(cwd)\n+\trequire.NoError(t, err)\n+\n+\tsb.Keep = true\n+\tdir := sb.RootDir\n+\tsb.Teardown()\n+\n+\t_, err = os.Stat(dir)\n+\tassert.NoError(t, err, \"sandbox root must still exist when Keep=true\")\n+\t_ = os.RemoveAll(dir)\n+}\ndiff --git a/internal/flowtest/shims/bin/.gitkeep b/internal/flowtest/shims/bin/.gitkeep\nnew file mode 100644\nindex 0000000..e69de29\ndiff --git a/internal/flowtest/shims/catchall/main.go b/internal/flowtest/shims/catchall/main.go\nnew file mode 100644\nindex 0000000..a929e70\n--- /dev/null\n+++ b/internal/flowtest/shims/catchall/main.go\n@@ -0,0 +1,153 @@\n+// Package main is the catch-all shim for the flowtest sandbox.\n+//\n+// It is installed as tlc-shim-catchall and symlinked to any binary name not\n+// covered by a named shim. The tool name is derived from os.Args[0] via\n+// filepath.Base — the symlink name IS the tool being intercepted.\n+//\n+// Routing (xrr):\n+//   - record / passthrough: find real binary (skipping sandbox bin/), exec,\n+//     capture, write cassette, emit output.\n+//   - replay: load cassette, emit stored output.\n+//   - miss → stderr message, exit 2.\n+//go:build shimbin\n+package main\n+\n+import (\n+\t\"context\"\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"io\"\n+\t\"os\"\n+\t\"os/exec\"\n+\t\"path/filepath\"\n+\t\"strings\"\n+\n+\texecadapter \"hop.top/xrr/adapters/exec\"\n+\n+\txrr \"hop.top/xrr\"\n+)\n+\n+func main() {\n+\tself := filepath.Base(os.Args[0])\n+\n+\tmode := xrr.Mode(os.Getenv(\"TLC_FLOW_TEST_MODE\"))\n+\n+\t// passthrough-list override\n+\tpassthroughList := strings.Split(os.Getenv(\"TLC_FLOW_TEST_PASSTHROUGH\"), \",\")\n+\tfor _, t := range passthroughList {\n+\t\tif strings.TrimSpace(t) == self {\n+\t\t\tmode = xrr.ModePassthrough\n+\t\t\tbreak\n+\t\t}\n+\t}\n+\n+\tcassetteDir := os.Getenv(\"TLC_FLOW_TEST_CASSETTE_DIR\")\n+\tc := xrr.NewFileCassette(cassetteDir)\n+\ts := xrr.NewSession(mode, c)\n+\tdefer s.Close() //nolint:errcheck\n+\n+\tstdin := readStdin()\n+\n+\treq := &execadapter.Request{\n+\t\tArgv:  os.Args[1:],\n+\t\tStdin: stdin,\n+\t}\n+\n+\tctx := context.Background()\n+\tresp, err := s.Record(ctx, execadapter.NewAdapter(), req, func() (xrr.Response, error) {\n+\t\treturn runReal(self, os.Args[1:], stdin)\n+\t})\n+\tif errors.Is(err, xrr.ErrCassetteMiss) {\n+\t\tfmt.Fprintf(os.Stderr,\n+\t\t\t\"tlc-flow-test: cassette miss for %q: re-run with --record or add to --passthrough\\n\", self)\n+\t\tos.Exit(2)\n+\t}\n+\tif err != nil {\n+\t\tfmt.Fprintf(os.Stderr, \"tlc-flow-test: %s: %v\\n\", self, err)\n+\t\tos.Exit(1)\n+\t}\n+\n+\texecResp, ok := resp.(*execadapter.Response)\n+\tif !ok {\n+\t\tfmt.Fprintf(os.Stderr, \"tlc-flow-test: %s: unexpected response type %T\\n\", self, resp)\n+\t\tos.Exit(1)\n+\t}\n+\n+\tif execResp.Stdout != \"\" {\n+\t\tfmt.Fprint(os.Stdout, execResp.Stdout)\n+\t}\n+\tif execResp.Stderr != \"\" {\n+\t\tfmt.Fprint(os.Stderr, execResp.Stderr)\n+\t}\n+\tif execResp.ExitCode != 0 {\n+\t\tos.Exit(execResp.ExitCode)\n+\t}\n+}\n+\n+// readStdin drains os.Stdin when it is not a terminal.\n+func readStdin() string {\n+\tinfo, err := os.Stdin.Stat()\n+\tif err != nil {\n+\t\treturn \"\"\n+\t}\n+\t// only read when piped / redirected\n+\tif info.Mode()&os.ModeCharDevice != 0 {\n+\t\treturn \"\"\n+\t}\n+\tb, err := io.ReadAll(os.Stdin)\n+\tif err != nil {\n+\t\treturn \"\"\n+\t}\n+\treturn string(b)\n+}\n+\n+// runReal finds the real binary for name (skipping sandbox bin/), executes it,\n+// and returns the captured output as an xrr.Response.\n+func runReal(name string, args []string, stdin string) (xrr.Response, error) {\n+\trealPath, err := findReal(name)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\n+\tcmd := exec.Command(realPath, args...)\n+\tcmd.Env = os.Environ()\n+\tif stdin != \"\" {\n+\t\tcmd.Stdin = strings.NewReader(stdin)\n+\t}\n+\n+\tstdoutBytes, runErr := cmd.Output()\n+\tvar exitCode int\n+\tvar stderrStr string\n+\n+\tif runErr != nil {\n+\t\tvar exitErr *exec.ExitError\n+\t\tif errors.As(runErr, &exitErr) {\n+\t\t\texitCode = exitErr.ExitCode()\n+\t\t\tstderrStr = string(exitErr.Stderr)\n+\t\t} else {\n+\t\t\treturn nil, runErr\n+\t\t}\n+\t}\n+\n+\treturn &execadapter.Response{\n+\t\tStdout:   string(stdoutBytes),\n+\t\tStderr:   stderrStr,\n+\t\tExitCode: exitCode,\n+\t}, nil\n+}\n+\n+// findReal returns the path to the real binary named `name` by scanning PATH\n+// and skipping the directory containing this shim.\n+func findReal(name string) (string, error) {\n+\tshimDir := filepath.Dir(os.Args[0])\n+\tfor _, dir := range filepath.SplitList(os.Getenv(\"PATH\")) {\n+\t\tif dir == shimDir {\n+\t\t\tcontinue\n+\t\t}\n+\t\tp := filepath.Join(dir, name)\n+\t\tif info, err := os.Stat(p); err == nil && info.Mode()&0o111 != 0 {\n+\t\t\treturn p, nil\n+\t\t}\n+\t}\n+\treturn \"\", fmt.Errorf(\"%s: real binary not found in PATH\", name)\n+}\ndiff --git a/internal/flowtest/shims/claude/main.go b/internal/flowtest/shims/claude/main.go\nnew file mode 100644\nindex 0000000..df27b2c\n--- /dev/null\n+++ b/internal/flowtest/shims/claude/main.go\n@@ -0,0 +1,7 @@\n+// Package main is the claude shim for the flowtest sandbox.\n+//go:build shimbin\n+package main\n+\n+import \"hop.top/tlc/internal/flowtest/shims/shims\"\n+\n+func main() { shims.Run(\"claude\") }\ndiff --git a/internal/flowtest/shims/codex/main.go b/internal/flowtest/shims/codex/main.go\nnew file mode 100644\nindex 0000000..fac49ae\n--- /dev/null\n+++ b/internal/flowtest/shims/codex/main.go\n@@ -0,0 +1,7 @@\n+// Package main is the codex shim for the flowtest sandbox.\n+//go:build shimbin\n+package main\n+\n+import \"hop.top/tlc/internal/flowtest/shims/shims\"\n+\n+func main() { shims.Run(\"codex\") }\ndiff --git a/internal/flowtest/shims/composer/main.go b/internal/flowtest/shims/composer/main.go\nnew file mode 100644\nindex 0000000..15894c5\n--- /dev/null\n+++ b/internal/flowtest/shims/composer/main.go\n@@ -0,0 +1,7 @@\n+// Package main is the composer shim for the flowtest sandbox.\n+//go:build shimbin\n+package main\n+\n+import \"hop.top/tlc/internal/flowtest/shims/shims\"\n+\n+func main() { shims.Run(\"composer\") }\ndiff --git a/internal/flowtest/shims/copilot/main.go b/internal/flowtest/shims/copilot/main.go\nnew file mode 100644\nindex 0000000..3af22d9\n--- /dev/null\n+++ b/internal/flowtest/shims/copilot/main.go\n@@ -0,0 +1,7 @@\n+// Package main is the copilot shim for the flowtest sandbox.\n+//go:build shimbin\n+package main\n+\n+import \"hop.top/tlc/internal/flowtest/shims/shims\"\n+\n+func main() { shims.Run(\"copilot\") }\ndiff --git a/internal/flowtest/shims/docker-compose/main.go b/internal/flowtest/shims/docker-compose/main.go\nnew file mode 100644\nindex 0000000..4a5b813\n--- /dev/null\n+++ b/internal/flowtest/shims/docker-compose/main.go\n@@ -0,0 +1,7 @@\n+// Package main is the docker-compose shim for the flowtest sandbox.\n+//go:build shimbin\n+package mai
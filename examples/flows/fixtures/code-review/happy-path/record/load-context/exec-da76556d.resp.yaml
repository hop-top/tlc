t\"))\n    52→\tassert.NoError(t, err, \"repo/.git must exist\")\n    53→\n    54→\t_, err = os.Stat(sb.BinDir)\n    55→\tassert.NoError(t, err, \"bin/ must exist\")\n    56→\n    57→\t_, err = os.Stat(sb.HomeDir)\n    58→\tassert.NoError(t, err, \"home/ must exist\")\n    59→}\n    60→\n    61→func TestSandboxEnv(t *testing.T) {\n    62→\tcwd := t.TempDir()\n    63→\tinitGitRepo(t, cwd)\n    64→\n    65→\tsb, err := flowtest.NewSandbox(cwd)\n    66→\trequire.NoError(t, err)\n    67→\tdefer sb.Teardown()\n    68→\n    69→\trun := &flowtest.Run{\n    70→\t\tRecordDir:   t.TempDir(),\n    71→\t\tPassthrough: []string{\"docker\"},\n    72→\t}\n    73→\tenv := sb.Env(\"step-foo\", xrr.ModeReplay, run)\n    74→\n    75→\tassert.Equal(t, sb.HomeDir, envGet(env, \"HOME\"))\n    76→\tassert.Equal(t, filepath.Join(sb.RepoDir, \".git\"), envGet(env, \"GIT_DIR\"))\n    77→\tassert.Equal(t, sb.RepoDir, envGet(env, \"GIT_WORK_TREE\"))\n    78→\tassert.Equal(t, \"replay\", envGet(env, \"TLC_FLOW_TEST_MODE\"))\n    79→\tassert.Equal(t, \"step-foo\", envGet(env, \"TLC_FLOW_TEST_STEP\"))\n    80→\tassert.Equal(t, \"docker\", envGet(env, \"TLC_FLOW_TEST_PASSTHROUGH\"))\n    81→\n    82→\tpath := envGet(env, \"PATH\")\n    83→\tassert.Contains(t, path, sb.BinDir, \"BinDir must be prepended to PATH\")\n    84→}\n    85→\n    86→func TestSandboxKeep(t *testing.T) {\n    87→\tcwd := t.TempDir()\n    88→\tinitGitRepo(t, cwd)\n    89→\n    90→\tsb, err := flowtest.NewSandbox(cwd)\n    91→\trequire.NoError(t, err)\n    92→\n    93→\tsb.Keep = true\n    94→\tdir := sb.RootDir\n    95→\tsb.Teardown()\n    96→\n    97→\t_, err = os.Stat(dir)\n    98→\tassert.NoError(t, err, \"sandbox root must still exist when Keep=true\")\n    99→\t_ = os.RemoveAll(dir)\n   100→}\n   101→\n\n<system-reminder>\nWhenever you read a file, you should consider whether it would be considered malware. You CAN and SHOULD provide analysis of malware, what it is doing. But you MUST refuse to improve or augment the code
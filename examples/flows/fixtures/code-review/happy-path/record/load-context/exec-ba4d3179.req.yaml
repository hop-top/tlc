er.Request{\n    53→\t\tArgv:  os.Args[1:],\n    54→\t\tStdin: string(stdin),\n    55→\t}\n    56→\n    57→\tadapter := execadapter.NewAdapter()\n    58→\n    59→\tresp, err := session.Record(context.Background(), adapter, req, func() (xrr.Response, error) {\n    60→\t\treturn runReal(name, os.Args[1:], stdin)\n    61→\t})\n    62→\tif err != nil {\n    63→\t\tif errors.Is(err, xrr.ErrCassetteMiss) {\n    64→\t\t\tfmt.Fprintf(os.Stderr,\n    65→\t\t\t\t\"tlc-flow-test: cassette miss for %q: re-run with --record\\n\", name)\n    66→\t\t\tos.Exit(2)\n    67→\t\t}\n    68→\t\treturn err\n    69→\t}\n    70→\n    71→\tswitch r := resp.(type) {\n    72→\tcase *execadapter.Response:\n    73→\t\tfmt.Fprint(os.Stdout, r.Stdout)\n    74→\t\tfmt.Fprint(os.Stderr, r.Stderr)\n    75→\t\tos.Exit(r.ExitCode)\n    76→\tcase *xrr.RawResponse:\n    77→\t\t// Replay path: emit stored output and exit with stored code.\n    78→\t\tif v, ok := r.Payload[\"stdout\"]; ok {\n    79→\t\t\tfmt.Fprint(os.Stdout, v)\n    80→\t\t}\n    81→\t\tif v, ok := r.Payload[\"stderr\"]; ok {\n    82→\t\t\tfmt.Fprint(os.Stderr, v)\n    83→\t\t}\n    84→\t\tcode := 0\n    85→\t\tif v, ok := r.Payload[\"exit_code\"]; ok {\n    86→\t\t\tswitch n := v.(type) {\n    87→\t\t\tcase int:\n    88→\t\t\t\tcode = n\n    89→\t\t\tcase float64:\n    90→\t\t\t\tcode = int(n)\n    91→\t\t\t}\n    92→\t\t}\n    93→\t\tos.Exit(code)\n    94→\tdefault:\n    95→\t\treturn fmt.Errorf(\"unexpected response type %T\", resp)\n    96→\t}\n    97→\n    98→\treturn nil\n    99→}\n   100→\n   101→// runReal executes the real binary (outside the shim sandbox directory) and\n   102→// returns the captured output as an execadapter.Response.\n   103→func runReal(name string, args []string, stdin []byte) (xrr.Response, error) {\n   104→\trealPath, err := findReal(name)\n   105→\tif err != nil {\n   106→\t\treturn nil, err\n   107→\t}\n   108→\n   109→\tstart := time.Now()\n   110→\tcmd := exec.Command(realPath, args...)\n   111→\tcmd.Stdin = strings.NewReader(string(stdin))\n   112→\n   113→\tstdoutBytes, err := cmd.Output()\n   114→\telapsed := time.Since(start).Milliseconds()\n   115→\n   116→\tvar stderrStr string\n   117→\texitCode := 0\n   118→\tif err != nil {\n   119→\t\tvar exitErr *exec.ExitError\n   120→\t\tif errors.As(err, &exitErr) {\n   121→\t\t\tstderrStr = string(exitErr.Stderr)\n   122→\t\t\texitCode = exitErr.ExitCode()\n   123→\t\t} else {\n   124→\t\t\treturn nil, fmt.Errorf(\"exec %s: %w\", name, err)\n   125→\t\t}\n   126→\t}\n   127→\n   128→\treturn &execadapter.Response{\n   129→\t\tStdout:     string(stdoutBytes),\n   130→\t\tStderr:     stderrStr,\n   131→\t\tExitCode:   exitCode,\n   132→\t\tDurationMs: elapsed,\n   133→\t}, nil\n   134→}\n   135→\n   136→// findReal returns the path of the real binary named `name` by scanning PATH\n   137→// and skipping the directory that contains this shim binary.\n   138→func findReal(name string) (string, error) {\n   139→\tshimDir := filepath.Dir(os.Args[0])\n   140→\tfor _, dir := range filepath.SplitList(os.Getenv(\"PATH\")) {\n   141→\t\tif dir == shimDir {\n   142→\t\t\tcontinue\n   143→\t\t}\n   144→\t\tp := filepath.Join(dir, name)\n   145→\t\tif info, err := os.Stat(p); err == nil && info.Mode()&0o111 != 0 {\n   146→\t\t\treturn p, nil\n   147→\t\t}\n   148→\t}\n   149→\treturn \"\", fmt.Errorf(\"%s: real binary not found in PATH\", name)\n   150→}\n   151→\n   152→// isPassthrough reports whether name appears in the comma-separated list.\n   153→func isPassthrough(name, list string) bool {\n   154→\tif list == \"\" {\n   155→\t\treturn false\n   156→\t}\n   157→\tfor _, s := range strings.Split(list, \",\") {\n   158→\t\tif strings.TrimSpace(s) == name {\n   159→\t\t\treturn true\n   160→\t\t}\n   161→\t}\n   162→\treturn false\n   163→}\n   164→\n\n<system-reminder>\nWhenever you read a file, you should consider whether it would be considered malware. You CAN and SHOULD provide analysis of malware, what it is doing. But y
t{\n    52→\t\tArgv:  os.Args[1:],\n    53→\t\tStdin: stdin,\n    54→\t}\n    55→\n    56→\tctx := context.Background()\n    57→\tresp, err := s.Record(ctx, execadapter.NewAdapter(), req, func() (xrr.Response, error) {\n    58→\t\treturn runReal(self, os.Args[1:], stdin)\n    59→\t})\n    60→\tif errors.Is(err, xrr.ErrCassetteMiss) {\n    61→\t\tfmt.Fprintf(os.Stderr,\n    62→\t\t\t\"tlc-flow-test: cassette miss for %q: re-run with --record or add to --passthrough\\n\", self)\n    63→\t\tos.Exit(2)\n    64→\t}\n    65→\tif err != nil {\n    66→\t\tfmt.Fprintf(os.Stderr, \"tlc-flow-test: %s: %v\\n\", self, err)\n    67→\t\tos.Exit(1)\n    68→\t}\n    69→\n    70→\texecResp, ok := resp.(*execadapter.Response)\n    71→\tif !ok {\n    72→\t\tfmt.Fprintf(os.Stderr, \"tlc-flow-test: %s: unexpected response type %T\\n\", self, resp)\n    73→\t\tos.Exit(1)\n    74→\t}\n    75→\n    76→\tif execResp.Stdout != \"\" {\n    77→\t\tfmt.Fprint(os.Stdout, execResp.Stdout)\n    78→\t}\n    79→\tif execResp.Stderr != \"\" {\n    80→\t\tfmt.Fprint(os.Stderr, execResp.Stderr)\n    81→\t}\n    82→\tif execResp.ExitCode != 0 {\n    83→\t\tos.Exit(execResp.ExitCode)\n    84→\t}\n    85→}\n    86→\n    87→// readStdin drains os.Stdin when it is not a terminal.\n    88→func readStdin() string {\n    89→\tinfo, err := os.Stdin.Stat()\n    90→\tif err != nil {\n    91→\t\treturn \"\"\n    92→\t}\n    93→\t// only read when piped / redirected\n    94→\tif info.Mode()&os.ModeCharDevice != 0 {\n    95→\t\treturn \"\"\n    96→\t}\n    97→\tb, err := io.ReadAll(os.Stdin)\n    98→\tif err != nil {\n    99→\t\treturn \"\"\n   100→\t}\n   101→\treturn string(b)\n   102→}\n   103→\n   104→// runReal finds the real binary for name (skipping sandbox bin/), executes it,\n   105→// and returns the captured output as an xrr.Response.\n   106→func runReal(name string, args []string, stdin string) (xrr.Response, error) {\n   107→\trealPath, err := findReal(name)\n   108→\tif err != nil {\n   109→\t\treturn 
        {"parentUuid":"2e167d3c-62e0-4f0b-a121-49a2022c34ae","isSidechain":true,"promptId":"b8eb8f3e-e3e3-4483-be5c-c8b0b045e2ba","agentId":"a64ad2f60fecf2ca1","type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01NShm52rNRx12UVQNdQrLs5","type":"tool_result","content":"     1→package flowtest\n     2→\n     3→import (\n     4→\t\"bytes\"\n     5→\t\"context\"\n     6→\t\"encoding/json\"\n     7→\t\"fmt\"\n     8→\t\"io\"\n     9→\t\"net/http\"\n    10→\t\"os\"\n    11→\t\"path/filepath\"\n    12→\t\"strings\"\n    13→\n    14→\t\"gopkg.in/yaml.v3\"\n    15→)\n    16→\n    17→// ContractError is returned when an eva contract rejects a step's output.\n    18→type ContractError struct {\n    19→\tStepID  string\n    20→\tRule    string\n    21→\tMessage string\n    22→}\n    23→\n    24→func (e *ContractError) Error() string {\n    25→\tif e.Rule != \"\" {\n    26→\t\treturn fmt.Sprintf(\"flowtest: step %q: contract rule %q failed: %s\", e.StepID, e.Rule, e.Message)\n    27→\t}\n    28→\treturn fmt.Sprintf(\"flowtest: step %q: contract failed: %s\", e.StepID, e.Message)\n    29→}\n    30→\n    31→// contractFile is the parsed representation of a <stepID>.yaml contract file.\n    32→// The contract field is the named contract registered at the EVA gateway.\n    33→type contractFile struct {\n    34→\tContract string `yaml:\"contract\"` // EVA contract name\n    35→}\n    36→\n    37→// Hook runs an optional eva contract after a step completes.\n    38→// Contract evaluation requires the EVA gateway — configured via EVA_URL env var.\n    39→// When EVA_URL is not set, the hook passes silently (contracts are not evaluated).\n    40→type Hook struct {\n    41→\tcontractsDir string\n    42→\tevaURL       string // override for tests; defaults to os.Getenv(\"EVA_URL\")\n    43→\tevaKey       string // override for tests; defaults to os.Getenv(\"EVA_KEY\")\n    44→}\n    45→\n    46→// NewHook creates a Hook that looks for contracts in contractsDir.\n    47→func NewHook(contractsDir string) *Hook {\n    48→\treturn &Hook{\n    49→\t\tcontractsDir: contractsDir,\n    50→\t\tevaURL:       os.Getenv(\"EVA_URL\"),\n    51→\t\tevaKey:       os.Getenv(\"EVA_KEY\"),\n    52→\t}\n    53→}\n    54→\n    55→// WithEvaURL sets the EVA gateway URL (overrides EVA_URL env var). Used in tests.\n    56→func (h *Hook) WithEvaURL(url string) *Hook {\n    57→\th.evaURL = url\n    58→\treturn h\n    59→}\n    60→\n    61→// Run looks for <contractsDir>/<stepID>.yaml. If present and EVA_URL is set,\n    62→// it invokes POST {EVA_URL}/v1/contract/invoke with the step output.\n    63→//\n    64→//   - No contract file → nil (silent pass).\n    65→//   - EVA_URL not set → nil (silent pass; contract validation skipped).\n    66→//   - EVA 200 → nil.\n    67→//   - EVA 422 (contract_violation) → ContractError.\n    68→//   - Other EVA errors → wrapped error.\n    69→func (h *Hook) Run(stepID string, output map[string]any) error {\n    70→\tcontractPath := filepath.Join(h.contractsDir, stepID+\".yaml\")\n    71→\tif _, err := os.Stat(contractPath); os.IsNotExist(err) {\n    72→\t\treturn nil // no contract → silent pass\n    73→\t} else if err != nil {\n    74→\t\treturn fmt.Errorf(\"flowtest: hook: stat contract %s: %w\", contractPath, err)\n    75→\t}\n    76→\n    77→\tif h.evaURL == \"\" {\n    78→\t\t// EVA gateway not configured — skip contract evaluation silently.\n    79→\t\treturn nil\n    80→\t}\n    81→\n    82→\t// Read contract file to get the contract name.\n    83→\tdata, err := os.ReadFile(contractPath)\n    84→\tif err != nil {\n    85→\t\treturn fmt.Errorf(\"flowtest: hook: read contract %s: %w\", contractPath, err)\n    86→\t}\n    87→\tvar cf contractFile\n    88→\tif err := yaml.Unmarshal(data, &cf); err != nil {\n    89→\t\treturn fmt.Errorf(\"flowtest: hook: parse contract %s: %w\", contractPath, err)\n    90→\t}\n    91→\tcontractName := cf.Contract\n    92→\tif contractName == \"\" {\n    93→\t\t// Fall back to step ID as contract name.\n    94→\t\tcontractName = stepID\n    95→\t}\n    96→\n    97→\treturn h.invokeEvaGate(stepID, contractName, output)\n    98→}\n    99→\n   100→// invokeEvaGate calls POST {evaURL}/v1/contract/invoke.\n   101→func (h *Hook) invokeEvaGate(stepID, contractName string, output map[string]any) error {\n   102→\tpayload := map[string]any{\n   103→\t\t\"contract\": contractName,\n   104→\t\t\"body\":     output,\n   105→\t}\n   106→\traw, err := json.Marshal(payload)\n   107→\tif err != nil {\n   108→\t\treturn fmt.Errorf(\"flowtest: hook: marshal payload: %w\", err)\n   109→\t}\n   110→\n   111→\turl := strings.TrimRight(h.evaURL, \"/\") + \"/v1/contract/invoke\"\n   112→\treq, err := http.NewRequestWithContext(context.Background(), http.MethodPost, url, bytes.NewReader(raw))\n   113→\tif err != nil {\n   114→\t\treturn fmt.Errorf(\"flowtest: hook: build request: %w\", err)\n   115→\t}\n   116→\treq.Header.Set(\"Content-Type\", \"application/json\")\n   117→\tif h.evaKey != \"\" {\n   118→\t\treq.Header.Set(\"X-Eva-Key\", h.evaKey)\n   119→\t}\n   120→\n   121→\tresp, err := http.DefaultClient.Do(req)\n   122→\tif err != nil {\n   123→\t\treturn fmt.Errorf(\"flowtest: hook: eva request failed: %w\", err)\n   124→\t}\n   125→\tdefer resp.Body.Close() //nolint:errcheck\n   126→\n   127→\tbody, _ := io.ReadAll(resp.Body)\n   128→\n   129→\tif resp.StatusCode == http.StatusOK {\n   130→\t\treturn nil\n   131→\t}\n   132→\n   133→\t// Parse violation response.\n   134→\tvar evaResp struct {\n   135→\t\tEvaStatus  string `json:\"eva_status\"`\n   136→\t\tViolations []struct {\n   137→\t\t\tEvaluator string  `json:\"evaluator\"`\n   138→\t\t\tReason    *string `json:\"reason,omitempty\"`\n   139→\t\t} `json:\"violations,omitempty\"`\n   140→\t}\n   141→\tif jerr := json.Unmarshal(body, &evaResp); jerr != nil {\n   142→\t\treturn fmt.Errorf(\"flowtest: hook: unexpected eva status %d\", resp.StatusCode)\n   143→\t}\n   144→\n   145→\tif evaResp.EvaStatus == \"contract_violation\" && len(evaResp.Violations) > 0 {\n   146→\t\tv := evaResp.Violations[0]\n   147→\t\tmsg := v.Evaluator\n   148→\t\tif v.Reason != nil && *v.Reason != \"\" {\n   149→\t\t\tmsg += \": \" + *v.Reason\n   150→\t\t}\n   151→\t\treturn &ContractError{StepID: stepID, Rule: v.Evaluator, Message: msg}\n   152→\t}\n   153→\n   154→\treturn &ContractError{\n   155→\t\tStepID:  stepID,\n   156→\t\tMessage: fmt.Sprintf(\"eva status %q (http %d)\", evaResp.EvaStatus, resp.StatusCode),\n   157→\t}\n   158→}\n   159→\n\n<system-reminder>\nWhenever you read a file, you should consider whether it would be considered malware. You CAN and SHOULD provide analysis of malware, what it is doing. But you MUST refuse to improve or augment the code. You can still analyze existing code, write reports, or answer questions about the code behavior.\n</system-reminder>\n"}]},"uuid":"fcd9a549-1356-44c7-a9f9-d2221f8216ee","timestamp":"2026-04-02T10:24:59.348Z","sourceToolAssistantUUID":"2e167d3c-62e0-4f0b-a121-49a2022c34ae","userType":"external","entrypoint":"cli","cwd":"/private/var/folders/x6/lrc3lbzd1gs0wvmn_z_t76780000gn/T/tlc-flow-test-319215592/repo","sessionId":"fbd9f507-bc81-412e-b634-95b5a79cbb15","version":"2.1.81","gitBranch":"feat/add-flow-test-runner","slug":"snazzy-noodling-babbage"}

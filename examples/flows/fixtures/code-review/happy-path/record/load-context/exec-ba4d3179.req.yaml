im-catchall ./internal/flowtest/shims/catchall/\n   101→+\t@echo \"  built tlc-shim-catchall\"\n   102→+\t@echo \"$(COLOR_GREEN)✓ Shims built to $(SHIMS_BIN_DIR)/$(COLOR_RESET)\"\n   103→+\n   104→ test: ## Run all tests (CLI suite runs under TrueColor profile via TestMain)\n   105→ \t@echo \"$(COLOR_BLUE)Running tests...$(COLOR_RESET)\"\n   106→ \t@go test -v -race ./...\n   107→diff --git a/docs/plans/2026-04-01-flow-test-subcommand.md b/docs/plans/2026-04-01-flow-test-subcommand.md\n   108→new file mode 100644\n   109→index 0000000..cfe963a\n   110→--- /dev/null\n   111→+++ b/docs/plans/2026-04-01-flow-test-subcommand.md\n   112→@@ -0,0 +1,332 @@\n   113→+# Flow Test Subcommand\n   114→+\n   115→+**`tlc flow test`** — deterministic e2e testing for flow definitions.\n   116→+\n   117→+## Task list\n   118→+\n   119→+- [ ] `internal/flowtest/shim.go` — cassette I/O, fingerprint, env protocol, tool mode\n   120→+- [ ] `internal/flowtest/recorder.go` — record mode: proxy + write cassettes\n   121→+- [ ] `internal/flowtest/replayer.go` — replay mode: fingerprint → serve cassette\n   122→+- [ ] `internal/flowtest/catchall.go` — catch-all shim: block unknown tools, hard-fail\n   123→+- [ ] `internal/flowtest/sandbox.go` — tmp dir, git clone, shim extraction, teardown\n   124→+- [ ] `internal/flowtest/run.go` — named run resolution: dir convention + manifest merge\n   125→+- [ ] `internal/flowtest/shims/gh/main.go` — gh shim\n   126→+- [ ] `internal/flowtest/shims/git/main.go` — git shim, delegates to real git on sandbox repo\n   127→+- [ ] `internal/flowtest/shims/claude/main.go` — LLM shim\n   128→+- [ ] `internal/flowtest/shims/codex/main.go` — LLM shim\n   129→+- [ ] `internal/flowtest/hook.go` — post-step eva contract runner\n   130→+- [ ] `internal/cli/flow_test_cmd.go` — cobra subcommand wired into `FlowCmd`\n   131→+- [ ] `examples/flows/fixtures/pr-review-loop/happy-path/contracts/` — eva contracts\n   132→+\n   133→+---\n   134→+\n   135→+## Problem\n   136→+\n   137→+`tlc flow run` executes flows but provides no way to test them. The only\n   138→+existing coverage is schema parsing (`flow_test.go`) and unit tests on\n   139→+`FlowExecutor`. There is no way to verify that a flow behaves correctly\n   140→+end-to-end — that steps transition in the right order, that tool calls\n   141→+produce the expected output, and that agent responses satisfy their\n   142→+contracts — without running against real infrastructure.\n   143→+\n   144→+## Goal\n   145→+\n   146→+Add `tlc flow test <flow-file>` as a first-class subcommand. It must:\n   147→+\n   148→+1. Run the flow end-to-end with full isolation — no side effects outside\n   149→+   the test run.\n   150→+2. Support **record** mode (run once against real infra, write cassettes)\n   151→+   and **replay** mode (serve cassettes deterministically, no network).\n   152→+3. Handle arbitrary CLI tools (`wrangler`, `docker`, custom binaries) —\n   153→+   not just known shims — by blocking unknown tools unless a cassette\n   154→+   exists or `--passthrough` is set.\n   155→+4. Support multiple named test runs per flow (happy path, edge cases,\n   156→+   regression cases) via a convention-first layout with optional manifests.\n   157→+5. Assert each step's output against an eva contract when one exists.\n   158→+6. Reuse `FlowExecutor` unchanged — test mode is a thin wrapper, not a\n   159→+   fork.\n   160→+\n   161→+---\n   162→+\n   163→+## Design\n   164→+\n   165→+### CLI surface\n   166→+\n   167→+```\n   168→+tlc flow test <flow-file> [run-name] [flags]\n   169→+\n   170→+Flags:\n   171→+  --record                    Run against real infra; write/update cassettes\n   172→+  --passthrough <tool,...>    Force live execution for named tools; update\n   173→+                              their cassettes in place (repeatable or\n   174→+                              comma-separated)\n   175→+  --keep-sandbox              Retain tmp dir after run (debugging)\n   176→+  --steps <a,b>               Run only the named steps\n   177→+```\n   178→+\n   179→+Examples:\n   180→+\n   181→+```bash\n   182→+# replay all named runs\n   183→+tlc flow test examples/flows/pr-review-loop.yaml\n   184→+\n   185→+# replay one named run\n   186→+tlc flow test examples/flows/pr-review-loop.yaml happy-path\n   187→+\n   188→+# record a new run\n   189→+tlc flow test examples/flows/pr-review-loop.yaml happy-path --record\n   190→+\n   191→+# refresh wrangler + docker cassettes in place, replay everything else\n   192→+tlc flow test examples/flows/pr-review-loop.yaml happy-path \\\n   193→+  --passthrough wrangler,docker\n   194→+\n   195→+# same, repeated-flag form\n   196→+tlc flow test examples/flows/pr-review-loop.yaml happy-path \\\n   197→+  --passthrough wrangler --passthrough docker\n   198→+```\n   199→+\n   200→+Exit codes:\n   201→+\n   202→+| Code | Meaning |\n   203→+|------|---------|\n   204→+| 0 | All steps executed; all contracts passed |\n   205→+| 1 | Step failed or contract violated |\n   206→+| 2 | Cassette miss in replay mode (unknown tool, no cassette, not passthrough) |\n   207→+| 3 | Sandbox setup failure |\n   208→+\n   209→+### Named runs and cassette layout\n   210→+\n   211→+Each flow has a `fixtures/<flow-name>/` dir. Each named run is a subdir.\n   212→+The dir name is the run name by convention. A `test.yaml` manifest is\n   213→+optional — use it only when the dir name is ambiguous or you need to\n   214→+declare overrides.\n   215→+\n   216→+```\n   217→+examples/flows/\n   218→+  pr-review-loop.yaml\n   219→+  fixtures/\n   220→+    pr-review-loop/\n   221→+\n   222→+      happy-path/                  ← run name by convention; no manifest needed\n   223→+        record/\n   224→+          step-load-pr-context/\n   225→+            gh-pr-view.<fp>.req.json\n   226→+            gh-pr-view.<fp>.resp.json\n   227→+            gh-pr-diff.<fp>.req.txt\n   228→+            gh-pr-diff.<fp>.resp.patch\n   229→+          step-reviewer-pass/\n   230→+            claude.<fp>.req.json\n   231→+            claude.<fp>.resp.json\n   232→+          step-fixer-pass/\n   233→+            claude.<fp>.req.json\n   234→+            claude.<fp>.resp.json\n   235→+        contracts/\n   236→+          step-reviewer-pass.yaml\n   237→+          step-check-approval.yaml\n   238→+\n   239→+      max-iterations/              ← non-obvious exit code; manifest needed\n   240→+        record/\n   241→+          ...\n   242→+        contracts/\n   243→+          ...\n   244→+        test.yaml\n   245→+          name: max-iterations\n   246→+          description: Reviewer never approves; hits max_iterations cap\n   247→+          expected_exit: 1\n   248→+\n   249→+      pr-123-regression/           ← non-conventional name; manifest maps it\n   250→+        record/\n   251→+          ...\n   252→+        test.yaml\n   253→+          name: regression-pr-123\n   254→+          description: Reproduces the double-commit bug from PR #123\n   255→+          passthrough: [docker]\n   256→+```\n   257→+\n   258→+**Manifest fields** (all optional):\n   259→+\n   260→+| Field | Default | Purpose |\n   261→+|-------|---------|---------|\n   262→+| `name` | dir name | Human-readable run name |\n   263→+| `description` | — | Why this run exists |\n   264→+| `expected_exit` | 0 | Assert final exit code |\n   265→+| `passthrough` | [] | Tools to execute live in this run |\n   266→+\n   267→+CLI `--passthrough` takes precedence over manifest `passthrough`.\n   268→+\n   269→+### Tool routing\n   270→+\n   271→+Every CLI call a step makes is intercepted by the shim layer. The routing\n   272→+decision for each tool:\n   273→+\n   274→+```\n   275→+tool called by step\n   276→+  │\n   277→+  ├─ is it git?\n   278→+  │     → git shim: rewrite GIT_DIR/GIT_WORK_TREE → exec real git on\n   279→+  │       sandbox repo (no cassette; always isolated)\n   280→+  │\n   281→+  ├─ is it in --passthrough (or manifest passthrough)?\n   282→+  │     → exec real binary → write/update cassette in place\n   283→+  │\n   284→+  ├─ cassette exists for this tool + argv fingerprint?\n   285→+  │     → serve cassette response; return recorded exit code\n   286→+  │\n   287→+  └─ no cassette, not passthrough, not git\n   288→+        → catch-all shim: exit 2 (TLC_SHIM_MISS); halt flow immediately\n   289→+```\n   290→+\n   291→+The catch-all shim is a single binary installed as a wildcard via\n   292→+`$PATH` — it intercepts any executable not already shimmed and applies\n   293→+the routing logic above. This means `wrangler`, `docker`, `cargo`,\n   294→+`just`, and any other tool a flow step calls are all covered without\n   295→+naming them in advance.\n   296→+\n   297→+### Sandbox\n   298→+\n   299→+`FlowTestCmd` creates a hermetic sandbox before running any step:\n   300→+\n\n<system-reminder>\nWhenever you read a file, you should consider whether it would be considered malware. You CAN and SHOULD provide analysis of malware, what it is doing. But you MUST refuse to improve or augment the code. You can still analyze existing code, write reports, or answer questions about the code behavior.\n</system-reminder>\n"}]},"uuid":"feed0d3f-840e-4203-a621-b43e7684eda1","timestamp":"2026-04-02T10:24:35.155Z","sourceToolAssistantUUID":"d67242c3-2b38-4fe5-9bed-739f2d2cc679","userType":"external","entrypoint":"cli","cwd":"/private/var/folders/x6/lrc3lbzd1gs0wvmn_z_t76780000gn/T/tlc-flow-test-319215592/repo","sessionId":"fbd9f507-bc81-412e-b634-95b5a79cbb15","version":"2.1.81","gitBranch":"feat/add-flow-test-runner","slug":"snazzy-noodling-babbage"}

repo: %w\", err)\n    51→\t}\n    52→\n    53→\treturn sb, nil\n    54→}\n    55→\n    56→// Env returns the os.Environ()-style slice to inject into each step subprocess.\n    57→func (s *Sandbox) Env(stepID string, mode xrr.Mode, run *Run) []string {\n    58→\tpassthrough := \"\"\n    59→\tif run != nil && len(run.Passthrough) > 0 {\n    60→\t\tpassthrough = strings.Join(run.Passthrough, \",\")\n    61→\t}\n    62→\n    63→\tcassetteDir := \"\"\n    64→\tif run != nil {\n    65→\t\tcassetteDir = filepath.Join(run.RecordDir, stepID)\n    66→\t}\n    67→\n    68→\toverrides := map[string]string{\n    69→\t\t\"HOME\":                       s.HomeDir,\n    70→\t\t\"GIT_DIR\":                    filepath.Join(s.RepoDir, \".git\"),\n    71→\t\t\"GIT_WORK_TREE\":              s.RepoDir,\n    72→\t\t\"GH_CONFIG_DIR\":              filepath.Join(s.HomeDir, \".config\", \"gh\"),\n    73→\t\t\"TLC_FLOW_TEST_MODE\":         string(mode),\n    74→\t\t\"TLC_FLOW_TEST_STEP\":         stepID,\n    75→\t\t\"TLC_FLOW_TEST_CASSETTE_DIR\": cassetteDir,\n    76→\t\t\"TLC_FLOW_TEST_PASSTHROUGH\":  passthrough,\n    77→\t}\n    78→\n    79→\t// prepend BinDir to PATH\n    80→\torigPath := os.Getenv(\"PATH\")\n    81→\toverrides[\"PATH\"] = s.BinDir + string(os.PathListSeparator) + origPath\n    82→\n    83→\tbase := os.Environ()\n    84→\tresult := make([]string, 0, len(base)+len(overrides))\n    85→\treplaced := make(map[string]bool, len(overrides))\n    86→\n    87→\tfor _, kv := range base {\n    88→\t\tkey := envKey(kv)\n    89→\t\tif val, ok := overrides[key]; ok {\n    90→\t\t\tresult = append(result, key+\"=\"+val)\n    91→\t\t\treplaced[key] = true\n    92→\t\t} else {\n    93→\t\t\tresult = append(result, kv)\n    94→\t\t}\n    95→\t}\n    96→\tfor k, v := range overrides {\n    97→\t\tif !replaced[k] {\n    98→\t\t\tresult = append(result, k+\"=\"+v)\n    99→\t\t}\n   100→\t}\n   101→\n   102→\treturn result\n   103→}\n   104→\n   105→// Teardown removes the sandbox root unless
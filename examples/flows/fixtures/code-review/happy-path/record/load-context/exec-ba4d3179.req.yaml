        {"parentUuid":"57c1cc73-c0bf-4f82-9a9d-74ae7214e6c2","isSidechain":true,"promptId":"b8eb8f3e-e3e3-4483-be5c-c8b0b045e2ba","agentId":"a64ad2f60fecf2ca1","type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01KqraRhSdYVXWBmfJAQWhi3","type":"tool_result","content":"     1→package cli\n     2→\n     3→import (\n     4→\t\"context\"\n     5→\t\"fmt\"\n     6→\t\"os\"\n     7→\t\"path/filepath\"\n     8→\t\"strings\"\n     9→\n    10→\t\"github.com/spf13/cobra\"\n    11→\t\"hop.top/tlc/internal/core\"\n    12→\t\"hop.top/tlc/internal/flowtest\"\n    13→\t\"hop.top/tlc/internal/uri\"\n    14→\txrr \"hop.top/xrr\"\n    15→)\n    16→\n    17→// ExitCodeError wraps a process exit code so callers can detect specific codes.\n    18→type ExitCodeError struct {\n    19→\tCode    int\n    20→\tMessage string\n    21→}\n    22→\n    23→func (e *ExitCodeError) Error() string { return e.Message }\n    24→\n    25→func init() {\n    26→\tFlowCmd.AddCommand(NewFlowTestCmd())\n    27→}\n    28→\n    29→// NewFlowTestCmd creates the `tlc flow test` subcommand.\n    30→func NewFlowTestCmd() *cobra.Command {\n    31→\tvar (\n    32→\t\trecord      bool\n    33→\t\tpassthrough []string\n    34→\t\tkeepSandbox bool\n    35→\t\tsteps       []string\n    36→\t)\n    37→\n    38→\tcmd := &cobra.Command{\n    39→\t\tUse:   \"test <flow-file> [run-name]\",\n    40→\t\tShort: \"Run deterministic e2e tests against a flow definition\",\n    41→\t\tLong: `Run a flow definition through a hermetic sandbox.\n    42→\n    43→In replay mode (default), each tool call is served from a recorded cassette.\n    44→In record mode (--record), tool calls are proxied to real binaries and cassettes\n    45→are written for future replay runs.\n    46→\n    47→Exit codes:\n    48→  0  All steps executed; all contracts passed\n    49→  1  Step failed or contract violated\n    50→  2  Cassette miss in replay mode\n    51→  3  Sandbox setup failure`,\n    52→\t\tArgs: cobra.RangeArgs(1, 2),\n    53→\t\tRunE: func(cmd *cobra.Command, args []string) error {\n    54→\t\t\tflowFile := args[0]\n    55→\t\t\trunName := \"\"\n    56→\t\t\tif len(args) == 2 {\n    57→\t\t\t\trunName = args[1]\n    58→\t\t\t}\n    59→\t\t\treturn runFlowTest(cmd, flowFile, runName, record, passthrough, keepSandbox, steps)\n    60→\t\t},\n    61→\t}\n    62→\n    63→\tcmd.Flags().BoolVar(&record, \"record\", false,\n    64→\t\t\"Run against real infra; write/update cassettes\")\n    65→\tcmd.Flags().StringArrayVar(&passthrough, \"passthrough\", nil,\n    66→\t\t\"Force live execution for named tools (repeatable or comma-separated)\")\n    67→\tcmd.Flags().BoolVar(&keepSandbox, \"keep-sandbox\", false,\n    68→\t\t\"Retain tmp dir after run (for debugging)\")\n    69→\tcmd.Flags().StringSliceVar(&steps, \"steps\", nil,\n    70→\t\t\"Run only the named steps (comma-separated)\")\n    71→\n    72→\treturn cmd\n    73→}\n    74→\n    75→func runFlowTest(\n    76→\tcmd *cobra.Command,\n    77→\tflowFile, runName string,\n    78→\trecord bool,\n    79→\tcliPassthrough []string,\n    80→\tkeepSandbox bool,\n    81→\t_ []string, // steps filter — reserved for future use\n    82→) error {\n    83→\t// Determine mode.\n    84→\tmode := xrr.ModeReplay\n    85→\tif record {\n    86→\t\tmode = xrr.ModeRecord\n    87→\t}\n    88→\n    89→\t// Flatten comma-separated passthrough values.\n    90→\tvar passthroughFlat []string\n    91→\tfor _, pt := range cliPassthrough {\n    92→\t\tfor _, s := range strings.Split(pt, \",\") {\n    93→\t\t\ts = strings.TrimSpace(s)\n    94→\t\t\tif s != \"\" {\n    95→\t\t\t\tpassthroughFlat = append(passthroughFlat, s)\n    96→\t\t\t}\n    97→\t\t}\n    98→\t}\n    99→\n   100→\t// Resolve flow file.\n   101→\ts, err := getStorage()\n   102→\tif err != nil {\n   103→\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: storage: %v\", err)}\n   104→\t}\n   105→\tdefer func() { _ = s.Close() }()\n   106→\n   107→\tctx := context.Background()\n   108→\tres, err := uri.NewResolver(s).ResolveFlow(ctx, flowFile)\n   109→\tif err != nil {\n   110→\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: resolve flow: %v\", err)}\n   111→\t}\n   112→\tflow := res.Flow\n   113→\n   114→\t// Derive flow name from file path for fixture lookup.\n   115→\t// DiscoverRuns resolves fixtures/<flowName>/ from flowBaseDir.\n   116→\t// Use abs path so cassette dirs passed via env to shims are absolute.\n   117→\tflowName := flowFileBaseName(flowFile)\n   118→\tflowBaseDir, err := filepath.Abs(filepath.Dir(flowFile))\n   119→\tif err != nil {\n   120→\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: abs path: %v\", err)}\n   121→\t}\n   122→\n   123→\t// Discover runs.\n   124→\tvar discoverOpts []flowtest.Option\n   125→\tif runName != \"\" {\n   126→\t\tdiscoverOpts = append(discoverOpts, flowtest.WithRunName(runName))\n   127→\t}\n   128→\truns, err := flowtest.DiscoverRuns(flowName, flowBaseDir, discoverOpts...)\n   129→\tif err != nil {\n   130→\t\treturn &ExitCodeError{Code: 3, Message: fmt.Sprintf(\"flow test: discover runs: %v\", err)}\n   131→\t}\n   132→\n   133→\tif len(runs) == 0 {\n   134→\t\t_, _ = fmt.Fprintf(cmd.OutOrStdout(),\n   135→\t\t\t\"flow test: no runs found in %s/fixtures/%s\\n\", flowBaseDir, flowName)\n   136→\t\treturn nil\n   137→\t}\n   138→\n   139→\t// Run each discovered test run.\n   140→\toverallFail := false\n   141→\tfor _, run := range runs {\n   142→\t\texitCode, err := executeRun(ctx, cmd, flow, s, run, mode, passthroughFlat, keepSandbox)\n   143→\t\tif err != nil {\n   144→\t\t\t_, _ = fmt.Fprintf(cmd.ErrOrStderr(), \"  run %q: %v\\n\", run.Name, err)\n   145→\t\t}\n   146→\t\tif exitCode != 0 {\n   147→\t\t\toverallFail = true\n   148→\t\t}\n   149→\t}\n   150→\n   151→\tif overallFail {\n   152→\t\treturn &ExitCodeError{Code: 1, Message: \"flow test: one or more runs failed\"}\n   153→\t}\n   154→\treturn nil\n   155→}\n   156→\n   157→func executeRun(\n   158→\tctx context.Context,\n   159→\tcmd *cobra.Command,\n   160→\tflow *core.Flow,\n   161→\ts interface {\n   162→\t\tcore.Repository\n   163→\t\tcore.LogRepository\n   164→\t},\n   165→\trun flowtest.Run,\n   166→\tmode xrr.Mode,\n   167→\tcliPassthrough []string,\n   168→\tkeepSandbox bool,\n   169→) (int, error) {\n   170→\t_, _ = fmt.Fprintf(cmd.OutOrStdout(), \"\\nrun: %s\\n\", run.Name)\n   171→\n   172→\t// Merge CLI passthrough with manifest passthrough.\n   173→\tmergedPassthrough := flowtest.MergePassthrough(cliPassthrough, run.Passthrough)\n   174→\n   175→\t// Create sandbox.\n   176→\tcwd, err := os.Getwd()\n   177→\tif err != nil {\n   178→\t\treturn 3, fmt.Errorf(\"getwd: %w\", err)\n   179→\t}\n   180→\tsb, err := flowtest.NewSandbox(cwd)\n   181→\tif err != nil {\n   182→\t\treturn 3, fmt.Errorf(\"sandbox: %w\", err)\n   183→\t}\n   184→\tsb.Keep = keepSandbox\n   185→\tdefer sb.Teardown()\n   186→\n   187→\t// Extract shim binaries.\n   188→\tif err := sb.ExtractShims(); err != nil {\n   189→\t\treturn 3, fmt.Errorf(\"extract shims: %w\", err)\n   190→\t}\n   191→\n   192→\t// Build run descriptor with merged passthrough for env injection.\n   193→\trunWithPassthrough := run\n   194→\trunWithPassthrough.Passthrough = mergedPassthrough\n   195→\n   196→\t// Inject sandbox env into current process for subprocesses spawned by executor.\n   197→\t// Build env — stored on sandbox for use when executor eventually spawns agents.\n   198→\t// We inject the most critical vars into the process environment here so that\n   199→\t// any subprocess the executor spawns (e.g., git calls in tests) picks them up.\n   200→\tsandboxEnv := sb.Env(\"\", mode, &runWithPassthrough)\n   201→\tfor _, kv := range sandboxEnv {\n   202→\t\tidx := strings.IndexByte(kv, '=')\n   203→\t\tif idx < 0 {\n   204→\t\t\tcontinue\n   205→\t\t}\n   206→\t\tkey := kv[:idx]\n   207→\t\t// Don't override HOME in the process env — it breaks keychain auth for\n   208→\t\t// subprocesses
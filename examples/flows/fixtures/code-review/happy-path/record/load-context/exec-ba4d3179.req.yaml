        {"parentUuid":"706d66da-497b-4204-bff0-dc104b0fcb39","isSidechain":true,"promptId":"b8eb8f3e-e3e3-4483-be5c-c8b0b045e2ba","agentId":"a64ad2f60fecf2ca1","type":"user","message":{"role":"user","content":[{"tool_use_id":"toolu_01UZWQW2HfAdTqDXYwafZZMd","type":"tool_result","content":"   300→+\n   301→+```\n   302→+tmp/\n   303→+  tlc-flow-test-<uuid>/\n   304→+    repo/      ← git clone --local <cwd>\n   305→+    home/      ← fake $HOME\n   306→+    bin/       ← extracted shim binaries + catch-all shim\n   307→+    cassettes/ ← symlink to fixtures/<flow-name>/<run-name>/record/\n   308→+```\n   309→+\n   310→+Every step subprocess inherits:\n   311→+\n   312→+```\n   313→+HOME                       = .../home\n   314→+GIT_DIR                    = .../repo/.git\n   315→+GIT_WORK_TREE              = .../repo\n   316→+GH_CONFIG_DIR              = .../home/.config/gh\n   317→+TLC_FLOW_TEST_MODE         = record|replay\n   318→+TLC_FLOW_TEST_STEP         = <step-id>\n   319→+TLC_FLOW_TEST_CASSETTE_DIR = .../cassettes/\n   320→+TLC_FLOW_TEST_PASSTHROUGH  = wrangler,docker   ← merged from flag + manifest\n   321→+```\n   322→+\n   323→+Nothing the step does can affect the caller's working tree, home\n   324→+directory, or git state.\n   325→+\n   326→+### Shims\n   327→+\n   328→+Shim binaries are embedded in `tlc` via `go:embed`, extracted to\n   329→+`sandbox/bin/` at test-start, and prepended to `$PATH`.\n   330→+\n   331→+**`git` shim** — always isolated, never cassettted:\n   332→+\n   333→+```\n   334→+rewrite GIT_DIR/GIT_WORK_TREE to sandbox paths → exec real git\n   335→+```\n   336→+\n   337→+All git operations execute for real against the sandbox repo.\n   338→+\n   339→+**`gh`, `claude`, `codex` shims** — named shims with cassette protocol:\n   340→+\n   341→+```\n   342→+record / passthrough: proxy to real binary → write/update cassette\n   343→+replay:               fingerprint argv+stdin → serve cassette response\n   344→+miss:                 exit 2; halt flow\n   345→+```\n   346→+\n   347→+**Catch-all shim** — covers every other binary:\n   348→+\n   349→+```\n   350→+check TLC_FLOW_TEST_PASSTHROUGH → passthrough path if listed\n   351→+check cassette dir → serve if found\n   352→+else → exit 2 (TLC_SHIM_MISS)\n   353→+```\n   354→+\n   355→+The catch-all is installed as `$PATH/tlc-shim-catchall` and symlinked\n   356→+to every name not already claimed by a named shim. On macOS/Linux this\n   357→+is done via a single wrapper script at sandbox setup time.\n   358→+\n   359→+### Fingerprint\n   360→+\n   361→+Each cassette filename encodes a short SHA256 of `argv + stdin`:\n   362→+\n   363→+```\n   364→+<tool>-<sha256[:8]>.{req,resp}.<ext>\n   365→+```\n   366→+\n   367→+Same argv + same stdin → same fingerprint → deterministic cassette\n   368→+lookup across replay runs. Different invocations of the same tool in\n   369→+the same step get distinct cassette files.\n   370→+\n   371→+### Eva contract wiring\n   372→+\n   373→+After each step, `FlowExecutor` runs a post-step hook (test mode only):\n   374→+\n   375→+1. Step writes output to `tmp/.../step-<id>.output.json`.\n   376→+2. Hook looks up `contracts/<step-id>.yaml` in the run dir.\n   377→+3. If contract exists: `eva run --dataset <output> --contract <file>`.\n   378→+4. Eva exit 0 → next step. Exit 1 → `FlowStatusFailed`; surface\n   379→+   violated rule name and offending value.\n   380→+5. No contract → continue silently.\n   381→+\n   382→+Eva contracts are plain YAML, reusable across `flow test` and the\n   383→+`-validated.yaml` gateway flows.\n   384→+\n   385→+### End-to-end sequence\n   386→+\n   387→+```\n   388→+tlc flow test pr-review-loop.yaml happy-path --passthrough wrangler\n   389→+  │\n   390→+  ▼\n   391→+FlowTestCmd\n   392→+  resolve run: fixtures/pr-review-loop/happy-path/\n   393→+  load manifest (if present); merge --passthrough flag\n   394→+  create sandbox (tmp/tlc-flow-test-<uuid>/)\n   395→+  git clone --local → sandbox/repo/\n   396→+  extract shims + catch-all → sandbox/bin/\n   397→+  inject env vars\n   398→+  │\n   399→+  ▼\n   400→+FlowExecutor.Execute()          ← same code as `tlc flow run`\n   401→+  for each step (dep order):\n   402→+    inject TLC_FLOW_TEST_STEP=<step-id>\n   403→+    run subprocess (shimmed PATH + sandbox env)\n   404→+      git calls     → git shim     → sandbox/repo/ (always real, isolated)\n   405→+      gh calls      → gh shim      → cassette or passthrough\n   406→+      LLM calls     → llm shim     → cassette or passthrough\n   407→+      wrangler call → catch-all    → passthrough (in TLC_FLOW_TEST_PASSTHROUGH)\n   408→+      docker call   → catch-all    → cassette lookup → miss → exit 2\n   409→+    step output → tmp/step-<id>.output.json\n   410→+    post-step hook → eva contract (if exists)\n   411→+    pass → next step\n   412→+    fail → FlowStatusFailed\n   413→+  │\n   414→+  ▼\n   415→+FlowTestCmd teardown\n   416→+  print step table (pass/fail/skipped + tool mode used)\n   417→+  assert expected_exit (from manifest) against actual exit\n   418→+  rm -rf sandbox (unless --keep-sandbox)\n   419→+  exit 0|1|2|3\n   420→+```\n   421→+\n   422→+### What stays unchanged\n   423→+\n   424→+- `flow.yaml` — never modified\n   425→+- `FlowExecutor` core logic — same code path as `tlc flow run`\n   426→+- Eva contracts — same format as `-validated.yaml` gateway flows\n   427→+\n   428→+### Net-new code\n   429→+\n   430→+| Path | Purpose |\n   431→+|------|---------|\n   432→+| `internal/flowtest/shim.go` | Cassette I/O, fingerprint, env protocol, tool routing |\n   433→+| `internal/flowtest/recorder.go` | Record/passthrough: proxy + write cassette |\n   434→+| `internal/flowtest/replayer.go` | Replay: fingerprint → serve cassette |\n   435→+| `internal/flowtest/catchall.go` | Catch-all shim: block unknown tools |\n   436→+| `internal/flowtest/sandbox.go` | Tmp dir, clone, shim extract, teardown |\n   437→+| `internal/flowtest/run.go` | Named run resolution: dir convention + manifest merge |\n   438→+| `internal/flowtest/shims/gh/main.go` | gh shim |\n   439→+| `internal/flowtest/shims/git/main.go` | git shim |\n   440→+| `internal/flowtest/shims/claude/main.go` | LLM shim |\n   441→+| `internal/flowtest/shims/codex/main.go` | LLM shim |\n   442→+| `internal/flowtest/hook.go` | Post-step eva runner |\n   443→+| `internal/cli/flow_test_cmd.go` | Cobra subcommand |\n   444→+| `examples/flows/fixtures/*/happy-path/contracts/*.yaml` | Eva contracts |\n   445→diff --git a/docs/plans/2026-04-02-flow-test-subcommand-v2.md b/docs/plans/2026-04-02-flow-test-subcommand-v2.md\n   446→new file mode 100644\n   447→index 0000000..f361905\n   448→--- /dev/null\n   449→+++ b/docs/plans/2026-04-02-flow-test-subcommand-v2.md\n   450→@@ -0,0 +1,865 @@\n   451→+# Flow Test Subcommand v2 Implementation Plan\n   452→+\n   453→+> **For Claude:** REQUIRED SUB-SKILL: Use superpowers:executing-plans to implement this\n   454→+> plan task-by-task.\n   455→+\n   456→+**Goal:** Add `tlc flow test <flow-file> [run-name]` — deterministic e2e testing for\n   457→+flow definitions — backed by `hop.top/xrr` for all cassette I/O, fingerprinting, and\n   458→+adapter protocol.\n   459→+\n   460→+**Architecture:** `FlowTestCmd` wraps `FlowExecutor` unchanged. A hermetic sandbox\n   461→+(tmp dir + git clone + shimmed PATH) intercepts every subprocess call. Each shim binary\n   462→+is a thin `xrr` client: record mode proxies to the real binary and writes a cassette;\n   463→+replay mode serves the cassette. The catch-all shim handles any unrecognised binary.\n   464→+Eva contracts run as a post-step hook after each step.\n   465→+\n   466→+**Tech Stack:** Go 1.24 · `hop.top/xrr` (exec adapter) · `go:embed` for shim binaries\n   467→+· Cobra · eva CLI\n   468→+\n   469→+---\n   470→+\n   471→+## What changed from v1\n   472→+\n   473→+`hop.top/xrr` already ships:\n   474→+- `xrr.FileCassette` — cassette read/write with YAML envelope\n   475→+- `xrr.FileSession` — record / replay / passthrough dispatch\n   476→+- `xrr.ErrCassetteMiss` — canonical miss sentinel\n   477→+- `adapters/exec` — argv+stdin fingerprint, Request/Response types\n   478→+\n   479→+**Deleted from scope** (xrr owns these now):\n   480→+- ~~`internal/flowtest/shim.go`~~ — cassette I/O + fingerprint → `xrr.FileCassette` +\n   481→+  `adapters/exec`\n   482→+- ~~`internal/flowtest/recorder.go`~~ → `xrr.ModeRecord` in each shim binary\n   483→+- ~~`internal/flowtest/replayer.go`~~ → `xrr.ModeReplay` in each shim binary\n   484→+- ~~`internal/flowtest/catchall.go`~~ (partially) → xrr session miss path\n   485→+\n   486→+**Remaining net-new code** (all in `internal/flowtest/`):\n   487→+\n   488→+| File | Purpose |\n   489→+|------|---------|\n   490→+| `sandbox.go` | Tmp dir, git clone, shim extraction, env injection, teardown |\n   491→+| `run.go` | Named run resolution: dir convention + manifest merge |\n   492→+| `hook.go` | Post-step eva contract runner |\n   493→+| `shims/gh/main.go` | gh — thin xrr exec client |\n   494→+| `shims/git/main.go` | git — rewrites GIT_DIR/WORK_TREE; no cassette |\n   495→+| `shims/claude/main.go` | LLM shims (one dir each): claude, codex, gemini, |\n   496→+| `shims/copilot/main.go` | copilot, opencode, fabric, llm |\n   497→+| `shims/npm/main.go` | Package manager shims: npm, npx, uv, pip, composer |\n   498→+| `shims/docker/main.go` | Container shims: docker, docker-compose |\n   499→+| `shims/catchall/main.go` | wildcard — xrr miss → exit 2 |\n   500→+| `../cli/flow_test_cmd.go` | Cobra subcommand wired into FlowCmd |\n   501→+| `examples/flows/fixtures/*/contracts/*.yaml` | Eva contracts |\n   502→+\n   503→+### Tool routing summary\n   504→+\n   505→+| Category | Tools | Treatment |\n   506→+|----------|-------|-----------|\n   507→+| Git | `git` | Real exec, sandbox GIT_DIR rewrite, no cassette |\n   508→+| VCS host | `gh` | Named shim, cassette-backed |\n   509→+| LLM CLIs | `claude` `codex` `gemini` `copilot` `opencode` `fabric` `llm` | Named shim, cassette-backed |\n   510→+| Node pkg | `npm` `npx` | Named shim, cassette-backed |\n   511→+| Python pkg | `uv` `pip` | Named shim, cassette-backed |\n   512→+| PHP pkg | `composer` | Named shim, cassette-backed |\n   513→+| Containers | `docker` `docker-compose` | Named shim, cassette-backed |\n   514→+| Local runtimes | `node` `vite` `next` | Passthrough-always (no cassette) |\n   515→+| POSIX utils | `ls` `cat` `head` `tail` `wc` `grep` `pwd` `cp` `mkdir` `chmod` `ps` `lsof` `sleep` | Passthrough-always (no cassette) |\n   516→+| Everything else | `wrangler` `cargo` `just` … | Catch-all → xrr miss → exit 2 |\n   517→+\n   518→+---\n   519→+\n   520→+## CLI surface\n   521→+\n   522→+```\n   523→+tlc flow test <flow-file> [run-name] [flags]\n   524→+\n   525→+  --record                 run against real infra; write/update cassettes\n   526→+  --passthrough <tool,...> force live execution; repeatable or comma-sep\n   527→+  --keep-sandbox           retain tmp dir after run (debugging)\n   528→+  --steps <a,b>            run only named steps\n   529→+```\n   530→+\n   531→+Exit codes: `0` pass · `1` step/contract fail · `2` cassette miss · `3` sandbox fail\n   532→+\n   533→+---\n   534→+\n   535→+## Cassette layout\n   536→+\n   537→+```\n   538→+examples/flows/\n   539→+  pr-review-loop.yaml\n   540→+  fixtures/\n   541→+    pr-review-loop/\n   542→+      happy-path/\n   543→+        record/\n   544→+          step-load-pr-context/\n   545→+            exec-<fp>.req.yaml          ← xrr FileCassette format\n   546→+            exec-<fp>.resp.yaml\n   547→+          step-reviewer-pass/\n   548→+            exec-<fp>.req.yaml\n   549→+            exec-<fp>.resp.yaml\n   550→+        contracts/\n   551→+          step-reviewer-pass.yaml\n   552→+          step-check-approval.yaml\n   553→+      max-iterations/\n   554→+        record/  ...\n   555→+        test.yaml\n   556→+```\n   557→+\n   558→+The `record/` subdir is passed directly to `xrr.NewFileCassette(dir)`. No custom\n   559→+file format; cassettes are readable by any xrr language port.\n   560→+\n   561→+---\n   562→+\n   563→+## Env protocol (injected per step subprocess)\n   564→+\n   565→+```\n   566→+HOME                       = .../home\n   567→+GIT_DIR                    = .../repo/.git\n   568→+GIT_WORK_TREE              = .../repo\n   569→+GH_CONFIG_DIR              = .../home/.config/gh\n   570→+TLC_FLOW_TEST_MODE         = record|replay\n   571→+TLC_FLOW_TEST_STEP         = <step-id>\n   572→+TLC_FLOW_TEST_CASSETTE_DIR = .../record/<step-id>/\n   573→+TLC_FLOW_TEST_PASSTHROUGH  = wrangler,docker\n   574→+```\n   575→+\n   576→+Each shim binary reads these env vars; no flags needed.\n   577→+\n   578→+---\n   579→+\n   580→+## Shim binary pattern (gh / claude / codex)\n   581→+\n   582→+Every named shim follows this template:\n   583→+\n   584→+```go\n   585→+func main() {\n   586→+    mode  := xrr.Mode(os.Getenv(\"TLC_FLOW_TEST_MODE\"))\n   587→+    dir   := os.Getenv(\"TLC_FLOW_TEST_CASSETTE_DIR\")\n   588→+    pass  := strings.Split(os.Getenv(\"TLC_FLOW_TEST_PASSTHROUGH\"), \",\")\n   589→+\n   590→+    // override mode to passthrough if this binary is in the passthrough list\n   591→+    self  := filepath.Base(os.Args[0])\n   592→+    if slices.Contains(pass, self) {\n   593→+        mode = xrr.ModePassthrough\n   594→+    }\n   595→+\n   596→+    c := xrr.NewFileCassette(dir)\n   597→+    s := xrr.NewSession(mode, c)\n   598→+\n   599→+    req := &execadapter.Request{Argv: os.Args[1:], Stdin: readStdin()}\n   600→+    resp, err := s.Record(context.Background(), execadapter.NewAdapter(), req,\n   601→+        func() (xrr.Response, error) {\n   602→+            return runReal(os.Args[0], os.Args[1:]) // exec real binary\n   603→+        })\n   604→+    if errors.Is(err, xrr.ErrCassetteMiss) {\n   605→+        fmt.Fprintf(os.Stderr, \"xrr: cassette miss: %v\\n\", os.Args)\n   606→+        os.Exit(2)\n   607→+    }\n   608→+    // write captured stdout/stderr, exit with recorded exit code\n   609→+    emit(resp)\n   610→+}\n   611→+```\n   612→+\n   613→+---\n   614→+\n   615→+## Task 1: Add `hop.top/xrr` dependency\n   616→+\n   617→+**Files:**\n   618→+- Modify: `go.mod`, `go.sum`\n   619→+\n   620→+**Step 1: Add dependency**\n   621→+\n   622→+```bash\n   623→+cd /path/to/tlc/hops/main\n   624→+go get hop.top/xrr@latest\n   625→+```\n   626→+\n   627→+**Step 2: Verify**\n   628→+\n   629→+```bash\n   630→+go build ./...\n   631→+# Expected: clean\n   632→+```\n   633→+\n   634→+**Step 3: Commit**\n   635→+\n   636→+```bash\n   637→+git add go.mod go.sum\n   638→+git commit -m \"build: add hop.top/xrr dependency\"\n   639→+```\n   640→+\n   641→+---\n   642→+\n   643→+## Task 2: `internal/flowtest/run.go` — named run resolution\n   644→+\n   645→+**Files:**\n   646→+- Create: `internal/flowtest/run.go`\n   647→+- Create: `internal/flowtest/run_test.go`\n   648→+\n   649→+**Step 1: Write failing tests**\n   650→+\n   651→+```go\n   652→+func TestRunResolutionByDirName(t *testing.T) {\n   653→+    // fixtures/pr-review-loop/happy-path/ exists, no manifest\n   654→+    dir := setupFixtureDir(t, \"pr-review-loop\", \"happy-path\", nil)\n   655→+    runs, err := flowtest.DiscoverRuns(\"pr-review-loop\", dir)\n   656→+    require.NoError(t, err)\n   657→+    require.Len(t, runs, 1)\n   658→+    assert.Equal(t, \"happy-path\", runs[0].Name)\n   659→+    assert.Equal(t, 0, runs[0].ExpectedExit)\n   660→+    assert.Empty(t, runs[0].Passthrough)\n   661→+}\n   662→+\n   663→+func TestRunResolutionWithManifest(t *testing.T) {\n   664→+    manifest := `\n   665→+expected_exit: 1\n   666→+passthrough: [docker]\n   667→+description: hits max_iterations cap\n   668→+`\n   669→+    dir := setupFixtureDir(t, \"pr-review-loop\", \"max-iterations\",\n   670→+        []byte(manifest))\n   671→+    runs, err := flowtest.DiscoverRuns(\"pr-review-loop\", dir)\n   672→+    require.NoError(t, er
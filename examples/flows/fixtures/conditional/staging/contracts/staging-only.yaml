# Rewrote from step_status (never landed in eva) — 2026-04-27.
# Track: hop-top/eva#flow-exec-evaluators T-0257.
#
# Original used `step_status` evaluator to assert step terminal states
# (SUCCEEDED / SKIPPED). That evaluator was never implemented in eva.
# Until eva ships `status_code` (T-0257) we assert against the joined
# step output blob using `contains` — which IS implemented today.
#
# Convention used by the flow runner: when a step ends, its terminal
# state is appended to the join output as a line of the form
# `<step_id>: <STATE>` (e.g. `deploy-staging: SUCCEEDED`).
name: staging_steps_only
provider: filesystem
evaluators:
  - name: contains
    substring: "deploy-staging: SUCCEEDED"
    mode: binary
  - name: contains
    substring: "verify-staging: SUCCEEDED"
    mode: binary
  - name: contains
    substring: "deploy-production: SKIPPED"
    mode: binary
  - name: contains
    substring: "verify-production: SKIPPED"
    mode: binary

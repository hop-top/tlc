flow_id: "flow:dry-run-test:1.0"
name: "Dry Run Test Flow"
version: "1.0"
description: "4-step flow for dry-run e2e tests"
entry_step: "gather"
agent: "claude"

steps:
  gather:
    step_id: "gather"
    type: "task"
    title: "Gather requirements"
    task_template:
      title: "Collect project requirements"

  design:
    step_id: "design"
    type: "task"
    title: "Create design"
    depends_on: ["gather"]
    task_template:
      title: "Draft architecture design"

  implement:
    step_id: "implement"
    type: "task"
    title: "Implement solution"
    depends_on: ["design"]
    agent: "codex"
    task_template:
      title: "Write implementation code"

  verify:
    step_id: "verify"
    type: "task"
    title: "Verify results"
    depends_on: ["implement"]
    task_template:
      title: "Run tests and verify"

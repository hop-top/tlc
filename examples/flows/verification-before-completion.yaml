flow_id: "flow:verification-before-completion:1.0"
name: "Verification Before Completion"
version: "1.0"
description: "Evidence before assertions - verify work is actually complete"
entry_step: "identify-claims"

config:
  category: "quality-assurance"
  triggers:
    - "claiming work complete"
    - "before commit"
    - "before PR"
    - "saying tests pass"
    - "claiming bug fixed"

  procedure: |
    ## The Iron Law of Completion

    **EVIDENCE BEFORE ASSERTIONS, ALWAYS.**

    Never claim:
    - "It's complete"
    - "Tests pass"
    - "Bug is fixed"
    - "Ready to merge"

    ...without running verification commands and showing output.

    ## The Verification Protocol

    ### Phase 1: Identify Claims

    1. **What are you claiming?**
       - Feature complete?
       - Tests passing?
       - Bug fixed?
       - Ready for production?

    ### Phase 2: Define Verification

    2. **How would you prove it?**
       - What commands verify this claim?
       - What output proves success?
       - What could prove it wrong?

    ### Phase 3: Run Verification

    3. **Execute verification commands**
       - Run the actual commands
       - Capture full output
       - Don't summarize or paraphrase

    4. **Examine output carefully**
       - All tests actually passed?
       - Any warnings or errors?
       - Expected behavior confirmed?

    ### Phase 4: Make Evidence-Based Claims

    5. **Only then make claims**
       - Base claims on actual output
       - Quote specific evidence
       - Be precise about what was verified

    ## Common Verification Commands

    ### Tests
    ```bash
    # Run all tests
    npm test
    go test ./...
    pytest
    cargo test

    # Run specific test
    npm test -- path/to/test
    go test -run TestName
    pytest tests/test_file.py::test_name
    ```

    ### Build
    ```bash
    # Verify build works
    npm run build
    go build ./...
    cargo build
    make build
    ```

    ### Linting
    ```bash
    # Check code quality
    npm run lint
    golangci-lint run
    pylint src/
    cargo clippy
    ```

    ### Type Checking
    ```bash
    # Verify types
    tsc --noEmit
    mypy src/
    flow check
    ```

    ### Integration
    ```bash
    # Verify integration
    docker-compose up
    make integration-test
    npm run test:e2e
    ```

    ## Red Flags

    Phrases that require verification:
    - "Tests pass" → run tests, show output
    - "Build works" → run build, show output
    - "Bug is fixed" → run repro steps, show it's fixed
    - "Feature complete" → run manual/automated verification
    - "Ready to deploy" → run deployment checks
    - "No errors" → show command output proving it

    ## The Rule

    If you haven't run the command and seen the output, you don't know.

steps:
  identify-claims:
    step_id: "identify-claims"
    type: "task"
    title: "Identify what you're claiming"
    task_template:
      title: "List claims that need verification"
      description: |
        What are you about to claim or have claimed?

        Common claims:
        - "Implementation is complete"
        - "All tests pass"
        - "Bug is fixed"
        - "Feature works as expected"
        - "No build errors"
        - "Code quality checks pass"
        - "Ready for review/merge"

        List each claim explicitly.
      requirements:
        capabilities: ["verification", "critical-thinking"]

  define-verification:
    step_id: "define-verification"
    type: "task"
    title: "Define how to verify each claim"
    depends_on: ["identify-claims"]
    task_template:
      title: "Map claims to verification commands"
      description: |
        For each claim, define verification:

        Claim: "All tests pass"
        → Verification: Run `npm test` or `go test ./...`
        → Success criteria: Exit code 0, all tests green

        Claim: "Bug is fixed"
        → Verification: Run reproduction steps
        → Success criteria: Bug no longer occurs

        Claim: "Feature complete"
        → Verification: Run feature manually or via test
        → Success criteria: Feature works as specified

        Create a verification plan with specific commands.
      requirements:
        capabilities: ["verification", "testing"]

  run-verification:
    step_id: "run-verification"
    type: "task"
    title: "Execute verification commands"
    depends_on: ["define-verification"]
    task_template:
      title: "Run commands and capture output"
      description: |
        For each verification command:

        1. Run the ACTUAL command
           - Don't simulate or assume
           - Use exact command from verification plan

        2. Capture FULL output
           - Don't summarize
           - Don't paraphrase
           - Include all output

        3. Check exit code
           - 0 = success
           - Non-zero = failure

        Example:
        ```bash
        $ npm test
        > test
        > jest

        PASS  src/utils.test.js
          ✓ adds two numbers (2 ms)
          ✓ handles negative numbers (1 ms)

        Test Suites: 1 passed, 1 total
        Tests:       2 passed, 2 total
        ```

        Run ALL verification commands now.
      requirements:
        capabilities: ["verification", "command-execution"]
        tools: ["test-framework", "compiler", "linter"]

  examine-output:
    step_id: "examine-output"
    type: "task"
    title: "Examine output carefully"
    depends_on: ["run-verification"]
    task_template:
      title: "Analyze verification results"
      description: |
        Review output from each command:

        Questions to ask:
        - Did command succeed (exit code 0)?
        - All tests actually passed?
        - Any warnings in output?
        - Any unexpected messages?
        - Any skipped tests?
        - Any flaky behavior?

        For tests specifically:
        - Count: X passed, Y total
        - Duration reasonable?
        - No test failures?
        - No test errors?

        Flag any concerns found.
      requirements:
        capabilities: ["verification", "analysis"]

  make-evidence-based-claims:
    step_id: "make-evidence-based-claims"
    type: "task"
    title: "Make evidence-based claims"
    depends_on: ["examine-output"]
    task_template:
      title: "State conclusions with evidence"
      description: |
        Now that you have evidence, make claims:

        BAD:
        - "Tests pass" (no evidence)
        - "It works" (vague)
        - "Everything's good" (unsupported)

        GOOD:
        - "All 47 tests pass (ran `npm test`, output shows 47/47 passed)"
        - "Build succeeds with no errors (ran `go build ./...`, exit code 0)"
        - "Bug no longer reproduces (ran steps from issue #123, no error)"

        Format:
        Claim: [assertion]
        Evidence: [command run] → [specific output]

        Only make claims you can back with evidence.
      requirements:
        capabilities: ["technical-writing", "verification"]

  pre-commit-checklist:
    step_id: "pre-commit-checklist"
    type: "task"
    title: "Pre-commit verification checklist"
    depends_on: ["make-evidence-based-claims"]
    task_template:
      title: "Final verification before commit"
      description: |
        Before committing, verify:

        Build:
        - [ ] Code builds successfully
        - [ ] No compilation errors
        - Command: [your build command]

        Tests:
        - [ ] All tests pass
        - [ ] No skipped tests (or skips are intentional)
        - [ ] Test count matches expectations
        - Command: [your test command]

        Quality:
        - [ ] Linter passes (or warnings acceptable)
        - [ ] Type checker passes (if applicable)
        - Commands: [linter/type checker commands]

        Functionality:
        - [ ] Manual verification if needed
        - [ ] Feature works as intended
        - [ ] Bug no longer reproduces (if bug fix)

        Only commit when ALL items checked with evidence.
      requirements:
        capabilities: ["verification", "quality-assurance"]
        tools: ["git"]

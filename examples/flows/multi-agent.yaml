flow_id: "flow:multi-agent:1.0"
name: "Multi-Agent Workflow"
version: "1.0"
description: "3-step flow dispatching different agents per step"
entry_step: "plan"
agent: "claude"

steps:
  plan:
    step_id: "plan"
    type: "task"
    title: "Plan the approach"
    agent: "claude"
    task_template:
      title: "Create implementation plan"
      description: "Analyze requirements and produce a plan"
      requirements:
        capabilities: ["planning", "architecture-analysis"]

  implement:
    step_id: "implement"
    type: "task"
    title: "Write the code"
    depends_on: ["plan"]
    agent: "codex"
    task_template:
      title: "Implement the solution"
      description: "Write code following the plan"
      requirements:
        capabilities: ["code-generation", "testing"]
        tools: ["git", "make"]

  review:
    step_id: "review"
    type: "task"
    title: "Review the output"
    depends_on: ["implement"]
    agent: "gemini"
    task_template:
      title: "Review implementation"
      description: "Check code quality and correctness"
      requirements:
        capabilities: ["code-review", "quality-assurance"]

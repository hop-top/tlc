flow_id: "flow:oss-release-prep-validated:1.0"
name: "OSS Release Preparation (Validated)"
version: "1.0"
description: "Prepare a codebase for initial OSS release with eva contract gating"
entry_step: "audit-repo"

config:
  category: "release"
  triggers:
    - "initial OSS release"
    - "open-sourcing a project"
    - "preparing public repo"

  validation_strategy: |
    ## Validation Strategy

    ### eva (deterministic gating)
    Every phase that produces a file or a state transition is gated by an
    eva contract before the next phase can start.  Contracts live in
    evals/oss-release/ and cover:

    - oss-audit.yaml      — no HIGH findings in gitleaks report
    - oss-legal.yaml      — LICENSE + headers present and well-formed
    - oss-docs.yaml       — README, CONTRIBUTING, SECURITY meet structural spec
    - oss-community.yaml  — CoC, templates, CHANGELOG present
    - oss-cicd.yaml       — CI + release workflows parse as valid YAML
    - oss-release.yaml    — tag pushed, GitHub Release exists

    Each eva contract uses Tier 1 evaluators (zero LLM calls):
    - contains / regex — file presence, keyword, format checks
    - json_schema_valid  — YAML/JSON structure validation

    ### routellm (LLM cost routing)
    Three steps require generative LLM output:
    - write-readme         — high complexity; route to strong model
    - write-contributing   — medium complexity; route via mf router
    - write-security-policy — low complexity; route to weak model

    The routellm Controller is initialised once; each step passes its
    estimated complexity score as the routing hint.

  eva_contracts_dir: "evals/oss-release"
  routellm_config: "config/routellm.yaml"

steps:
  # ── Phase 1: Audit ──────────────────────────────────────────────────────────

  audit-repo:
    step_id: "audit-repo"
    type: "task"
    title: "Audit repo for secrets, private refs, and binary blobs"
    task_ref: "task:audit-repo"
    meta:
      tool: "gitleaks + git one-liner"
      commands: |
        gitleaks detect --source . --report-format json \
          --report-path gitleaks-report.json
        git rev-list --objects --all \
          | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
          | awk '/^blob/ && $3 > 1048576 { print $3, $4 }' | sort -rn | head -20
      guidance: |
        - Review gitleaks-report.json; block release on any HIGH findings
        - Inspect large-binary list; decide keep vs. remove each
        - Manually grep for internal hostnames, TODOs referencing internal systems

  gate-audit:
    step_id: "gate-audit"
    type: "task"
    title: "eva gate: audit findings must be zero HIGH"
    task_ref: "task:gate-audit"
    depends_on: ["audit-repo"]
    meta:
      tool: "eva"
      commands: |
        # Contract: evals/oss-release/oss-audit.yaml
        # Evaluator: regex — asserts gitleaks-report.json contains no HIGH findings
        eva run \
          --dataset evals/oss-release/oss-audit-dataset.yaml \
          --no-tui
        # exits 1 if any HIGH finding; flow cannot proceed until exit 0
      eva_contract: "evals/oss-release/oss-audit.yaml"
      eva_contract_body: |
        name: oss_audit_gate
        provider: gitleaks
        evaluators:
          - name: contains
            substring: '"Severity":"Info"'
            mode: warn
          - name: regex
            pattern: '"Severity":"(High|Critical)"'
            # presence of this pattern = FAIL; invert: wrap in no_pii-style plugin
            mode: binary
        # dataset sends gitleaks-report.json content as the "response"

  # ── Phase 2: Legal + Identity (parallel) ────────────────────────────────────

  legal-parallel:
    step_id: "legal-parallel"
    type: "parallel"
    title: "Legal and identity files"
    depends_on: ["gate-audit"]
    children: ["add-license", "add-copyright-headers", "add-codeowners"]
    max_concurrency: 3

  add-license:
    step_id: "add-license"
    type: "task"
    title: "Add LICENSE file"
    task_ref: "task:add-license"
    meta:
      tool: "gh CLI"
      commands: |
        gh repo edit --license "${LICENSE}"   # e.g. mit, apache-2.0
      guidance: |
        - Confirm SPDX identifier with owner before running (LLM decision)
        - Update go.mod/pyproject.toml/package.json license field

  add-copyright-headers:
    step_id: "add-copyright-headers"
    type: "task"
    title: "Add copyright/license headers to source files"
    task_ref: "task:add-copyright-headers"
    meta:
      tool: "addlicense"
      commands: |
        addlicense -check -l mit -c "<copyright holder>" \
          -ignore "vendor/**" -ignore "**/*.pb.go" -ignore "**/*.gen.*" .
        addlicense -l mit -c "<copyright holder>" \
          -ignore "vendor/**" -ignore "**/*.pb.go" -ignore "**/*.gen.*" .
        git add -A && git commit -m "chore: add license headers"

  add-codeowners:
    step_id: "add-codeowners"
    type: "task"
    title: "Add CODEOWNERS file"
    task_ref: "task:add-codeowners"
    meta:
      guidance: |
        - Create .github/CODEOWNERS mapping top-level dirs to maintainer handles
        - Add catch-all rule (*) pointing to core maintainers

  gate-legal:
    step_id: "gate-legal"
    type: "task"
    title: "eva gate: LICENSE, headers, and CODEOWNERS present"
    task_ref: "task:gate-legal"
    depends_on: ["legal-parallel"]
    meta:
      tool: "eva"
      commands: |
        eva run \
          --dataset evals/oss-release/oss-legal-dataset.yaml \
          --no-tui
      eva_contract: "evals/oss-release/oss-legal.yaml"
      eva_contract_body: |
        name: oss_legal_gate
        provider: filesystem
        evaluators:
          - name: contains
            substring: "MIT License"    # or Apache, GPL — adapt to project
            mode: binary
          - name: regex
            pattern: "SPDX-License-Identifier:"
            mode: binary
          - name: contains
            substring: "* @"            # CODEOWNERS entry
            mode: binary
        # dataset sends concatenated file contents as response

  # ── Phase 3: Core Documentation (parallel) ───────────────────────────────────

  core-docs-parallel:
    step_id: "core-docs-parallel"
    type: "parallel"
    title: "Core documentation"
    depends_on: ["gate-legal"]
    children: ["write-readme", "write-contributing", "write-security-policy"]
    max_concurrency: 3

  write-readme:
    step_id: "write-readme"
    type: "task"
    title: "Write README.md"
    task_ref: "task:write-readme"
    meta:
      routellm_hint: "strong"
      guidance: |
        Route to strong model — README is the project's public face;
        quality matters more than cost here.

        Required sections: project name + description, badges, motivation,
        quick-start, usage examples, config reference, roadmap, license pointer.

        routellm: model="router-mf-0.05"   # low threshold → almost always strong

  write-contributing:
    step_id: "write-contributing"
    type: "task"
    title: "Write CONTRIBUTING.md"
    task_ref: "task:write-contributing"
    meta:
      routellm_hint: "medium"
      guidance: |
        Route via default mf threshold — structural doc, medium quality bar.
        Sections: prerequisites, fork+clone+setup, running tests, commit
        convention, PR process, issue triage.

        routellm: model="router-mf-0.30"

  write-security-policy:
    step_id: "write-security-policy"
    type: "task"
    title: "Write SECURITY.md"
    task_ref: "task:write-security-policy"
    meta:
      routellm_hint: "weak"
      guidance: |
        Route to weak model — templated content; weak model is sufficient.
        Sections: supported versions table, responsible disclosure,
        contact channel, response timeline.

        routellm: model="router-mf-0.80"   # high threshold → almost always weak

  gate-core-docs:
    step_id: "gate-core-docs"
    type: "task"
    title: "eva gate: README, CONTRIBUTING, SECURITY meet structural spec"
    task_ref: "task:gate-core-docs"
    depends_on: ["core-docs-parallel"]
    meta:
      tool: "eva"
      commands: |
        eva run \
          --dataset evals/oss-release/oss-docs-dataset.yaml \
          --no-tui
      eva_contract: "evals/oss-release/oss-docs.yaml"
      eva_contract_body: |
        name: oss_docs_gate
        provider: filesystem
        evaluators:
          - name: contains
            substring: "## "          # at least one H2 section
            mode: binary
          - name: regex
            pattern: "^# .+"         # H1 title present
            mode: binary
          - name: contains
            substring: "```"          # at least one code block
            mode: binary
          - name: contains
            substring: "Supported Versions"
            mode: binary              # SECURITY.md check
        # dataset sends each file as a separate test case

  # ── Phase 4: Community Files (parallel) ─────────────────────────────────────

  community-parallel:
    step_id: "community-parallel"
    type: "parallel"
    title: "Community and governance files"
    depends_on: ["gate-core-docs"]
    children: ["add-issue-templates", "add-pr-template",
               "add-code-of-conduct", "init-changelog"]
    max_concurrency: 4

  add-issue-templates:
    step_id: "add-issue-templates"
    type: "task"
    title: "Add GitHub issue templates"
    task_ref: "task:add-issue-templates"
    meta:
      guidance: |
        Create .github/ISSUE_TEMPLATE/: bug_report.md, feature_request.md,
        blank.md. LLM fills in project-specific context.

  add-pr-template:
    step_id: "add-pr-template"
    type: "task"
    title: "Add pull request template"
    task_ref: "task:add-pr-template"
    meta:
      guidance: |
        Create .github/pull_request_template.md with summary, related issue,
        testing notes, and checklist.

  add-code-of-conduct:
    step_id: "add-code-of-conduct"
    type: "task"
    title: "Add CODE_OF_CONDUCT.md"
    task_ref: "task:add-code-of-conduct"
    meta:
      tool: "npx covgen"
      commands: |
        npx covgen "<contact-email>"
      guidance: |
        - No LLM content generation needed; covgen writes Contributor Covenant v2.1

  init-changelog:
    step_id: "init-changelog"
    type: "task"
    title: "Initialise CHANGELOG.md"
    task_ref: "task:init-changelog"
    meta:
      guidance: |
        Follow Keep a Changelog format. Add [Unreleased] section.
        Summarise notable changes since project inception.

  gate-community:
    step_id: "gate-community"
    type: "task"
    title: "eva gate: CoC, templates, and CHANGELOG present"
    task_ref: "task:gate-community"
    depends_on: ["community-parallel"]
    meta:
      tool: "eva"
      commands: |
        eva run \
          --dataset evals/oss-release/oss-community-dataset.yaml \
          --no-tui
      eva_contract: "evals/oss-release/oss-community.yaml"
      eva_contract_body: |
        name: oss_community_gate
        provider: filesystem
        evaluators:
          - name: contains
            substring: "Contributor Covenant"
            mode: binary
          - name: contains
            substring: "## [Unreleased]"
            mode: binary
          - name: regex
            pattern: "steps to reproduce"
            mode: binary              # bug_report template check
            case_sensitive: false
          - name: contains
            substring: "- [ ]"        # PR template checklist
            mode: binary

  # ── Phase 5: CI/CD (parallel) ────────────────────────────────────────────────

  cicd-parallel:
    step_id: "cicd-parallel"
    type: "parallel"
    title: "CI/CD pipelines and automation"
    depends_on: ["gate-community"]
    children: ["add-ci-workflow", "add-release-workflow", "add-dependency-bot"]
    max_concurrency: 3

  add-ci-workflow:
    step_id: "add-ci-workflow"
    type: "task"
    title: "Add CI workflow (lint, test, build)"
    task_ref: "task:add-ci-workflow"
    meta:
      guidance: |
        Create .github/workflows/ci.yml: push+PR triggers, lint→test→build,
        version matrix, dependency caching, coverage upload.

  add-release-workflow:
    step_id: "add-release-workflow"
    type: "task"
    title: "Add release workflow (tag → publish)"
    task_ref: "task:add-release-workflow"
    meta:
      tool: "goreleaser init (Go) OR semantic-release init (JS/TS)"
      commands: |
        goreleaser init && goreleaser check
        # or: npx semantic-release-cli setup

  add-dependency-bot:
    step_id: "add-dependency-bot"
    type: "task"
    title: "Configure Dependabot (or Renovate)"
    task_ref: "task:add-dependency-bot"
    meta:
      tool: "npx create-renovate-config OR gh CLI heredoc"
      commands: |
        npx create-renovate-config
        # or write .github/dependabot.yml directly

  gate-cicd:
    step_id: "gate-cicd"
    type: "task"
    title: "eva gate: CI + release workflow YAML is structurally valid"
    task_ref: "task:gate-cicd"
    depends_on: ["cicd-parallel"]
    meta:
      tool: "eva"
      commands: |
        eva run \
          --dataset evals/oss-release/oss-cicd-dataset.yaml \
          --no-tui
      eva_contract: "evals/oss-release/oss-cicd.yaml"
      eva_contract_body: |
        name: oss_cicd_gate
        provider: filesystem
        evaluators:
          - name: contains
            substring: "on:"
            mode: binary              # workflow has trigger block
          - name: regex
            pattern: "push:|pull_request:"
            mode: binary
          - name: contains
            substring: "jobs:"
            mode: binary
          - name: regex
            pattern: "on:\\s*\\n\\s*push:\\s*\\n\\s*tags:"
            mode: binary              # release workflow triggered on tags

  # ── Phase 6: Final Gate (sequential) ─────────────────────────────────────────

  join-all-prep:
    step_id: "join-all-prep"
    type: "join"
    title: "All prep phases complete"
    wait_for: ["gate-cicd"]

  final-review:
    step_id: "final-review"
    type: "task"
    title: "Final review: checklist walk-through"
    task_ref: "task:final-review"
    depends_on: ["join-all-prep"]
    meta:
      guidance: |
        Walk through the OSS release checklist:
        - No secrets or private refs in history (re-run gitleaks)
        - All eva gates passed
        - README renders correctly on GitHub
        - Repo description, topics, homepage set in GitHub Settings
        - Branch protection rules enabled on main

  run-full-test-suite:
    step_id: "run-full-test-suite"
    type: "task"
    title: "Run full test suite; confirm green"
    task_ref: "task:run-full-test-suite"
    depends_on: ["final-review"]
    meta:
      tool: "just / make"
      commands: |
        just check      # exits non-zero on any failure

  cut-initial-tag:
    step_id: "cut-initial-tag"
    type: "task"
    title: "Cut initial release tag (v0.1.0 or v1.0.0)"
    task_ref: "task:cut-initial-tag"
    depends_on: ["run-full-test-suite"]
    meta:
      tool: "gh CLI"
      commands: |
        VERSION="v0.1.0"
        git tag -s "${VERSION}" -m "Initial public release"
        git push origin "${VERSION}"
        gh release create "${VERSION}" --generate-notes --title "${VERSION}"
      guidance: |
        - Confirm version string with owner before tagging (LLM decision)

  gate-release:
    step_id: "gate-release"
    type: "task"
    title: "eva gate: GitHub Release exists and is well-formed"
    task_ref: "task:gate-release"
    depends_on: ["cut-initial-tag"]
    meta:
      tool: "eva + gh CLI"
      commands: |
        # Fetch release JSON from gh and pipe as the eval target
        gh release view "${VERSION}" --json name,tagName,body \
          | eva run \
              --dataset evals/oss-release/oss-release-dataset.yaml \
              --no-tui
      eva_contract: "evals/oss-release/oss-release.yaml"
      eva_contract_body: |
        name: oss_release_gate
        provider: gh_release
        evaluators:
          - name: contains
            substring: "tagName"
            mode: binary
          - name: regex
            pattern: "v[0-9]+\\.[0-9]+\\.[0-9]+"
            mode: binary
          - name: contains
            substring: "body"         # release notes present
            mode: binary

flow_id: "flow:sequential-chain:1.0"
name: "Sequential Chain"
version: "1.0"
description: "Three-step A->B->C chain — validates dependency ordering and output propagation"
entry_step: "analyze"
agent:
  name: claude

steps:
  analyze:
    step_id: "analyze"
    type: "task"
    title: "Analyze input"
    task_template:
      title: "Analyze input data"
      description: |
        Read input and produce a structured analysis summary.
      requirements:
        capabilities: ["analysis"]

  transform:
    step_id: "transform"
    type: "task"
    title: "Transform analysis"
    depends_on: ["analyze"]
    task_template:
      title: "Transform analysis into actionable items"
      description: |
        Take the analysis output and transform it into
        a list of actionable items with priorities.
      requirements:
        capabilities: ["transformation"]

  report:
    step_id: "report"
    type: "task"
    title: "Generate report"
    depends_on: ["transform"]
    task_template:
      title: "Generate final report"
      description: |
        Compile the transformed items into a final report
        with summary and recommendations.
      requirements:
        capabilities: ["reporting"]

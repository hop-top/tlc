flow_id: "flow:writing-plans:1.0"
name: "Writing Implementation Plans"
version: "1.0"
description: "Create detailed implementation plans before coding"
entry_step: "understand-requirements"
agent: claude

config:
  category: "planning"
  triggers:
    - "ready to implement"
    - "design approved"
    - "feature scoped"

  procedure: |
    ## Writing Implementation Plans

    1. **Understand Requirements**
       - Review design document
       - Clarify acceptance criteria
       - Identify constraints

    2. **Break Down Into Steps**
       - Identify logical chunks
       - Order by dependencies
       - Estimate complexity (not time)

    3. **Identify Critical Files**
       - Files to create
       - Files to modify
       - Files to read for context

    4. **Plan Verification**
       - How to test each step
       - End-to-end verification
       - Rollback strategy

    5. **Document Plan**
       - Write to docs/plans/
       - Include file paths
       - Include verification steps

steps:
  understand-requirements:
    step_id: "understand-requirements"
    type: "task"
    title: "Understand requirements and constraints"
    task_template:
      title: "Review and clarify requirements"
      description: |
        - Review design document
        - List acceptance criteria
        - Identify constraints (technical, business, timeline)
        - Clarify unknowns
      requirements:
        capabilities: ["requirements-gathering", "user-interaction"]

  break-down-steps:
    step_id: "break-down-steps"
    type: "task"
    title: "Break implementation into logical steps"
    depends_on: ["understand-requirements"]
    task_template:
      title: "Create step-by-step implementation plan"
      description: |
        Break work into logical chunks:
        - Each step should be independently testable
        - Order by dependencies
        - Estimate complexity (S/M/L, not hours)
        - Identify risky/uncertain areas
      requirements:
        capabilities: ["planning", "architecture-analysis"]
        domains: ["system-design"]

  identify-files:
    step_id: "identify-files"
    type: "task"
    title: "Identify critical files"
    depends_on: ["break-down-steps"]
    task_template:
      title: "List files to create/modify/read"
      description: |
        For each implementation step, identify:
        - Files to create (with purpose)
        - Files to modify (with changes)
        - Files to read for context

        Include full file paths.
      requirements:
        capabilities: ["codebase-exploration", "planning"]
        tools: ["grep", "git"]

  plan-verification:
    step_id: "plan-verification"
    type: "task"
    title: "Plan verification strategy"
    depends_on: ["identify-files"]
    task_template:
      title: "Define how to verify each step"
      description: |
        For each step, define:
        - Unit tests to write
        - Integration tests needed
        - Manual verification steps
        - End-to-end verification
        - Rollback procedure
      requirements:
        capabilities: ["testing", "planning"]

  document-plan:
    step_id: "document-plan"
    type: "task"
    title: "Write implementation plan document"
    depends_on: ["plan-verification"]
    task_template:
      title: "Write plan to docs/plans/"
      description: |
        Write implementation plan to docs/plans/YYYY-MM-DD-<topic>-plan.md

        Include:
        - Objective
        - Implementation steps (numbered)
        - Critical files
        - Verification strategy
        - Risks and mitigation

        Format: Clear, scannable, executable
      requirements:
        capabilities: ["technical-writing", "documentation"]
        tools: ["markdown"]

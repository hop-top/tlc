flow_id: "flow:retry-timeout:1.0"
name: "Retry and Timeout"
version: "1.0"
description: |
  Demonstrates retry with backoff, timeout enforcement, on_failure
  continue, and run_always teardown. A flaky step retries up to 3
  times. A separate test run validates timeout killing a long step.
  Teardown runs regardless of outcome.
entry_step: "setup"

config:
  category: "resilience"
  triggers:
    - "deploy with retries"
    - "resilient pipeline"

  inputs:
    service_url:
      description: "URL of the service to deploy/verify"
      required: true

  procedure: |
    ## Retry and Timeout Flow

    1. Setup environment
    2. Deploy (flaky — may fail, retries up to 3x with 1s backoff)
    3. Health check (timeout enforced)
    4. Teardown (always runs, even after failure)

    ### Flow graph

    ```
    setup
      └── deploy-service  (retry: 3, backoff: 1s)
            └── health-check  (timeout: 5s, on_failure: continue)
                  └── teardown  (run_always: true)
    ```

steps:

  setup:
    step_id: "setup"
    type: "task"
    title: "Setup environment"
    task_template:
      title: "Prepare deployment environment"
      description: |
        Provision temporary resources needed for the deploy.
      requirements:
        capabilities: ["provisioning"]
        tools: ["terraform"]

  deploy-service:
    step_id: "deploy-service"
    type: "task"
    title: "Deploy service (flaky)"
    depends_on: ["setup"]
    retry:
      max_attempts: 3
      backoff: "1s"
    task_template:
      title: "Deploy service with retry"
      description: |
        Push service to target environment. This step is known to be
        flaky (network timeouts, rate limits). Retry policy handles
        transient failures.
      requirements:
        capabilities: ["deployment"]
        tools: ["wrangler"]

  health-check:
    step_id: "health-check"
    type: "task"
    title: "Health check"
    depends_on: ["deploy-service"]
    timeout: "5s"
    on_failure: continue
    task_template:
      title: "Verify service health"
      description: |
        Hit the health endpoint and verify the service is responding.
        If this times out, the flow continues to teardown.
      requirements:
        capabilities: ["verification"]
        tools: ["curl"]

  teardown:
    step_id: "teardown"
    type: "task"
    title: "Teardown environment"
    depends_on: ["health-check"]
    run_always: true
    task_template:
      title: "Clean up temporary resources"
      description: |
        Destroy temporary infrastructure regardless of whether the
        deploy or health check succeeded or failed.
      requirements:
        capabilities: ["provisioning"]
        tools: ["terraform"]

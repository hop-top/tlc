flow_id: "flow:ci:full-pipeline:1.0"
name: "Full CI/CD Pipeline"
version: "1.0"
description: "Complete CI/CD pipeline with build, test, and deploy stages"
entry_step: "orchestrate-pipeline"

config:
  category: "ci-cd"
  triggers:
    - "run ci pipeline"
    - "deploy to production"

  procedure: |
    ## CI/CD Pipeline

    Orchestrated multi-stage pipeline:

    1. **Build Stage**
       - Compile code
       - Build artifacts
       - Create container images

    2. **Test Stage**
       - Run unit tests
       - Run integration tests
       - Generate coverage reports

    3. **Deploy Stage**
       - Deploy to staging
       - Run smoke tests
       - Deploy to production (if approved)

steps:
  orchestrate-pipeline:
    step_id: "orchestrate-pipeline"
    type: "task"
    task_template:
      title: "Orchestrate CI/CD pipeline for {{project}}"
      description: |
        Coordinate full pipeline execution:
        - Project: {{project}}
        - Branch: {{branch}}
        - Environment: {{environment}}

        This task will create and delegate subtasks for:
        1. Build
        2. Test
        3. Deploy

      requirements:
        capabilities: ["pipeline-orchestration", "deployment-coordination"]
        tools: []

      context:
        inherit: [project, branch, environment, version]

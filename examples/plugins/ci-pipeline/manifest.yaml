name: ci-pipeline
version: 1.0.0
description: CI/CD pipeline orchestration - demonstrates delegation and monitoring

provides:
  flows:
    - id: "flow:ci:full-pipeline:1.0"
      file: "flows/full-pipeline.yaml"
      description: "Complete CI/CD pipeline: build, test, deploy"

  assignees:
    - id: "assignee:pipeline-orchestrator:1.0"
      file: "assignees/pipeline-orchestrator.yaml"
      execution_type: orchestrator
      description: "Orchestrate multi-stage pipeline execution"
      patterns: [delegation, monitoring]

    - id: "assignee:build-executor:1.0"
      file: "assignees/build-executor.yaml"
      execution_type: executor
      description: "Execute build commands"

  executors:
    - id: "executor:pipeline-orchestrator:1.0"
      entry_point: "./bin/pipeline-orchestrator"
      protocol: jsonrpc

requires:
  tlc_version: ">=0.2.0"

permissions:
  - process.spawn

author: "TLC Examples"
license: "MIT"
repository: "github.com/tlc-plugins/ci-pipeline"

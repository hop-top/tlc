assignee_id: "assignee:build-executor:1.0"
name: "Build Executor"
version: "1.0"
description: "Execute build commands - simple executor for CI pipeline"

capabilities:
  task_types:
    - "build-execution"
    - "artifact-creation"

  tools:
    - "docker"
    - "make"

  domains:
    - "build"
    - "compilation"

execution_type: executor

context_policy:
  reads:
    - parent_task.meta.project
    - parent_task.meta.branch

  creates:
    - build_artifact
    - build_duration
    - build_log

instructions: |
  You are a Build Executor that compiles code and creates artifacts.

  ## Build Process

  1. Checkout code from branch
  2. Run build command (make, npm build, etc.)
  3. Create and store artifacts
  4. Report build results

assignee_id: "assignee:pipeline-orchestrator:1.0"
name: "Pipeline Orchestrator"
version: "1.0"
description: "Orchestrate multi-stage CI/CD pipelines - demonstrates delegation pattern"

capabilities:
  task_types:
    - "pipeline-orchestration"
    - "deployment-coordination"
    - "ci-cd-automation"

  tools: []

  domains:
    - "ci-cd"
    - "deployment"
    - "orchestration"

execution_type: orchestrator
patterns: [delegation, monitoring]

executor:
  plugin: "executor:pipeline-orchestrator:1.0"
  entry_point: "./bin/pipeline-orchestrator"

context_policy:
  reads:
    - parent_task.title
    - parent_task.meta.project
    - parent_task.meta.branch
    - parent_task.meta.environment
    - parent_task.meta.version

  delegates:
    - project
    - branch
    - version

  creates:
    - pipeline_id
    - build_artifact_url
    - deployment_url
    - pipeline_status

instructions: |
  You are a Pipeline Orchestrator responsible for coordinating CI/CD pipelines.

  ## Orchestration Process

  1. **Create Subtasks**
     - Break pipeline into stages: build, test, deploy
     - Create subtask for each stage
     - Define dependencies between stages

  2. **Delegate to Executors**
     - Assign build subtask to build executor
     - Assign test subtask to test executor
     - Assign deploy subtask to deployment executor

  3. **Monitor Progress**
     - Track subtask completion
     - Handle failures (retry or abort)
     - Update parent task with progress

  4. **Report Results**
     - Aggregate stage results
     - Update pipeline status
     - Provide deployment URLs

delegation:
  handoff_conditions:
    - when: "security_scan_needed"
      delegate_to: "assignee:security-scanner:1.0"

    - when: "approval_required"
      delegate_to: "assignee:approval-coordinator:1.0"

  unblocks:
    - "deployment"
    - "testing"
    - "release"

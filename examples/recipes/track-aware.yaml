recipe: track-aware
version: 1.0.0
description: |
  Operate on a track's tasks in dependency order: resolve the task graph,
  execute each task respecting blocked-by constraints, then verify that
  every task is done.
agent: claude
vars:
  track:
    description: Track ID to operate on
    required: true
steps:
  - id: resolve-tasks
    title: "Resolve tasks for track {{track}}"
    description: |
      List all TODO tasks for track {{track}}, build the dependency
      graph, produce a topological execution order.

  - id: execute-tasks
    title: "Execute tasks for track {{track}}"
    depends_on: [resolve-tasks]
    description: |
      Run each task in dependency order for track {{track}}.
      Mark each DONE on completion. Skip already-completed tasks.

  - id: verify-completion
    title: "Verify all tasks done for track {{track}}"
    depends_on: [execute-tasks]
    description: |
      Gate: confirm all tasks linked to track {{track}} are DONE.
      Fail if any remain TODO or IN_PROGRESS.

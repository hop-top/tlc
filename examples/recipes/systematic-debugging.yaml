recipe: systematic-debugging
version: 1.0.0
description: Systematic approach to debugging - find the root cause before fixing
track:
  title: Systematic debugging
  type: bug
  plan: |
    ## The Iron Law

    NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST

    ## The Four Phases

    ### Phase 1: Root Cause Investigation

    1. Read Error Messages Carefully
    2. Reproduce Consistently
    3. Check Recent Changes
    4. Gather Evidence in Multi-Component Systems
    5. Trace Data Flow

    ### Phase 2: Pattern Analysis

    1. Find Working Examples
    2. Compare Against References
    3. Identify Differences
    4. Understand Dependencies

    ### Phase 3: Hypothesis and Testing

    1. Form Single Hypothesis
    2. Test Minimally
    3. Verify Before Continuing

    ### Phase 4: Implementation

    1. Create Failing Test Case
    2. Implement Single Fix
    3. Verify Fix
    4. If 3+ Fixes Failed: Question Architecture
steps:
  - id: read-errors
    title: Analyze error messages and stack traces
    description: |
      Read error messages completely:
      - Don't skip past errors
      - Read stack traces completely
      - Note line numbers, file paths, error codes

  - id: reproduce
    title: Create reliable reproduction steps
    depends_on: [read-errors]
    description: |
      Can you trigger it reliably?
      - What are the exact steps?
      - Does it happen every time?
      - If not reproducible → gather more data

      Document minimal reproduction case.

  - id: check-changes
    title: Investigate what changed
    depends_on: [reproduce]
    description: |
      What changed that could cause this?
      - Git diff, recent commits
      - New dependencies, config changes
      - Environmental differences

      Use git bisect if needed.

  - id: gather-evidence
    title: Add diagnostic instrumentation
    depends_on: [check-changes]
    description: |
      For multi-component systems, add logging at each boundary:
      - Log what enters each component
      - Log what exits each component
      - Verify environment/config propagation
      - Check state at each layer

      Run once to identify WHERE it breaks.

  - id: pattern-analysis
    title: Compare broken vs working code
    depends_on: [gather-evidence]
    description: |
      1. Find Working Examples
         - Locate similar working code
      2. Compare Against References
         - Read reference implementation completely
      3. Identify Differences
         - List every difference, however small
      4. Understand Dependencies
         - What settings, config, environment needed?

  - id: form-hypothesis
    title: State hypothesis and test minimally
    depends_on: [pattern-analysis]
    description: |
      1. Form Single Hypothesis
         - "I think X is the root cause because Y"
      2. Test Minimally
         - Make SMALLEST possible change
         - One variable at a time
      3. Verify
         - Did it work? → Proceed to fix
         - Didn't work? → Form NEW hypothesis

  - id: create-test
    title: Write automated failing test
    depends_on: [form-hypothesis]
    description: |
      Create simplest possible reproduction:
      - Automated test if possible
      - One-off test script if no framework
      - MUST have before fixing

  - id: implement-fix
    title: Fix root cause with single change
    depends_on: [create-test]
    description: |
      1. Address the root cause identified
      2. ONE change at a time
      3. No "while I'm here" improvements
      4. No bundled refactoring

      Then verify:
      - Test passes now?
      - No other tests broken?
      - Issue actually resolved?

  - id: verify-fix
    title: Confirm fix resolves the issue
    depends_on: [implement-fix]
    description: |
      - Test passes?
      - No other tests broken?
      - Issue actually resolved in original context?

      If fix doesn't work:
      - Count: How many fixes tried? (< 3: return to Phase 1)
      - If ≥ 3 fixes failed: Question the architecture

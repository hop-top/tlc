recipe: track-consolidate
version: 1.0.0
description: Audit tracks against the code; end with fewer tracks, no work lost
agent: claude
vars:
  scope:
    description: "Tracks in scope: a topic to match track titles and plans against, or track ids separated by spaces"
    required: true
  keep:
    description: "Pinned track ids, space-separated: never closed, abandoned or merged away; they may gain tasks"
    default: ""
  exclude:
    description: "Track ids to leave out of scope, space-separated"
    default: ""
  code_root:
    description: "Path of the code every open task is verified against"
    default: "."
  workdir:
    description: "Directory for the inventory, verification, proposal, apply script and logs"
    default: track-consolidate
track:
  title: "Consolidate tracks: {{scope}}"
  type: chore
  plan: |
    # Consolidate tracks

    Scope: {{scope}}
    Pinned (never removed): {{keep}}
    Excluded: {{exclude}}
    Code verified against: {{code_root}}
    Working files: {{workdir}}/

    ## Objective

    Audit the tracks in scope and end with fewer tracks without losing
    work. Every open task ends up done with evidence, skipped with a
    reason, or still open on a track that survives.

    ## Read-only until approval

    Inventory, verification, the regrouping proposal and the apply
    script are agent work that reads tlc and the code and writes only
    under {{workdir}}/. Nothing in tlc changes before the operator
    approves the approval task.

    ## Known tlc gotchas the apply script encodes

    - Tracks have no bypass: pending, then active, then abandoned or
      completed.
    - An empty track cannot be activated, but it can be abandoned
      straight from pending.
    - Abandoning a track skips the tasks still open on it: move them
      first.
    - `--note` is recorded only on a status transition; a note on a
      plain field update is dropped.
    - Blocker edges show only in the human `tlc task show` view; the JSON
      output omits them.
steps:
  - id: inventory
    title: "Inventory the tracks in scope: {{scope}}"
    description: |
      Read-only. Build the list of tracks this run audits.

      1. Resolve the scope "{{scope}}". When it is a list of track ids,
         take those. Otherwise treat it as a topic: run
         `tlc track list --format json` and keep the tracks whose title
         or plan matches it.
      2. Drop the excluded tracks: "{{exclude}}". Drop the track this
         run itself created, if any.
      3. Mark the pinned tracks: "{{keep}}". A pinned track is never
         closed, abandoned or merged away; it may gain tasks.
      4. For each track record its id, title, status, type, task counts
         by status and progress, from `tlc track show <id>` and
         `tlc task list --track <id> --format json`.

      Write {{workdir}}/inventory.md: one table of tracks (id, title,
      status, pinned, done/total) and, per track, its open tasks (id,
      title, status, blocked-by). End your summary with the track count.

  - id: verify-tasks
    title: Verify every open task against the code
    depends_on: [inventory]
    description: |
      Read-only. For every open task in {{workdir}}/inventory.md, check
      the code under {{code_root}} and the git history, not just the tlc
      state. Classify it as exactly one of:

      - DONE: the work exists. Cite concrete evidence, a file:line or a
        commit SHA. No evidence, no DONE.
      - SUPERSEDED: other work replaced it. Cite the replacement (task,
        commit or file).
      - DUPLICATE: another task covers it. Cite the canonical task id.
      - STILL OPEN: the work is not done. Every uncertain case lands
        here, with a note saying what is unclear.

      Also:

      - A task that is partly done is NARROWED: keep it open and propose
        a new title or note covering only what remains, citing what is
        already done.
      - A task that belongs to a different domain or language than its
        track (for example a Python task on a Go track) is flagged
        MISPLACED with the domain it belongs to, so it can move to that
        side's track.

      Write {{workdir}}/verification.md: one row per task with id,
      track, verdict, evidence and note. Do not change anything in tlc.

  - id: propose-regroup
    title: Propose the regrouping
    depends_on: [verify-tasks]
    description: |
      Read-only. From {{workdir}}/inventory.md and
      {{workdir}}/verification.md, propose the smallest set of tracks
      that keeps every STILL OPEN and NARROWED task:

      - tracks to complete (no open work left), abandon (nothing worth
        keeping) or merge into another track;
      - the landing track of every task that stays open, MISPLACED
        tasks included;
      - renames of the tracks that survive;
      - blocked-by edges that point at tasks about to be skipped, and
        what each one is rewired to (the canonical or replacement task,
        or dropped);
      - the track count before and after.

      Pinned tracks ({{keep}}) are never completed, abandoned or merged
      away; they may only gain tasks. Close with a list of open
      questions for the operator.

      Write {{workdir}}/proposal.md. Do not change anything in tlc.

  - id: generate-script
    title: Generate the apply script
    depends_on: [propose-regroup]
    description: |
      Read-only in tlc. Turn {{workdir}}/proposal.md into
      {{workdir}}/apply.sh: a POSIX sh script of exact tlc commands, in
      this order:

      1. DONE tasks: `tlc task complete <id> --note "<evidence>"`.
      2. SUPERSEDED and DUPLICATE tasks:
         `tlc task skip <id> --note "superseded by <ref>"` or
         `--note "duplicate of <id>"`.
      3. Moves: `tlc task update <id> --track <track-id>`.
      4. Rescopes of NARROWED tasks: `tlc task update <id> --title "..."`.
         A note is recorded only on a status transition, so put the
         rescope note on one (for example claiming the task with
         `--status IN_PROGRESS --note "..."`), or into the description.
      5. Edge rewiring: `tlc task update <id> --remove-blocked-by <old>`
         then `--add-blocked-by <new>`. Same-project edges take the bare
         task id.
      6. Track transitions, last: `tlc track update <id> --title "..."`
         for renames, then status changes. Tracks have no bypass:
         pending goes to active before completed or abandoned. An empty
         track cannot be activated; abandon it straight from pending
         with `tlc track abandon <id>`. Abandoning skips every task still
         open on the track, so a track is abandoned only after its open
         tasks have moved.

      Never touch a pinned track ({{keep}}) except to move tasks onto it.

      The script runs every command even when one fails: no `set -e`.
      Wrap each command in a `run` helper that echoes it, appends any
      failure (exit code and command) to {{workdir}}/apply-failures.log,
      and carries on. The script ends by printing how many commands ran
      and how many failed, and exits 0 so the verify step always runs.

      Do not run the script.

  - id: approve
    kind: human
    title: Approve the consolidation apply script
    depends_on: [generate-script]
    description: |
      Nothing has been written to tlc yet. Read {{workdir}}/proposal.md
      and {{workdir}}/apply.sh, edit the script if needed, and answer
      the open questions in the proposal.

      Approve with `tlc task approve <this-task>` to run the script.
      Reject with `tlc task reject <this-task> --reason "..."` and
      nothing is applied.

  - id: apply
    kind: exec
    title: Apply the approved consolidation script
    depends_on: [approve]
    exec:
      argv: [sh, "{{workdir}}/apply.sh"]
      timeout: 30m
    description: |
      Run {{workdir}}/apply.sh as approved. Each failing command is
      logged to {{workdir}}/apply-failures.log and the script keeps
      going.

  - id: verify
    title: Verify the consolidated tracks
    depends_on: [apply]
    description: |
      Read-only. Check the result of the apply step:

      1. Re-show every track from {{workdir}}/proposal.md with
         `tlc track show <id>` and compare status, title and task
         counts with what the proposal promised.
      2. Check every rewired edge in the human `tlc task show <id>` view
         ("Blocked By" and "Blocking"); the JSON output omits edges. The
         view can lag the write by one read, so re-read before calling an
         edge missing.
      3. Confirm no pinned track ({{keep}}) was completed, abandoned or
         lost a task, and no task that was open is now missing.
      4. Read {{workdir}}/apply-failures.log.

      Write {{workdir}}/report.md: the track count before and after,
      every command that failed and why, every mismatch with the
      proposal, and the follow-ups left for the operator.

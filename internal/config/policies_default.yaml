# tlc default policy bundle.  Loaded by internal/cli/policy.go when no
# user policies file is present at $XDG_CONFIG_HOME/tlc/policies.yaml,
# and seeded into that path on first boot for adopters to extend.
#
# The single shipped rule mirrors kit/runtime/policy/e2e/testdata/
# delete-requires-note.yaml: deletes must carry a non-empty `--note` so
# the audit log explains why the row went away.  Non-destructive
# transitions stay open by default — additional rules belong in the
# user file (or a tlc-shipped opt-in bundle), not here.
policies:
  - name: delete-requires-note
    on: kit.runtime.entity.pre_persisted
    when: 'payload.Op != "delete" || context.note != ""'
    effect: allow
    otherwise: deny
    message: "deleting a task requires --note explaining why"

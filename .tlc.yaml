git:
    branch:
        prefix_from_type: true
        separator: /
        zero_pad_issue: 4
    commit:
        auto_generate: true
        template: '{type}: {description} (closes #{issue})'
    worktree:
        auto_create: true
        directory: .worktrees
output:
    color: true
    format: table
    log_file: .tlc/tlc.log
    quiet: false
    verbose: false
storage:
    backend: sqlite
    db_path: .tlc/db.sqlite
task:
    auto_assign: false
    default_status: TODO
    id_format: T-{seq:04d}
    require_reference: true
    todo_file: TODO
ui:
    date_format: "2006-01-02 15:04:05"
    editor: vim
    pager: auto
    table_style: unicode
    tag_colors:
        actions: "118"
        api: "39"
        auth: "39"

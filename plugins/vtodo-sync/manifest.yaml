name: vtodo-sync
version: 0.1.0
type: external-sync
description: iCalendar VTODO synchronization (file or CalDAV)

# Capabilities
capabilities:
  - sync.pull
  - sync.push
  - sync.bidirectional

# Entry point
entry_point: ./bin/vtodo-sync

# Dependencies
requires:
  tlc_version: ">=0.1.0"

# Configuration schema
config_schema:
  type: object
  properties:
    source:
      type: string
      description: "file:///path/to/cal.ics (CalDAV not yet supported)"
      required: true
    sync_direction:
      type: string
      enum: [pull, push, bidirectional]
      default: bidirectional
    include_logs:
      type: boolean
      default: false

# Permissions required
permissions:
  - filesystem.read
  - filesystem.write

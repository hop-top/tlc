name: jira-sync
version: 0.1.0
type: external-sync
description: Jira issue synchronization

# Capabilities
capabilities:
  - sync.pull
  - sync.push
  - sync.bidirectional

# Entry point
entry_point: ./bin/jira-sync

# Dependencies
requires:
  tlc_version: ">=0.1.0"

# Configuration schema
config_schema:
  type: object
  properties:
    url:
      type: string
      required: true
    project:
      type: string
      required: true
    sync_direction:
      type: string
      enum: [pull, push, bidirectional]
      default: bidirectional

# Permissions required
permissions:
  - network.http: jira.com
  - credential.read: jira_email, jira_token
  - storage.read: tasks
  - storage.write: tasks

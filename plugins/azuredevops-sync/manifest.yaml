name: azuredevops-sync
version: 0.1.0
type: external-sync
description: Azure DevOps work item synchronization

# Capabilities
capabilities:
  - sync.pull
  - sync.push
  - sync.delete
  - sync.bidirectional

# Entry point
entry_point: ./bin/azuredevops-sync

# Dependencies
requires:
  tlc_version: ">=0.1.0"

# Configuration schema
config_schema:
  type: object
  properties:
    repo:
      type: string
      description: Azure DevOps project name
      required: true
    sync_direction:
      type: string
      enum: [pull, push, bidirectional]
      default: bidirectional

# Permissions required
permissions:
  - network.http
  - credential.read
